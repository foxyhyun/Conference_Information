# 학회별 핵심 정보 (카드에 항상 표시): format/review/proceedings/cadence 는 {ko, en} 한 줄, looks_for 는 {ko:[..], en:[..]}
# 공식 안내(리뷰어 가이드라인, CFP)에서 확인된 내용만. 모르면 null / []

cvpr:
  format:
    ko: 본문 8쪽 + 참고문헌 무제한 (CVPR 템플릿)
    en: 8 pages + unlimited references (CVPR template)
  review:
    ko: 이중맹검 · 1쪽 PDF rebuttal · OpenReview
    en: Double-blind · 1-page PDF rebuttal · OpenReview
  proceedings:
    ko: CVF 오픈액세스 (학회 2주 전 공개)
    en: CVF Open Access (2 weeks before conference)
  cadence:
    ko: 매년 개최 · 논문 마감 11월 중순 (연장 없음)
    en: Annual · paper deadline mid-November (no extensions)
  looks_for:
    ko:
      - 기술적 건전성 + 분야 기여 (technically sound)
      - 대담한 새 개념 환영, 데이터셋 수 적어도 OK
      - SOTA 미달 자체는 거절 사유 아님
      - 코드 제출 권장 · 기여 데이터셋은 카메라레디까지 공개
    en:
      - Technically sound + contribution to the field
      - Embrace novel, brave concepts even if few datasets
      - Not beating SOTA is not grounds for rejection
      - Code encouraged; claimed datasets public by camera-ready
  sources:
    - https://cvpr.thecvf.com/Conferences/2026/ReviewerGuidelines
    - https://cvpr.thecvf.com/Conferences/2026/CallForPapers
    - https://cvpr.thecvf.com/Conferences/2026/AuthorGuidelines
iccv:
  format:
    ko: 본문 8쪽 + 참고문헌 무제한 (ICCV 템플릿)
    en: 8 pages + unlimited references (ICCV template)
  review:
    ko: 이중맹검 · 1쪽 PDF rebuttal · OpenReview
    en: Double-blind · 1-page PDF rebuttal · OpenReview
  proceedings:
    ko: CVF 오픈액세스 + IEEE Xplore
    en: CVF Open Access + IEEE Xplore
  cadence:
    ko: '홀수 해 격년 · 논문 마감 3월 초 (2025: 3/7)'
    en: 'Odd years, biennial · deadline early March (2025: 3/7)'
  looks_for:
    ko:
      - 기술적 건전성 + 지식 진전(knowledge advance)
      - 대담한 새 개념 환영, 데이터셋 수 적어도 OK
      - SOTA/arXiv 미달만으로 거절 불가
      - 코드 제출 권장 · 기여 데이터셋은 카메라레디까지 공개
    en:
      - Technically sound; what knowledge advance it makes
      - Embrace novel, brave concepts even if few datasets
      - Not beating SOTA/arXiv is not sole grounds to reject
      - Code encouraged; claimed datasets public by camera-ready
  sources:
    - https://iccv.thecvf.com/Conferences/2025/ReviewerGuidelines
    - https://iccv.thecvf.com/Conferences/2025/CallForPapers
    - https://iccv.thecvf.com/Conferences/2025/AuthorGuidelines
eccv:
  format:
    ko: 본문 14쪽 + 참고문헌 무제한 (LNCS 템플릿)
    en: 14 pages + unlimited references (LNCS template)
  review:
    ko: 이중맹검 · 1쪽 2단 PDF rebuttal · OpenReview
    en: Double-blind · 1-page 2-col PDF rebuttal · OpenReview
  proceedings:
    ko: Springer LNCS + ECVA 오픈액세스
    en: Springer LNCS + ECVA open access
  cadence:
    ko: '짝수 해 격년 · 등록 마감 2월 말 (2026: 2/26)'
    en: 'Even years, biennial · registration late Feb (2026: 2/26)'
  looks_for:
    ko:
      - 대담한 새 개념 환영 · 'novelty fallacy' 경계
      - SOTA 미달 자체는 거절 사유 아님
      - Contribution Type별 심사 (데이터셋 논문에 새 방법 요구 X)
      - 코드 제출 권장 · 데이터셋 유형은 카메라레디까지 공개
    en:
      - Embrace brave concepts; avoid the 'novelty fallacy'
      - Not beating SOTA is not grounds for rejection
      - Judged per Contribution Type (datasets need no new method)
      - Code encouraged; Datasets type public by camera-ready
  sources:
    - https://eccv.ecva.net/Conferences/2026/ReviewerGuide
    - https://eccv.ecva.net/Conferences/2026/CallForPapers
    - https://eccv.ecva.net/Conferences/2026/SubmissionPolicies
wacv:
  format:
    ko: 본문 8쪽 + 참고문헌 무제한 (WACV 템플릿)
    en: 8 pages + unlimited references (WACV template)
  review:
    ko: 이중맹검 · 2라운드(R1 수정재투고+1쪽 rebuttal) · OpenReview
    en: Double-blind · 2 rounds (R1 revise+1-page rebuttal) · OpenReview
  proceedings:
    ko: CVF 오픈액세스 (학회 2주 전 공개)
    en: CVF Open Access (2 weeks before conference)
  cadence:
    ko: 매년 겨울(2~3월) 개최 · R1 7월, R2 9월 마감
    en: Every winter (Feb-Mar) · Round 1 July, Round 2 September
  looks_for:
    ko:
      - 'Applications: 시스템 수준 혁신·도메인 신규성·비교 평가'
      - 'Algorithms: 알고리즘 신규성 + 정량 비교 (CVPR류)'
      - 대담한 응용·개념 환영, 데이터셋 수 적어도 OK
      - Reproducibility Checklist 활용 · 코드 선택적 확인
    en:
      - 'Applications: systems-level innovation, domain novelty, comparison'
      - 'Algorithms: algorithmic novelty + quantified evaluation'
      - Embrace novel, brave applications even if few datasets
      - Reproducibility Checklist as guide; code optionally checked
  sources:
    - https://wacv.thecvf.com/Conferences/2027/ReviewerGuidelines
    - https://wacv.thecvf.com/Conferences/2026/CallForPapers
    - https://wacv.thecvf.com/Conferences/2027/AuthorGuides
neurips:
  format:
    ko: 본문 9쪽 + 참고문헌·체크리스트·부록 무제한
    en: 9 pages + unlimited refs, checklist and appendix
  review:
    ko: 이중맹검 · 1주 author response(수정본 불가) · OpenReview
    en: Double-blind · 1-week author response (no revision) · OpenReview
  proceedings:
    ko: null
    en: null
  cadence:
    ko: 매년 12월 개최
    en: Every December
  looks_for:
    ko:
      - 'Quality: 주장을 이론/실험이 뒷받침하는가'
      - 'Clarity: 전문가가 결과 재현 가능할 만큼 명확한가'
      - 'Significance: 커뮤니티가 쓰거나 발전시킬 결과인가'
      - 'Originality: 새 방법 없어도 새 통찰·이해면 인정'
    en:
      - 'Quality: claims supported by theory or experiments'
      - 'Clarity: enough detail for an expert to reproduce'
      - 'Significance: will others use or build on it?'
      - 'Originality: new insights count, not only new methods'
  sources:
    - https://neurips.cc/Conferences/2025/ReviewerGuidelines
    - https://neurips.cc/Conferences/2025/CallForPapers
    - https://neurips.cc/Conferences/2026/CallForPapers
iclr:
  format:
    ko: 본문 9쪽(rebuttal·카메라레디 10쪽) + 참고문헌·부록 무제한
    en: 9 pages (10 at rebuttal/camera-ready) + unlimited refs/appendix
  review:
    ko: 공개 리뷰(저자 익명) · 3주 공개 토론·수정 가능 · OpenReview
    en: Open review (authors anonymous) · 3-week discussion, revisions · OpenReview
  proceedings:
    ko: OpenReview 오픈액세스 (별도 출판사 없음)
    en: Open access on OpenReview (no publisher)
  cadence:
    ko: 매년 4월 말~5월 초 개최 · 리뷰 토론 11~12월
    en: Late April-early May · review discussion Nov-Dec
  looks_for:
    ko:
      - 명확·기술적 정확·실험적 엄밀·재현 가능·새 발견
      - 동기 타당성 + 문헌 내 위치 설정
      - SOTA 결과 필수 아님 · SOTA 미달은 거절 사유 아님
      - 새롭고 관련 있고 영향력 있는 지식을 설득력 있게
    en:
      - Clear, technically correct, rigorous, reproducible, novel
      - Well motivated and well placed in the literature
      - SOTA not required; lack of SOTA is not grounds to reject
      - Convincingly demonstrate new, relevant, impactful knowledge
  sources:
    - https://iclr.cc/Conferences/2026/ReviewerGuide
    - https://iclr.cc/Conferences/2026/CallForPapers
    - https://iclr.cc/Conferences/2026/AuthorGuide
icml:
  format:
    ko: 본문 8쪽 + 참고문헌·Impact Statement·부록 무제한
    en: 8 pages + unlimited refs, impact statement, appendix
  review:
    ko: 이중맹검 · rebuttal·토론 (채택 시 리뷰 공개) · OpenReview
    en: Double-blind · rebuttal + discussion (reviews public if accepted) · OpenReview
  proceedings:
    ko: PMLR (오픈액세스)
    en: PMLR (open access)
  cadence:
    ko: '매년 7월 개최 · 논문 마감 1월 말 (2026: 1/28)'
    en: 'Every July · paper deadline late January (2026: 1/28)'
  looks_for:
    ko:
      - 'Soundness: 주장이 이론/실험으로 뒷받침되는가'
      - 'Significance: 중요한 문제·ML 이해/역량/실무 진전'
      - 'Originality: 새 방법 없어도 새 통찰이면 인정'
      - 한계·사회적 영향 솔직히 기술하면 가점
    en:
      - 'Soundness: claims supported by theory or experiments'
      - 'Significance: important problem; advances ML understanding'
      - Originality need not mean an entirely new method
      - Up-front limitations are rewarded, not punished
  sources:
    - https://icml.cc/Conferences/2026/ReviewerInstructions
    - https://icml.cc/Conferences/2026/CallForPapers
aaai:
  format:
    ko: 기술 본문 7쪽 + 참고문헌 1쪽 · 재현성 체크리스트 필수
    en: 7 pages + 1 reference page · reproducibility checklist required
  review:
    ko: 이중맹검 · 2단계(Phase1 AI 참고리뷰 포함) · 1회 author response
    en: Double-blind · 2-phase (AI advisory review in Phase 1) · 1 author response
  proceedings:
    ko: null
    en: null
  cadence:
    ko: 매년 1~2월 개최 · 초록 7월 말, 논문 8월 초 마감
    en: Every Jan-Feb · abstract late July, paper early August
  looks_for:
    ko:
      - 기여의 중요성·신규성 + 이론/실험적 건전성
      - AAAI 커뮤니티 관련성 + 서술 명확성
      - 새 영역 개척·새 방향 제시 > 점진적 개선
      - 재현성 조치(증명·실험 기록·코드/데이터 공개) 평가
    en:
      - Significance and novelty + theoretical/empirical soundness
      - Relevance to AAAI community + clarity of exposition
      - New territory / new directions over incremental gains
      - Steps to ensure reproducibility (proofs, code, data)
  sources:
    - https://aaai.org/conference/aaai/aaai-26/main-technical-track-call/
    - https://aaai.org/conference/aaai/aaai-26/review-process/
bmvc:
  format:
    ko: 본문 14쪽 + 참고문헌 무제한 (BMVC 템플릿)
    en: 14 pages + unlimited references (BMVC template)
  review:
    ko: 이중맹검 · 리뷰어 3명+AC 메타리뷰 · rebuttal · OpenReview
    en: Double-blind · 3 reviewers + AC meta-review · rebuttal · OpenReview
  proceedings:
    ko: BMVA 발행 proceedings
    en: Proceedings published by BMVA
  cadence:
    ko: '매년 개최 (2026: 11월) · 논문 마감 5월 말'
    en: 'Annual (2026: November) · paper deadline late May'
  looks_for:
    ko:
      - '심사 기준: 독창성·발표·실험 결과·평가 품질'
      - 'Brave New Ideas: 벤치마크 향상 없는 새 접근 환영'
      - SOTA 미달 자체는 거절 사유 아님
      - rebuttal에 대규모 추가 실험 요구 금지
    en:
      - Refereed on originality, presentation, results, evaluation
      - 'Brave New Ideas: novel approaches, not necessarily benchmark gains'
      - Not beating SOTA is not grounds for rejection
      - Reviewers must not ask for substantial new experiments
  sources:
    - https://bmvc2026.bmva.org/authors/reviewing-guidelines/
    - https://bmvc2026.bmva.org/calls/call-for-papers/
miccai:
  format:
    ko: 본문 8쪽 + 참고문헌 2쪽 (MICCAI LNCS 템플릿)
    en: 8 pages + 2 reference pages (MICCAI LNCS template)
  review:
    ko: 이중맹검 · 리뷰어 3명+AC · early accept/reject · 1주 rebuttal
    en: Double-blind · 3 reviewers + ACs · early accept/reject · 1-week rebuttal
  proceedings:
    ko: Springer LNCS + MICCAI Society 오픈액세스
    en: Springer LNCS + MICCAI Society open access
  cadence:
    ko: 매년 9~10월 개최 · 초록 2월 중순, 논문 2월 말 마감
    en: Every Sep-Oct · abstract mid-Feb, paper late February
  looks_for:
    ko:
      - '임상적 중요성: 주제가 clinically significant한가'
      - 방법 또는 응용의 혁신성 (새 알고리즘은 기여의 한 형태)
      - 데이터 수집·분할 설명, 환자 다양성, 통계 분석, 불확도
      - 오픈 데이터·코드 권장, 불가 시 상세 알고리즘 기술
    en:
      - Clinical significance of the topic
      - Innovative method OR innovative application
      - Data collection/splits, patient diversity, statistics, uncertainty
      - Open data/code encouraged; else detailed description
  sources:
    - https://conferences.miccai.org/2026/en/REVIEWER-GUIDELINES.html
    - https://conferences.miccai.org/2026/en/CALL-FOR-PAPERS.html
    - https://conferences.miccai.org/2026/en/PAPER-SUBMISSION-GUIDELINES.html
    - https://conferences.miccai.org/2026/en/THE-MICCAI-REVIEW-PROCESS.html
midl:
  format:
    ko: 본문 10쪽(카메라레디 12쪽) · Validation 트랙 14쪽 · 단편 3쪽
    en: 10 pages (12 camera-ready) · Validation track 14 · short 3
  review:
    ko: 단일맹검 · 약 1주 rebuttal+토론 · 메타리뷰 · OpenReview
    en: Single-blind · ~1-week rebuttal + discussion · meta-review · OpenReview
  proceedings:
    ko: PMLR (full paper만)
    en: PMLR (full papers only)
  cadence:
    ko: 매년 7월 개최 · 논문 마감 12월 초
    en: Every July · paper deadline early December
  looks_for:
    ko:
      - 'Main: 의료영상용 새 알고리즘·아키텍처·모델'
      - 'Validation: 데이터셋·기관·환자군 간 일반화 증거'
      - 신규성 부족 지적은 선행 연구 참조로 입증 필수
    en:
      - 'Main: new algorithms, architectures, models for imaging'
      - 'Validation: generalization across datasets/sites/populations'
      - Novelty concerns must cite prior work
  sources:
    - https://2026.midl.io/review-guidelines
    - https://2026.midl.io/call-for-papers
isbi:
  format:
    ko: 4쪽 full paper (IEEE 형식) 또는 1쪽 abstract
    en: 4-page full paper (IEEE format) or 1-page abstract
  review:
    ko: null
    en: null
  proceedings:
    ko: IEEE Xplore (4쪽 논문, 현장 발표 조건)
    en: IEEE Xplore (4-page papers, if presented on site)
  cadence:
    ko: 매년 4~5월 개최 · 4쪽 논문 11월 초, 1쪽 2월 마감
    en: Every Apr-May · 4-page papers early Nov, abstracts Feb
  looks_for:
    ko: []
    en: []
  sources:
    - https://biomedicalimaging.org/2027/
    - https://biomedicalimaging.org/2026/
ipmi:
  format:
    ko: 본문 12쪽 + 참고문헌 (LNCS) · 보충자료 불허
    en: 12 pages + references (LNCS) · no supplementary material
  review:
    ko: 이중맹검 · 토론 기간 · OpenReview
    en: Double-blind · discussion period · OpenReview
  proceedings:
    ko: Springer LNCS
    en: Springer LNCS
  cadence:
    ko: '홀수 해 격년, 6~7월 개최 · 논문 마감 12월 (2026: 12/14)'
    en: 'Odd years, Jun-Jul · paper deadline Dec (2026: 12/14)'
  looks_for:
    ko:
      - '''Algorithms with a Soul'': 돌파구·엄밀한 분석'
      - 리더보드 경쟁 아님 (not leaderboard chasing)
      - 혁신적 알고리즘 + 건전한 이론적 토대
    en:
      - '''Algorithms with a Soul'': breakthroughs, rigorous analysis'
      - Not leaderboard chasing
      - Innovative algorithms and sound theoretical foundations
  sources:
    - https://2027.ipmi-conf.org/
embc:
  format:
    ko: Full paper 4~7쪽 또는 1쪽 포스터 논문
    en: Full paper 4-7 pages or 1-page poster paper
  review:
    ko: 단일맹검 · 테마·키워드 기반 배정
    en: Single-blind · assigned by theme and keywords
  proceedings:
    ko: IEEE Xplore + PubMed/MEDLINE (full paper만)
    en: IEEE Xplore + PubMed/MEDLINE (full papers only)
  cadence:
    ko: '매년 7월 개최 (2026: 7/26~30)'
    en: 'Every July (2026: Jul 26-30)'
  looks_for:
    ko: []
    en: []
  sources:
    - https://embc.embs.org/2026/papers/
    - https://embc.embs.org/2026/
spie-mi:
  format:
    ko: 초록 200~300단어 + 심사용 2~4쪽 PDF → 채택 후 4쪽+ 원고
    en: 200-300-word abstract + 2-4 page review PDF; 4+ page manuscript later
  review:
    ko: 학회 chair/editor가 기술적 가치·적합성 심사
    en: Conference chairs/editors assess technical merit and fit
  proceedings:
    ko: Proceedings of SPIE (SPIE Digital Library)
    en: Proceedings of SPIE (SPIE Digital Library)
  cadence:
    ko: 매년 2월 개최 · 초록 마감 8월 초
    en: Every February · abstract deadline early August
  looks_for:
    ko:
      - 기술적 가치(technical merit)와 내용 적합성
    en:
      - Technical merit and suitability of content
  sources:
    - https://www.spie.org/conferences-and-exhibitions/medical-imaging/presenters/abstract-submission-guidelines
icip:
  format:
    ko: 5쪽 + 참고문헌 1쪽 · OJSP 트랙 8+1쪽
    en: 5 pages + 1 reference page · OJSP track 8+1
  review:
    ko: 이중맹검 · author rebuttal
    en: Double-anonymous · author rebuttal
  proceedings:
    ko: IEEE Xplore (Open Preview)
    en: IEEE Xplore (Open Preview)
  cadence:
    ko: '매년 개최 (2026: 9월) · 논문 마감 2월 초'
    en: 'Annual (2026: September) · paper deadline early February'
  looks_for:
    ko:
      - '원저 기술 연구: 이론·방법·시스템·응용'
      - 뛰어난 성숙도/신규성 논문은 Spotlight + 확장판 신속 심사
    en:
      - 'Original technical work: theory, methods, systems, applications'
      - 'Exceptional maturity/novelty: Spotlight + expedited extension review'
  sources:
    - https://2026.ieeeicip.org/call-for-papers-and-abstracts/
    - https://2026.ieeeicip.org/
icassp:
  format:
    ko: 본문 4쪽 + 참고문헌 1쪽 (총 5쪽) · OJSP 트랙 8+1쪽
    en: 4 pages + 1 reference page (5 total) · OJSP track 8+1
  review:
    ko: 단일맹검 · 리뷰어 3명 · 선택적 rebuttal(AC만 열람)
