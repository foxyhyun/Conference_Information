# =====================================================================
#  학회/저널 마스터 목록  —  이 파일만 직접 수정하면 됩니다.
# =====================================================================
#  fields (분야 키):
#    dl       = Deep Learning / Computer Vision
#    medai    = 의료 인공지능
#    imgproc  = 이미지 처리
#    optics   = Optics / Photonics
#    neuro    = Bio / Neuroscience
#
#  also: 부 분야 (필터에는 잡히지만 분야 내 점수 정규화에는 안 들어감)
#        예: CVPR 은 fields: [dl, imgproc], also: [medai] → 의료 AI 필터에 나오지만 의료 AI 분야 1위는 MICCAI 유지
#  region: intl(국제) | domestic(국내)
#  target: true  → 사이트에서 ★ 고정 표시
#
#  sources: 크롤링 소스와 연결 (있으면 데드라인 자동 갱신)
#    ccfddl: ccfddl 저장소의 title   (https://github.com/ccfddl/ccf-deadlines)
#    hf:     huggingface/ai-deadlines 파일 이름 (확장자 제외)
#
#  metrics (점수 계산용, 모르는 값은 비워두세요)
#    h5:          Google Scholar h5-index  (비워두면 크롤링 값 사용)
#    core:        CORE 등급 A* / A / B / C
#    accept_rate: 최근 채택률 (0~1)
#    tier:        지표가 없는 학회용 수동 티어 (0~1). 예: SfN, Photonics West
#    verified:    true 로 바꾸면 사이트의 "⚠ 미검증" 표시가 사라짐
#
#  editions: 크롤링 소스가 없는 학회(국내, Optics 등)의 일정을 직접 입력
#    - year: 2027
#      date: "Feb 3-5, 2027"
#      place: "Seoul, Korea"
#      link: https://...
#      timezone: UTC+9          # AoE, UTC-8, UTC+9 ...
#      deadlines:
#        - { type: abstract, at: "2026-12-01 23:59" }
#        - { type: paper,    at: "2026-12-08 23:59" }
#    type: abstract | paper | supplementary | rebuttal | camera_ready | notification | registration
#    수동 입력값은 크롤링 값보다 우선합니다.
#
#  scrape: 공식 사이트에서 마감을 자동 추출 (우선순위 가장 낮음, 사이트에 ⚠ 표시)
#    scrape: { url: "https://embc.embs.org/{year}/important-dates/", label: after }
#      url       {year} 는 내년 → 올해 순으로 시도
#      follow    true 면 페이지 안의 Important Dates / Call for Papers 링크도 읽음
#      label     after = 라벨이 날짜 뒤에 오는 사이트 (기본 before)
#      timezone  시각이 없을 때 기준 시간대 (국제 기본 AoE, 국내 기본 UTC+9)
#      include / exclude   라벨 필터 정규식
#    테스트: node scripts/scrape.mjs <id> --dump
#
#  watch: 국내 학회 홈페이지 URL → '논문모집/초록모집' 공지를 '신규 후보' 탭에 표시
#    테스트: node scripts/scrape.mjs --watch
# =====================================================================

