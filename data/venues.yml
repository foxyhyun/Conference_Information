# =====================================================================
#  저널 — 이름·IF·범위 등 조사 정보는 data/journals.yml 에 있습니다 (출처 포함).
#  여기서는 분야와 랩 게재 이력 매칭만 정합니다.
#    fields:  분야 (위와 동일한 키)
#    match:   랩 홈페이지 출판 목록의 저널명과 맞출 정규식 (대소문자 무시)
#    if / if_year / verified: true  → JCR 에서 직접 확인한 값으로 덮어쓰기
#    special_issues: 특집호 마감 (선택)
#      - { title: "...", at: "2027-03-01 23:59", timezone: UTC+0, link: https://... }
#  분야 키에 all 을 쓰면 5개 분야 전부 (Nature, Science 같은 종합지)
# =====================================================================

journals:
  # ---- 종합 / Cell · Nature · Science ----
  - { id: cell,             fields: [neuro, biomed],                    match: "^Cell$" }
  - { id: neuron,           fields: [neuro],                    match: "^Neuron$" }
  - { id: cell-reports,     fields: [neuro, biomed],                    match: "^Cell Reports$" }
  - { id: cell-rep-methods, fields: [neuro, optics, imgproc, biomed],   match: "Cell Reports Methods" }
  - { id: iscience,         fields: [neuro, optics, biomed],            match: "iScience" }
  - { id: nature,           fields: [all],                      match: "^Nature$" }
  - { id: nat-neurosci,     fields: [neuro],                    match: "Nature Neuroscience|Nat\\.? Neurosci" }
  - { id: nat-methods,      fields: [neuro, optics, imgproc, biomed],   match: "Nature Methods|Nat\\.? Methods" }
  - { id: nat-commun,       fields: [all],                      match: "Nature Communications|Nat\\.? Commun" }
  - { id: nat-bme,          fields: [medai, optics, neuro, biomed],     match: "Nature Biomedical Engineering|Nat\\.? Biomed" }
  - { id: sci-rep,          fields: [all],                      match: "Scientific Reports|Sci\\.? Rep" }
  - { id: science,          fields: [all],                      match: "^Science$" }
  - { id: sci-adv,          fields: [all],                      match: "Science Advances|Sci\\.? Adv" }
  - { id: pnas,             fields: [all],                      match: "Proceedings of the National Academy|PNAS" }
  - { id: plos-one,         fields: [all],                      match: "PLOS ONE|PLoS One" }

  # ---- 광학 / 포토닉스 ----
  - { id: natphoton,        fields: [optics],                   match: "Nature Photonics" }
  - { id: lsa,              fields: [optics],                   match: "Light: Science" }
  - { id: optica,           fields: [optics, imgproc],          match: "^Optica$" }
  - { id: adv-photon,       fields: [optics],                   match: "^Advanced Photonics$" }
  - { id: photonix,         fields: [optics, imgproc],          match: "PhotoniX" }
  - { id: adv-imaging,      fields: [optics, imgproc],          match: "^Advanced Imaging$" }
  - { id: oe,               fields: [optics],                   match: "^Optics Express" }
  - { id: ol,               fields: [optics],                   match: "^Optics Letters" }
  - { id: boe,              fields: [optics, medai, neuro, biomed],     match: "Biomedical Optics Express" }
  - { id: jbo,              fields: [optics, medai, biomed],            match: "Journal of Biomedical Optics|J\\.? Biomed\\.? Opt" }
  - { id: nph,              fields: [optics, neuro],            match: "^Neurophotonics" }
  - { id: jbio,             fields: [optics, medai, biomed],            match: "Journal of Biophotonics|J\\.? Biophotonics" }
  - { id: pacs,             fields: [optics, medai, biomed],            match: "Photoacoustics" }
  - { id: copp,             fields: [optics],                   match: "Current Optics and Photonics" }
  - { id: jppb,             fields: [optics, neuro, biomed],            match: "Photochemistry (&|and) Photobiology,? B" }
  - { id: tci,              fields: [imgproc, optics, dl],      match: "Transactions on Computational Imaging" }

  # ---- 뇌과학 / 바이오 / 안과 ----
  - { id: jneurosci,        fields: [neuro],                    match: "Journal of Neuroscience|J\\.? Neurosci" }
  - { id: neuroimage,       fields: [neuro, medai],             match: "NeuroImage" }
  - { id: brain-stim,       fields: [neuro, medai, biomed],             match: "Brain Stimulation" }
  - { id: nbd,              fields: [neuro, biomed],                    match: "Neurobiology of Disease" }
  - { id: exp-neurol,       fields: [neuro, biomed],                    match: "^Experimental Neurology" }
  - { id: tsr,              fields: [neuro, medai, biomed],             match: "Translational Stroke Research" }
  - { id: exp-neurobiol,    fields: [neuro],                    match: "Experimental Neurobiology|Exp\\.? Neurobiol" }
  - { id: emm,              fields: [neuro, medai, biomed],             match: "Experimental (&|and) Molecular Medicine" }
  - { id: theranostics,     fields: [medai, optics, biomed],            match: "Theranostics" }
  - { id: iovs,             fields: [medai, neuro, optics, biomed],     match: "Invest(igative)?\\.? Ophthalmol" }
  - { id: cornea,           fields: [medai, biomed],                    match: "^Cornea$" }
  - { id: oph-sci,          fields: [medai, dl, biomed],                match: "Ophthalmology Science" }
  - { id: ocular-surface,   fields: [medai, biomed],                    match: "Ocular Surface" }
  - { id: trans-oncol,      fields: [medai, biomed],                    match: "Translational Oncology" }
  - { id: biomedicines,     fields: [medai, biomed],                    match: "^Biomedicines$" }
  - { id: in-vivo,          fields: [medai, biomed],                    match: "^In Vivo$" }

  # ---- 공학 / AI / 나노 ----
  - { id: tpami,            fields: [dl, imgproc],              match: "Pattern Analysis and Machine Intelligence|TPAMI" }
  - { id: ijcv,             fields: [dl, imgproc],              match: "International Journal of Computer Vision" }
  - { id: tnnls,            fields: [dl],                       match: "Neural Networks and Learning Systems" }
  - { id: tip,              fields: [imgproc, dl],              match: "Transactions on Image Processing" }
  - { id: media,            fields: [medai, imgproc, dl],       match: "Medical Image Analysis" }
  - { id: tmi,              fields: [medai, imgproc, dl],       match: "Transactions on Medical Imaging" }
  - { id: npjdm,            fields: [medai, dl],                match: "npj Digital Medicine" }
  - { id: tbme,             fields: [medai, neuro, biomed],             match: "Transactions on Biomedical Engineering" }
  - { id: tnsre,            fields: [neuro, medai],             match: "Neural Syst(ems)?\\.? (and )?Rehabil" }
  - { id: jbhi,             fields: [medai, dl],                match: "Biomedical and Health Informatics" }
  - { id: bmel,             fields: [medai, optics, biomed],            match: "Biomedical Engineering Letters" }
  - { id: nano-lett,        fields: [optics],                   match: "Nano Letters|Nano Lett" }
  - { id: acs-anm,          fields: [optics, biomed],                   match: "ACS Appl(ied)?\\.? Nano Mater" }

  # ---- 계산 현미경 / AI for science ----
  - { id: nat-mach-intell,  fields: [dl],                       match: "Nature Machine Intelligence" }
  - { id: nat-comput-sci,   fields: [dl, biomed],               match: "Nature Computational Science" }
  - { id: elight,           fields: [optics, imgproc],          match: "^eLight$" }
  - { id: j-microsc,        fields: [optics, imgproc, biomed],  match: "Journal of Microscopy|J\\.? Microsc" }

  # ---- 방사선 · 핵계측 ----
  - { id: nima,         fields: [rad],                 match: "Nuclear Instruments and Methods|NIM-?A" }
  - { id: tns,          fields: [rad, medai],          match: "Transactions on Nuclear Science" }
  - { id: rad-meas,     fields: [rad],                 match: "^Radiation Measurements$" }
  - { id: jer,          fields: [rad],                 match: "Environmental Radioactivity" }
  - { id: net,          fields: [rad],                 match: "Nuclear Engineering and Technology" }
