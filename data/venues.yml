# =====================================================================
#  저널 — IF는 JCR(Clarivate)에서 직접 확인 후 입력하세요. (매년 6월 발표)
#  아래 값은 대략적인 초기값이며 verified: false 상태입니다.
#    if:       Journal Impact Factor
#    if_year:  IF 기준 연도 (JCR 발표연도 - 1)
#    quartile: JCR 분야 내 Q1~Q4
#    special_issues: 특집호 마감 (선택)
#      - { title: "...", at: "2027-03-01 23:59", timezone: UTC+0, link: https://... }
# =====================================================================

