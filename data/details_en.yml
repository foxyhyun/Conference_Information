# English translation of details.yml (shown when the site language is English).
# name_en / full_en give English names for Korean venues.

cvpr:
  about: >-
    The largest annual conference in computer vision, co-sponsored by the IEEE Computer Society and the Computer Vision Foundation (CVF),
    held every year since 1985. The 2026 meeting in Denver received 16,092 submissions, accepted 4,071 papers and drew 12,322 registrants,
    making it the flagship venue of the computer vision and pattern recognition community. According to Wikipedia, it is a selective
    conference that accepts fewer than 30% of all papers and fewer than 5% as oral presentations.
  topics:
    - 3D from multi-view and sensors / 3D from single images
    - Computational imaging
    - Medical and biological vision, cell microscopy
    - Low-level vision
    - Image and video synthesis and generation
    - 'Recognition: categorization, detection, retrieval'
    - Segmentation, grouping and shape analysis
    - Self-, semi-, meta- and unsupervised learning
    - Transfer / low-shot / continual / long-tail learning
    - Vision, language, and reasoning
    - Multimodal learning
    - Datasets and evaluation
    - Efficient and scalable vision
    - Physics-based vision and shape-from-X
    - 'Video: action and event understanding / low-level analysis, motion, tracking'
  features:
    - >-
      8-page main-text limit (including figures and tables, excluding references); CVPR style template required. Papers exceeding the limit
      are rejected without review.
    - >-
      Double-blind review on OpenReview. All co-authors must have an up-to-date OpenReview profile; profiles without an institutional email
      can take up to 2 weeks to be approved.
    - >-
      A 1-page PDF rebuttal period follows the release of reviews (2026 conference: January 22-29). No new contributions or external links
      may be added in the rebuttal.
    - >-
      All authors must commit to serving as reviewers, ACs or SACs if invited (reviewer-service commitment); exceptions require prior
      approval from the program chairs. The same clause is retained in the 2027 CFP.
    - >-
      Accepted papers are released on CVF Open Access 2 weeks before the conference. The 2027 CFP adds new topics such as 'Agentic AI' and
      'Physical AI: World Models, VLA, Planning, Simulation'.
    - >-
      Dual submission is prohibited (rejection if 20% or more of the content overlaps); arXiv preprints are not considered publications.
      LLM-related errors such as citing non-existent references are grounds for rejection ('an LLM did it' is not a defense).
    - >-
      Separate abstract and paper submission deadlines, with no extensions (2026: abstract 11/7, paper 11/13; 2027: registration 11/10,
      paper 11/16).
  acceptance_rate: '2026: 25.3% (4071/16092); 2025: 22.1% (2872/13008) — per the table in the Wikipedia CVPR article'
  typical_schedule: null
  sources:
    - https://cvpr.thecvf.com/Conferences/2026/CallForPapers
    - https://cvpr.thecvf.com/Conferences/2026/AuthorGuidelines
    - https://cvpr.thecvf.com/Conferences/2027/CallForPapers
    - https://en.wikipedia.org/wiki/Conference_on_Computer_Vision_and_Pattern_Recognition
    - https://github.com/lixin4ever/Conference-Acceptance-Rate
iccv:
  about: >-
    An IEEE-sponsored computer vision conference that began in 1987 and is held biennially in odd-numbered years, when ECCV does not take
    place. Together with CVPR and ECCV it is regarded as one of the three top computer vision conferences; its best paper award is the Marr
    Prize, named after the neuroscientist David Marr. The 2025 meeting (Hawaii) received about 11,000 submissions and accepted about 2,700
    papers.
  topics:
    - 3D from multi-view and sensors / single images
    - Computational imaging
    - Medical and biological vision, cell microscopy
    - Low-level vision
    - Image and video synthesis and generation
    - 'Recognition: categorization, detection, retrieval'
    - Segmentation, grouping and shape analysis
    - Self-, semi-, meta- and unsupervised learning
    - Transfer / low-shot / continual / long-tail learning
    - Vision, language, and reasoning
    - Multimodal learning
    - Datasets and evaluation
    - Physics-based vision and shape-from-X
    - 'Video: action and event understanding / motion and tracking'
    - Photogrammetry and remote sensing
  features:
    - >-
      8-page main-text limit (including figures and tables, excluding references), ICCV style. Papers exceeding the limit are rejected
      without review.
    - >-
      Double-blind review on OpenReview, with a 1-page PDF rebuttal after reviews are released (2025: 5/10-5/16). No external links (code,
      video) are allowed in the rebuttal.
    - Authors must serve as reviewers when asked, and all authors need an up-to-date OpenReview profile.
    - >-
      Dual submission is prohibited (a violation if 20% or more overlaps); arXiv preprints and technical reports are not considered
      publications. LLM-related errors such as citing non-existent references are grounds for rejection.
    - Accepted papers are released on CVF Open Access 2 weeks before the conference (in parallel with IEEE Xplore).
    - 'No extensions to the paper registration and submission deadlines (2025: registration 3/3, submission 3/7 HST).'
    - The 2025 CFP lists 37 topic areas and explicitly includes 'Medical and biological vision, cell microscopy'.
  acceptance_rate: '2025: about 24.2% (2698/11152) — Paper Copilot (third-party tally, not an official figure)'
  typical_schedule: null
  sources:
    - https://iccv.thecvf.com/Conferences/2025/CallForPapers
    - https://iccv.thecvf.com/Conferences/2025/AuthorGuidelines
    - https://en.wikipedia.org/wiki/International_Conference_on_Computer_Vision
    - https://papercopilot.com/venue-overview/iccv-2025-venue-overview/
eccv:
  about: >-
    A computer vision conference organized by the European Computer Vision Association (ECVA), a non-profit based in Zurich, Switzerland. It
    began in Antibes, France in 1990 and is held biennially in even-numbered years. Together with CVPR and ICCV it is regarded as one of the
    three top computer vision conferences, and its proceedings are published by Springer (LNCS template). The 2024 meeting in Milan received
    about 8,585 submissions.
  topics:
    - 3D from multi-view and sensors / single images
    - Camera pose estimation and calibration
    - Computational imaging
    - Medical and biological vision, cell microscopy
    - Low-level vision
    - Image and video synthesis and generation
    - (Neural) scene representations
    - 'Recognition: categorization, detection, retrieval'
    - Segmentation, grouping and shape analysis
    - Self-, semi-, meta- and unsupervised learning
    - Vision, language, and reasoning
    - Synthetic data and simulation
    - Visual localization, SLAM, Structure-from-Motion
    - Geometric deep learning
    - Vision for climate and sustainability
  features:
    - >-
      14-page main-text limit (including figures and tables, excluding references); the ECCV 2026 LNCS template is required. Using another
      conference's template or fonts, or altering the margins, results in a desk reject.
    - >-
      Double-blind review on OpenReview. A 1-page two-column PDF rebuttal follows the release of reviews (2026: reviews released 5/2,
      rebuttal deadline 5/11).
    - >-
      All authors are automatically added to the reviewer pool (exceptions are extremely limited), and reviewers may not upload or process
      submissions with LLMs.
    - >-
      Accepted papers are made available through Springer and/or ECVA from 4 weeks before the conference onward. 2026 submissions are
      checked for plagiarism with iThenticate.
    - >-
      The author list cannot be changed (additions or removals) after the registration deadline (2026: 2/26); only reordering is allowed.
      From 2026, selecting a primary Contribution Type is mandatory, and the Datasets/Benchmarks type must be publicly released by
      camera-ready.
    - >-
      A media and social media embargo applies from January 29 until final decisions. External links are prohibited in submissions,
      supplementary material and rebuttals.
    - Accepted papers must be presented in person by an author or a delegate.
  acceptance_rate: >-
    2024: 27.9% (2395/8585, poster basis; 30.2% including 200 orals) — Paper Copilot/aiwiki tally (based on search results, re-quoting
    officially announced figures)
  typical_schedule: null
  sources:
    - https://eccv.ecva.net/Conferences/2026/CallForPapers
    - https://eccv.ecva.net/Conferences/2026/SubmissionPolicies
    - https://www.ecva.net/
    - https://en.wikipedia.org/wiki/European_Conference_on_Computer_Vision
    - https://papercopilot.com/statistics/ECCV-statistics
wacv:
  about: >-
    An annual IEEE/CVF-sponsored conference focused on computer vision applications, held every winter (February-March). While algorithmic
    papers are accepted, its distinguishing emphasis is on 'systems and applications with a significant vision component', and it is divided
    into an Applications track and an Algorithms track with different review criteria. From 2027 a new Evaluations & Dataset track has been
    introduced.
  topics:
    - 'Applications track: Biomedical, healthcare, and medicine'
    - 'Applications track: Robotics / Autonomous driving / Remote sensing'
    - 'Applications track: Virtual and augmented reality / Visualization'
    - 'Applications track: Embedded sensing and real-time techniques'
    - 'Applications track: Agriculture / Environmental monitoring / Social good'
    - 'Algorithms track: 3D computer vision'
    - 'Algorithms track: Computational photography'
    - 'Algorithms track: Generative models for image, video, 3D'
    - 'Algorithms track: Low-level and physics-based vision'
    - 'Algorithms track: Image recognition and understanding (detection, segmentation, scene modeling)'
    - 'Algorithms track: Video recognition and understanding (tracking, action recognition)'
    - 'Algorithms track: Vision + language and/or other modalities'
    - 'Algorithms track: Foundation models for downstream vision tasks'
    - 'Algorithms track: Datasets and evaluations'
    - Evaluations & Dataset track (new in 2027)
  features:
    - >-
      Two submission rounds. Round 1 (July) papers receive an accept / revise-and-resubmit / reject decision; revised papers are resubmitted
      with a 1-page rebuttal and re-reviewed in Round 2. New Round 2 (September) submissions receive only an accept/reject decision, with no
      rebuttal.
    - >-
      8-page main-text limit (including figures and tables, excluding references); WACV template required. Double-blind review on
      OpenReview, with at least 3 reviewers per paper.
    - >-
      The Applications track is reviewed on system-level innovation, domain novelty and comparative evaluation; the Algorithms track is
      reviewed on algorithmic novelty and quantitative comparison, similar to CVPR/ICCV/ECCV.
    - All authors must be willing to serve as reviewers/ACs, and papers by authors who submit low-quality reviews may be desk rejected.
    - >-
      Accepted papers are released on CVF Open Access 2 weeks before the conference. At least one author must register in person
      (unregistered papers are removed from the proceedings). Extended versions of 2026 accepted papers are to appear in a special issue of
      Machine Vision and Applications (MVA).
    - >-
      The LLM policy is based on the NeurIPS 2025 guidelines: any use of LLMs in the methodology must be described, and citing non-existent
      references leads to rejection.
    - 'The Round 1 stand-alone acceptance rate is very low (2025 Round 1: 85 of 1,329 papers accepted, 732 invited to resubmit in Round 2).'
  acceptance_rate: >-
    2024: 41.4% (846/2043) — Paper Copilot (third-party tally); 2025 Round 1: 6.4% (85/1329), Round 2: 440 resubmissions and 303 new
    submissions accepted (out of 1,809) — official per-round figures; no official overall acceptance rate published
  typical_schedule: null
  sources:
    - https://wacv.thecvf.com/Conferences/2026/CallForPapers
    - https://wacv.thecvf.com/Conferences/2027/AuthorGuides
    - https://papercopilot.com/statistics/wacv-statistics/
    - https://ami.kaist.ac.kr/275fdae6-c854-80b1-8169-dff86cc4665e
neurips:
  about: >-
    An annual conference in machine learning and computational neuroscience founded in 1987, held every December and organized by the
    NeurIPS Foundation (the first meeting was IEEE-sponsored). It began as an interdisciplinary gathering of researchers in biological and
    artificial neural networks and changed its abbreviation from NIPS to NeurIPS in 2018. The 2025 main track received 21,575 submissions
    and accepted 5,290 papers; together with ICML and ICLR it is regarded as one of the most prestigious venues in ML.
  topics:
    - Applications (vision, language, speech, etc.)
    - Deep learning
    - Evaluation
    - General machine learning
    - Infrastructure / ML systems
    - Machine learning for sciences
    - Neuroscience and cognitive science
    - Optimization
    - Probabilistic methods
    - Reinforcement learning
    - Social and economic aspects of machine learning
    - Theory
    - Robotics and embodied systems (2026 CFP)
    - AI/ML for health, sustainability, creative work (2026 CFP)
  features:
    - >-
      9-page main-text limit (including figures and tables; excluding references, checklist and technical appendices), with 1 extra page at
      camera-ready upon acceptance. The Paper Checklist must be appended to the end of the paper.
    - >-
      Double-blind review on OpenReview. Authors cannot be added or removed after the abstract deadline (reordering only). There is a 1-week
      author response period for reviews, but revised papers cannot be submitted.
    - >-
      In addition to the main track, a Datasets & Benchmarks track (2026: Evaluations and Datasets) and a Position Paper track (introduced
      in 2025) are run through separate portals; papers cannot move between tracks after submission.
    - >-
      Authors are asked to participate in reviewing (reciprocal reviewing); detected collusion leads to rejection and future sanctions. The
      program chairs run randomized controlled experiments on the review process under IRB approval.
    - >-
      arXiv preprints are allowed (but must not be labeled 'Under review at NeurIPS'). Papers made public after March 1, 2025 are treated as
      concurrent work, and a submission is not rejected solely for omitting a comparison to them.
    - >-
      Funding sources must be disclosed at camera-ready; code and data release is strongly encouraged. In 2026 the conference is held in
      multiple cities (Sydney, Paris, Atlanta).
    - >-
      According to Wikipedia, a 2021 duplicate-submission experiment found that 23% of papers received different acceptance decisions,
      prompting debate over review consistency.
  acceptance_rate: '2025: 24.5% (5290/21575); 2024: 25.8% (4037/15671) — lixin4ever/Conference-Acceptance-Rate tally'
  typical_schedule: null
  sources:
    - https://neurips.cc/Conferences/2025/CallForPapers
    - https://neurips.cc/Conferences/2026/CallForPapers
    - https://en.wikipedia.org/wiki/Conference_on_Neural_Information_Processing_Systems
    - https://github.com/lixin4ever/Conference-Acceptance-Rate
    - https://blog.neurips.cc/2026/08/10/announcing-the-neurips-2026-workshops/
iclr:
  about: >-
    An annual machine learning conference centered on representation learning, founded in 2012 by Yann LeCun and Yoshua Bengio with its
    first meeting in 2013; it is usually held in late April to early May. Its defining feature is open peer review on OpenReview, adopted
    since its inception, and together with NeurIPS and ICML it is counted among the three top ML conferences. The 2025 meeting in Singapore
    drew 11,039 attendees from 85 countries, and in 2026, 5,355 of 19,525 submissions were accepted.
  topics:
    - Representation learning (supervised, self-supervised, semi-supervised, unsupervised)
    - Reinforcement learning
    - Generative models
    - Causal reasoning
    - Optimization
    - Learning theory
    - Fairness, safety, privacy
    - Datasets and benchmarks
    - Neurosymbolic systems
    - Robotics
    - Applications to neuroscience and cognitive science
    - Applications to physical sciences
    - General machine learning
  features:
    - >-
      9-page main-text limit at submission, extended to 10 pages at the rebuttal and camera-ready stages. References and appendices are
      unlimited; exceeding the limit leads to a desk reject.
    - >-
      Reviews are posted anonymously on OpenReview, and during a roughly 3-week public discussion period (2026: 11/11-12/3) authors can
      respond and revise their papers. After decisions, all submissions are de-anonymized and made public, and reviews of rejected papers
      remain visible.
    - >-
      Strong reciprocal reviewing obligation: authors with 3 or more submissions must review at least 6 papers, and every submission must
      register at least one reviewer-eligible author (with a publication record at ICLR/NeurIPS/ICML, etc.). Non-compliance can lead to a
      desk reject.
    - >-
      Double-blind, but posting on arXiv is allowed. Papers withdrawn after the deadline are also immediately de-anonymized and remain
      public.
    - >-
      If an LLM played a substantial role in developing the ideas or writing, this must be disclosed in a dedicated section; failure to
      disclose can lead to a desk reject. LLMs are not eligible for authorship.
    - >-
      Proceedings are hosted open-access on OpenReview (no separate publisher). An ethics statement (1 page) and a reproducibility statement
      are optional but encouraged.
  acceptance_rate: '2026: 27% (5355/19525); 2025: 31.9% — Wikipedia (ICLR article)'
  typical_schedule: null
  sources:
    - https://iclr.cc/Conferences/2026/CallForPapers
    - https://iclr.cc/Conferences/2026/AuthorGuide
    - https://en.wikipedia.org/wiki/International_Conference_on_Learning_Representations
icml:
  about: >-
    The oldest machine learning conference, which began as a workshop at Carnegie Mellon in 1980 and became a formal conference series in
    1993. It is organized by the International Machine Learning Society (IMLS), with a deadline in late January and the meeting in July each
    year. Together with NeurIPS and ICLR it is regarded as one of the three most prestigious ML venues; submissions have surged from 1,037
    in 2015 to 12,107 in 2025 and about 24,000 in 2026. The 2026 meeting was held in Seoul.
  topics:
    - General machine learning
    - Deep learning
    - Evaluation
    - Theory
    - ML systems
    - Optimization
    - Probabilistic methods
    - Reinforcement learning
    - Trustworthy machine learning
    - Application-driven machine learning
  features:
    - >-
      8-page main-text limit (references, impact statement and appendices unlimited), with 1 extra page at camera-ready. An Impact Statement
      section before the references is mandatory, and a lay summary must be submitted after acceptance.
    - >-
      Double-blind review on OpenReview. For accepted papers, the original submission, anonymous reviews, meta-review, rebuttal and
      discussion are made public along with the camera-ready (optional for rejected papers).
    - >-
      Reciprocal reviewing obligation: at least one author per submission must serve as a reviewer (each author handles at most 2 papers),
      and authors with 4 or more submissions must review. Non-compliance or careless reviewing can lead to a desk reject of the submitted
      papers.
    - Proceedings are published open-access in PMLR (Proceedings of Machine Learning Research, under JMLR).
    - >-
      A Position Paper track is run on a separate OpenReview site from the main track. From 2026, a proceedings-only (virtual registration)
      option is allowed for accepted papers.
    - >-
      arXiv preprints are allowed (but advertising that the paper is an ICML submission is prohibited). LLM use is permitted with full
      author responsibility; prompt injection leads to a desk reject. Authors with multiple submissions may optionally submit a ranking of
      their own papers, visible only to the integrity chair.
    - >-
      No extensions to the abstract and paper deadlines (2026: abstract 1/23, paper 1/28). The author list cannot be changed after the
      abstract deadline.
  acceptance_rate: '2026: 26.6%; 2025: 26.9% (3260/12107); 2024: 30.5% — Wikipedia (ICML article)'
  typical_schedule: null
  sources:
    - https://icml.cc/Conferences/2026/CallForPapers
    - https://en.wikipedia.org/wiki/International_Conference_on_Machine_Learning
aaai:
  about: >-
    A general artificial intelligence conference organized by the Association for the Advancement of Artificial Intelligence (AAAI), first
    held at Stanford in 1980 and now annual (submissions around August, meeting in January-February). It covers all areas of AI including
    machine learning, NLP, computer vision, planning, reasoning and multi-agent systems, and ranks 4th among AI publications by Google
    Scholar H5 index, after ICLR, NeurIPS and ICML. AAAI-26 (Singapore) received more than 20,000 submissions.
  topics:
    - Machine learning
    - Natural language processing
    - Computer vision
    - Data mining
    - Multiagent systems
    - Knowledge representation
    - Human-in-the-loop AI
    - Search, planning, reasoning
    - Robotics and perception
    - Ethics
    - 'Special track: AI for Social Impact'
    - 'Special track: AI Alignment'
  features:
    - >-
      7-page limit for the technical content plus an additional page reserved for references. A reproducibility checklist is mandatory for
      all authors.
    - >-
      Two-phase review on OpenReview: in Phase 1, 2 human reviews plus 1 AI-generated review (non-decisive) inform the SPC's decision on
      whether a paper advances; in Phase 2, additional human reviews are followed by author response, discussion and a meta-review. Papers
      eliminated in Phase 1 receive no rebuttal opportunity.
    - >-
      An AI-assisted review pilot runs from AAAI-26: AI reviews carry no scores or recommendations and are for reference only, with final
      decisions made by humans. Authors may also respond to the AI review.
    - >-
      LLM-generated text is prohibited unless it is the object of experimental analysis (using LLMs to proofread or polish author-written
      text is allowed). AI tools cannot be authors or cited sources.
    - All authors are expected to participate in reviewing (a light load); non-compliance can lead to sanctions including rejection.
    - >-
      Separate abstract (late July) and full paper (early August) deadlines. Reviewers are not obligated to read supplementary material, so
      essential content must be in the main text.
    - >-
      Interdisciplinary research (e.g., links with neuroscience and cognitive science) and applications in healthcare and sustainability are
      explicitly encouraged.
  acceptance_rate: >-
    2026: about 17.6% (4167/23680) — Bohrium blog (third-party, source not stated); 2025: 23.4% (3032/12957) —
    lixin4ever/Conference-Acceptance-Rate
  typical_schedule: null
  sources:
    - https://aaai.org/conference/aaai/aaai-26/main-technical-track-call/
    - https://en.wikipedia.org/wiki/AAAI_Conference_on_Artificial_Intelligence
    - https://github.com/lixin4ever/Conference-Acceptance-Rate
    - https://www.bohrium.com/en/blog/research-notes/aaai-2026-accepted-papers-highlights/
bmvc:
  about: >-
    The UK's annual computer vision conference, organized by the British Machine Vision Association (BMVA); the 2026 meeting in Lancaster is
    the 37th edition. It is distinctive as a single-track conference of oral and poster presentations, and in 2026 it accepted 406 of 1,448
    submissions. It covers image processing, computer vision and machine learning broadly, and explicitly includes medical and biological
    image analysis among its topics.
  topics:
    - 3D from X, Shape Modeling and Processing
    - Medical and Biological Image Analysis
    - Computational Photography and Photogrammetry
    - Low-level and Physics-based Vision
    - Generative Models
    - Recognition, Segmentation, and Scene Understanding
    - Representation, Self-supervised, and Transfer Learning
    - Multimodal Learning (Vision + Language, Audio, etc.)
    - Motion Estimation and Tracking
    - Action, Event, and Video Understanding
    - Uncertainty
    - Explainable, Fair, and Ethical AI
    - Datasets and Evaluation
    - Vision Applications, Systems, and Robotics
    - Brave New Ideas (novel approaches/theory rather than benchmark gains)
  features:
    - >-
      14-page main-text limit (excluding references); the official BMVC LaTeX/Word template is required. Supplementary material is submitted
      as a single zip at the same time as the paper deadline.
    - >-
      Double-blind review on OpenReview, with at least 3 reviewers per paper plus an Area Chair meta-review. A rebuttal period is held
      (2026: 7/3-7/10).
    - >-
      Community reviewing system: authors commit to reviewing a number of papers proportional to their submissions, and careless
      participation can lead to rejection.
    - A 'Brave New Ideas' topic encourages new approaches and theory even without benchmark performance gains.
    - >-
      Single-track (oral + poster) format; proceedings are published by BMVA. Concurrent review at other conferences or journals is
      prohibited; arXiv preprints are not treated as prior publication.
    - >-
      Separate abstract (May 22) and paper (May 29) deadlines, with no extensions. The 2026 workshops include medical-related workshops such
      as MFM4Health (multimodal foundation models for healthcare).
    - Top accepted papers are invited to submit extended versions to an IJCV special issue (based on a search-result summary).
  acceptance_rate: '2026: 28.0% (406/1448) — official accepted papers page'
  typical_schedule: null
  sources:
    - https://bmvc2026.bmva.org/calls/call-for-papers/
    - https://bmvc2026.bmva.org/programme/accepted_papers/
miccai:
  about: >-
    MICCAI (Medical Image Computing and Computer Assisted Intervention) is the leading international conference in medical image computing
    and computer-assisted intervention, organized by the MICCAI Society and held annually. It is a large conference that drew 3,677
    submissions in 2025 and 4,601 in 2026 (official figures); the 2026 meeting (29th edition) was held in Strasbourg, France (September 27 -
    October 1). The community brings together methodological and clinical researchers across its two pillars, medical image computing (MIC)
    and computer-assisted intervention (CAI).
  topics:
    - Image formation and reconstruction
    - Image segmentation and anomaly detection
    - Multimodal data integration
    - Computer-aided diagnosis
    - Trustworthy and generalizable AI
    - Algorithmic fairness
    - Surgical data science
    - Image-guided robotic surgery
    - Point-of-care imaging
    - Teleradiology
    - Medical Image Computing (MIC) / Computer Assisted Intervention (CAI) primary areas
  features:
    - >-
      Up to 8 pages of main text plus up to 2 pages of references; the MICCAI-specific LNCS template is required (formatting violations such
      as altered margins or line spacing result in an automatic desk reject)
    - 'Fully double-blind review: on average 3 external reviewers plus 1-3 Area Chairs per paper'
    - >-
      Two-stage decisions: in the first stage 15-20% are early accepts and 40-50% early rejects; the rest go through a 1-week rebuttal
      followed by independent decisions from 3 ACs (no new experiments or results may be added)
    - >-
      Abstract (intention-to-submit) registration is required 2 weeks before submission, and the full-paper deadline has no extensions;
      co-authors are asked to register as reviewers
    - Supplementary material is limited to video (avi/mp4/wmv); PDF supplements are not allowed (as of 2026)
    - Accepted papers are published in Springer LNCS, with open-access versions posted on the MICCAI Society website
    - 'The acceptance rate is around 27-29% (2025: 1,027/3,677, about 28%; 2026: about 27% per the official announcement)'
  acceptance_rate: >-
    2025: about 28% (1,027/3,677, as reported by the MICCAI 2025 General Chair); 2026: about 27% (1,167 accepted / 4,601 submitted, news
    reports citing official MICCAI 2026 figures)
  typical_schedule: null
  sources:
    - https://conferences.miccai.org/2026/en/CALL-FOR-PAPERS.html
    - https://conferences.miccai.org/2026/en/PAPER-SUBMISSION-GUIDELINES.html
    - https://conferences.miccai.org/2026/en/THE-MICCAI-REVIEW-PROCESS.html
    - https://www.uni-bamberg.de/en/xai/news/artikel/2026-conference-miccai/
    - https://miccai.org/index.php/publications/newsletters/december-winter-2025/memories-of-miccai-2025/
midl:
  about: >-
    MIDL (Medical Imaging with Deep Learning) is an international conference dedicated to deep learning for medical imaging, organized by
    the MIDL Foundation and held annually. The 2026 meeting (July 8-10) was held in Taipei, in person with free online streaming. It is a
    community centered on researchers developing deep learning methods specialized for medical imaging, and accepted full papers are
    published in PMLR.
  topics:
    - Segmentation, detection, and classification of medical images
    - Learning-based image registration and reconstruction
    - Clinical integration, workflow, and deployment
    - Self-, semi-, and unsupervised representation learning
    - Transfer learning, domain adaptation, learning with limited or noisy labels
    - Generative AI and diffusion models for imaging
    - Foundation and large vision-language models for healthcare
    - Multimodal learning (imaging with text, omics, sensors, clinical data)
    - Uncertainty estimation, calibration, and interpretability
    - Federated, distributed, and privacy-preserving learning
    - Safe, trustworthy, and responsible AI
    - Validation and benchmarking across radiology, pathology, endoscopy, dermatology, ophthalmology
  features:
    - >-
      Main Track (methodology) full papers: up to 10 pages at submission (excluding references, acknowledgements and appendices), up to 12
      pages at camera-ready; the official MIDL LaTeX template is required
    - >-
      New Special Track in 2026 (Validation Studies): up to 14 pages at submission, up to 16 pages at camera-ready, with a separate
      OpenReview portal
    - Short papers (3 pages or fewer, excluding references) are presented as posters/spotlights and are not included in the proceedings
    - 'Single-blind review on OpenReview: reviewers know the authors, but authors do not know the reviewers'
    - Full papers go through roughly 1 week of rebuttal and reviewer discussion, followed by a final decision via meta-review
    - Accepted full papers are published in the Proceedings of Machine Learning Research (PMLR)
  acceptance_rate: null
  typical_schedule: null
  sources:
    - https://2026.midl.io/call-for-papers
isbi:
  about: >-
    ISBI (IEEE International Symposium on Biomedical Imaging) is an annual symposium jointly organized by the IEEE Signal Processing Society
    (SPS) and the IEEE Engineering in Medicine and Biology Society (EMBS), covering the mathematical, algorithmic and computational aspects
    of biological and biomedical imaging. The 2026 meeting (23rd edition) was held at ExCeL London (April 8-11) with several hundred
    attendees, and the 2027 meeting (May 25-28, EPFL Lausanne) marks 25 years since the first ISBI. The program includes keynotes,
    tutorials, challenges and a clinical day.
  topics:
    - Image formation and reconstruction
    - Computational and statistical image processing and analysis
    - Segmentation
    - Image quality assessment
    - Biological and biomedical imaging (nano to macro)
  features:
    - 'Two submission tracks: 4-page full papers (IEEE format, published in IEEE Xplore) and 1-page abstracts (with a later deadline)'
    - >-
      The deadlines are far apart; 4-page papers are due in the fall (November 2 for 2027), while 1-page abstracts are due the following
      February
    - Accepted papers are published in IEEE Xplore only if the presenting author registers and presents in person (2025 camera-ready policy)
    - >-
      Beyond the main track, there are tracks for workshop papers, challenge papers, and tutorial, special session and demo proposals;
      challenge papers are routed for review through EDAS
    - Of the 631 papers accepted in 2025 (Houston), 190 were oral presentations
  acceptance_rate: >-
    2026: 51.0% (893 papers accepted; statistics from the ISBI 2026 Program PDF — confirmed only via a search snippet, the original PDF
    could not be opened directly)
  typical_schedule: null
  sources:
    - https://biomedicalimaging.org/2026/
    - https://biomedicalimaging.org/2027/
    - https://signalprocessingsociety.org/newsletter/2025/11/isbi-2026-london-where-machines-learn-see-body-and-humans-learn-what-comes-next
