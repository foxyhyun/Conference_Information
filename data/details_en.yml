    - https://www.kiise.or.kr/conference/main/getContent.do?CC=ksc&CS=2026&content_no=2572&PARENT_ID=010100
kosombe:
  name_en: KOSOMBE Conference
  full_en: KOSOMBE Spring/Fall Conference
  about: >-
    The Korean Society of Medical and Biological Engineering (KOSOMBE) is the leading domestic society in biomedical engineering, holding a
    Spring Conference every May (mostly on Jeju, 3 days) and a Fall Conference every November. The 67th Spring Conference in 2026 (Jeju
    Shinhwa World) drew about 1,300 professors, researchers and students and was introduced as the largest academic exchange venue in Korean
    biomedical engineering. The 2026 Fall Conference was held together with APCMBE 2026 (Nov 4-7, EXCO Daegu), an international conference
    co-hosted by KOSOMBE and IFMBE.
  topics:
    - Brain engineering
    - Biomedical instrumentation
    - Medical image processing and systems
    - Medical AI
    - Biosensors & biochips
    - Biomedical optics
    - Biomaterials
    - Biomechanics and medical robotics
    - Medical device regulatory science
    - Bio-semiconductors
    - Medical ultrasound
    - Medical data analysis and bioelectronic systems (new division in 2026)
    - Physician-engineers / women in biomedical engineering (invited presentations only)
  features:
    - >-
      Abstract format: extended abstract, A4 2 pages (original Word file plus PDF uploaded as a compressed file; email submission not
      accepted)
    - >-
      For an oral presentation request, a short presentation video of up to 5 minutes (avi/mp4/mov, 100 MB or less) must be submitted; if
      not selected in pre-screening, it is automatically converted to a poster (per 2025 Spring); the Fall Conference uses an Oral/Poster
      choice for the student competition
    - Outstanding presenters are selected and awarded in oral and poster sessions
    - Presenters (invited and poster) must pay the annual membership fee and early registration fee online before submitting an abstract
    - Research involving life-science/biological data requires an IRB/IACUC approval number (may be excluded from review without one)
    - Posters printed at A0 (84.4 x 118.9 cm) (2025 Spring); the Fall Conference uses 90 x 120 cm on-site printing (2024)
    - >-
      Keynotes, special sessions (e.g., MFDS results-sharing session), family session, mentoring session, shorts contest, exhibition booths;
      abstract book (ebook PDF) made public
  typical_schedule: >-
    Spring: 3 days, Thursday to Saturday in the second week of May every year on Jeju (2025: May 8-10, Lotte Hotel; 2026: May 7-9, Shinhwa
    World). Abstract deadline early-to-mid April (2025: Apr 11 -> extended to Apr 18; 2026: Apr 3, poster-only Apr 10, acceptance
    notification Apr 17, early registration Apr 17 -> Apr 24). Fall: early November every year (2024: Nov 7-9, abstract deadline Oct 11;
    2025 Fall abstract deadline extended to Oct 17; 2026 merged with APCMBE 2026 Nov 4-7, abstract deadline Oct 8)
  acceptance_rate: null
  sources:
