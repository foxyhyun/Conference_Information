ipmi:
  about: >-
    IPMI (Information Processing in Medical Imaging) is a biennial conference on medical image computing methodology, described as one of
    the premier forums in the field with a tradition of about 58 years. The 30th edition in 2027 will be held at the Jouvence centre in
    Orford, Quebec, Canada (June 27 - July 2) with an expected attendance of about 120; it is run in a retreat format in which all
    participants lodge and dine together. Accepted papers are published in Springer LNCS.
  topics:
    - Mathematical foundations and computational methods
    - Image formation and reconstruction
    - Machine learning and intelligence
    - Clinical applications and translation
    - Visualization and human-AI interaction
  features:
    - >-
      12 pages of main text (excluding references) in Springer LNCS format; no supplementary material of any kind is allowed, and formatting
      violations result in a desk reject
    - Double-blind review; the full-paper deadline is 1 week after the abstract deadline (no extensions)
    - Unlimited, untimed Q&A after each presentation is central to the conference
    - 'A small retreat of about 120 participants: all-inclusive registration covering lodging and meals'
    - Authors must attend in person, and one author registration is required per accepted paper
    - >-
      Accepted papers are published in Springer LNCS; outstanding papers are invited to submit extended versions to a Medical Image Analysis
