    - https://www.apcmbe2026.org/
osk:
  name_en: OSK Meetings
  full_en: Optical Society of Korea Winter/Summer Meetings and Photonics Conference
  about: >-
    The Optical Society of Korea (OSK) is the domestic society for optics and photonics. It holds the Winter Meeting every February together
    with its annual general assembly (recently at BEXCO Busan, alongside the optical industry exhibition OptoWin), and a summer meeting (in
    2026 the Optics and Photonics Congress, OPC 2026, in July at ICC Jeju). Separately, the Photonics Division has held its divisional
    conference, the 'Photonics Conference (PC)', every late November since 2008 (2026: Sono Calm Yeosu). Abstracts are solicited in 9
    divisions including optical science, optical technology, photonics, biophotonics and quantum optics.
  topics:
    - Optical science (nano/micro optics, meta-optics, etc.)
    - Optical technology
    - Digital holography and information optics
    - Quantum electronics
    - Photonics
    - Biophotonics (OCT, endoscopy, etc.)
    - Displays
    - Quantum optics and quantum information
    - Lithography
  features:
    - >-
      Abstract submission: MS Word/HWP templates, online submission only (no email), presentation language Korean or English, submission
      possible even before paying the early registration fee (per 2027 Winter)
    - >-
      Oral: regular talks 15 minutes (including Q&A), invited 30 minutes, tutorials 90 minutes, plenary 45 minutes; oral may be converted to
      poster depending on venue operations
    - Poster panels 95 x 150 cm; presenters must stay at least 40 minutes after the session starts (otherwise treated as a No Show)
    - The Winter Meeting is held concurrently with the Nth annual general assembly, alongside the optical industry exhibition OptoWin
    - Non-members can also submit abstracts using the account created at early registration
    - >-
      The Photonics Conference (PC) is a divisional conference with Program (Oral)/Program (Poster) tracks and special sessions (2026: laser
