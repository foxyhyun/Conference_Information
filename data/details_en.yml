ksc:
  name_en: KSC
  full_en: Korea Software Congress
  about: >-
    KSC (Korea Software Congress) is the year-end comprehensive conference organized by the Korean Institute of Information Scientists and
    Engineers (KIISE), held for 3-4 days in mid-to-late December every year (twice a year together with KCC in June). The 2025 edition was
    held at the Yeosu Expo Convention Center, and the 2026 edition will be held at the Gyeongju HICO under the theme 'Cloud and Software
    Innovation Opening the Era of General-Purpose AI'. Regular papers and undergraduate/junior papers are accepted in 23 areas, and
    society-run paper presentations, tutorials and special sessions are held alongside SIG and industry-academia workshops.
  topics:
    - High-performance computing
    - Defense software
    - Databases
    - Mobile applications and systems
    - Internet of Things
    - Software engineering
    - Smart cities
    - Algorithms
    - Language engineering
    - Open-source software
    - AI applications (poster presentation only, excluded from Best/Outstanding Paper Awards)
    - AI theory
    - (23 areas in total including the above, per the KSC 2025 regular-paper announcement)
  features:
    - >-
      Review version 2-3 pages, submitted as a blind PDF without author information or acknowledgments (Hangul/MS Word templates); after
      acceptance, the final version is resubmitted in the publication template
    - >-
      Reviewed according to the society's review criteria and may be rejected; Oral/Poster assignment is decided by the program committee
      (an Oral request may be accepted as Poster)
    - >-
      Only papers submitted to Oral sessions are eligible for the Outstanding Paper Award; Outstanding Presentation Papers are recommended
      for journal publication
    - >-
      Undergraduate/junior papers: all authors must be high-school students or above; first author an undergraduate -> undergraduate paper,
      a high-school student -> junior paper; Poster only; Best, Outstanding and Encouragement awards based on combined written review and
      on-site presentation scores
    - >-
      Oral 15 minutes (including Q&A), poster boards 1 x 2 m, poster presentations 5-7 minutes; no-show results in withdrawal from the
      proceedings
    - >-
      One presenter must register per paper (multiple papers require one registration each); unregistered papers may be excluded from the
      proceedings and online publication
    - >-
      Keynotes, invited talks, Top Conference sessions, early-career researcher sessions and promotional booths; sponsored by many companies
      (Kakao, SK Broadband, FADU, etc.)
  typical_schedule: >-
    Held in mid-to-late December every year (2025: Dec 16-19, Yeosu; 2026: Dec 21-23, Gyeongju). Paper deadline late October (2025: Oct 27
    -> extended to Oct 30; 2026: CFP posted Sep 4, Oct 19 -> extended to Oct 26), review results mid-November (2025: Nov 14), camera-ready
    and presenter registration late November (2025: Nov 24)
  acceptance_rate: null
  sources:
    - https://www.kiise.or.kr/conference/main/index.do?CC=ksc&CS=2025
    - https://www.kiise.or.kr/conference/main/getContent.do?CC=ksc&CS=2025&content_no=2346&PARENT_ID=020100
    - https://www.kiise.or.kr/conference/main/getContent.do?CC=ksc&CS=2025&content_no=2347&PARENT_ID=020100
