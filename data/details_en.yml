    - https://2027.ieeeicassp.org/call-for-papers/
    - https://en.wikipedia.org/wiki/International_Conference_on_Acoustics,_Speech,_and_Signal_Processing
iccp:
  about: >-
    ICCP (IEEE International Conference on Computational Photography) is a conference dedicated to computational imaging and computational
    photography, held annually since 2009 and affiliated with the IEEE Computer Society's PAMI Technical Committee. The 2026 meeting is in
    Princeton (July 13-15) and the 2027 meeting in College Park, Maryland, USA (August 2-4). It is a small, specialized community spanning
    optics, sensor and illumination hardware through to physics-based rendering combined with machine learning, and it also includes imaging
    applications in medicine and biology.
  topics:
    - High-performance imaging
    - Computational cameras, illumination, and displays
    - Advanced image and video processing
    - Integration of imaging, physics, and machine learning
    - Structured light and time-of-flight imaging
    - Appearance, shape, and illumination capture
    - Computational optics (wavefront coding, digital holography, compressive sensing)
    - Sensor and illumination hardware
    - Imaging models and limits
    - Physics-based, neural, and differentiable rendering
    - 'Applications: mobile imaging, scientific imaging, medicine and biology, AR/VR'
  features:
    - Double-blind review plus a rebuttal after the first round of reviews (2025 CFP)
    - >-
      A single review process decides acceptance into either the IEEE TPAMI special issue (entirely new, archival-level work) or the ICCP
      Proceedings (2025 CFP)
    - Accepted papers in both tracks are presented orally (2025 CFP)
    - >-
      Separate Posters & Demos track: posters on previously published work and late-breaking results plus live demonstrations; accepted
      papers are guaranteed poster space (2026)
    - 'No extensions to the submission deadline (2025: fixed at April 9 PT)'
    - An ICCP Summer School is run in conjunction with the conference
