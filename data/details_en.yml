    - https://en.wikipedia.org/wiki/Society_for_Neuroscience
ohbm:
  about: >-
    The Organization for Human Brain Mapping (OHBM, founded in Paris in 1995) is a neuroimaging society studying the anatomical and
    functional organization of the human brain; it holds its annual meeting every June, rotating between continents (recent attendance
    roughly 2,500-3,000). The 2026 meeting is June 14-18 in Bordeaux, France, and the 2027 meeting is June 26-30 at the Metro Toronto
    Convention Centre in Toronto, Canada. Members range from clinicians in neurology and psychiatry to physicists, engineers, software
    developers and statisticians.
  topics:
    - Poster Abstracts
    - Symposia
    - Educational Courses
    - Roundtable Discussions
    - Registered Reports (new for 2027)
    - SIG, Chapter, and Committee Activities
  features:
    - >-
      650-word abstract limit (four mandatory sections - Introduction/Methods/Results/Conclusion - including figure captions), up to 2
      figures (2MB each)
    - >-
      Regular submissions go to the 'Poster Abstracts' category - oral presentations are separate proposals such as Symposia; participation
      is limited to one Educational Course plus one scientific session
    - >-
      Abstract submission fee of $45 (non-refundable), waivable for submitters from eligible countries by UNESCO criteria; presenters must
      attend in person
    - >-
      2027 timeline: submissions open 11/2/2026 - deadline 12/14/2026 - acceptance notification February 2027 - registration opens January
      2027
    - Registered Reports introduced from 2027 (Stage 1 notification 2027-01-15, final decision 2027-05-07)
    - OHBM runs its own publishing platform, Aperture Neuro; a Korea Chapter exists
  acceptance_rate: null
  sources:
    - https://humanbrainmapping.org/ohbm-2027/
    - https://humanbrainmapping.org/ohbm-annual-meeting-faq/
    - https://www.humanbrainmapping.org/
    - https://en.wikipedia.org/wiki/Organization_for_Human_Brain_Mapping
fom:
  about: >-
    Focus on Microscopy (FOM) is an annual international conference on optical microscopy that began in 1988, organized by the Dutch FOM
    foundation together with local institutions in the week before Easter at a different location each year (Taipei 2025, Stockholm 2026,
    Osaka 2027). Starting from three-dimensional imaging with confocal and multiphoton microscopy, it now covers the full range of
    microscopy innovation including super-resolution, light sheet, adaptive optics and AI, and serves as a meeting place for developers and
    users with an accompanying technical exhibition.
  topics:
    - Theory and practice of confocal and multiphoton-excitation microscopy
    - Super-resolution microscopy
    - AI in microscopy
    - 3D and 4D live cell and tissue imaging
    - Adaptive optics for microscopy
    - Light sheet microscopy
    - Phase/interference based microscopies
    - OCT, holography, endoscopy
    - 'Advanced fluorescence imaging/spectroscopy: FRET, FRAP, FLIM, FCS, SOFI'
    - New fluorescent probes, proteins, quantum dots, single molecule imaging
    - Clearing and expansion techniques
    - 'Coherent non-linear microscopies: SHG, THG, SFG, CARS'
    - Multi-dimensional fluorescence and Raman spectroscopy imaging
    - Fast acquisition, automated and high-content microscopy
    - 3D image processing and visualization for multidimensional data
  features:
    - >-
      One-page PDF abstract submission (all one-page abstracts since 2004 are permanently archived and searchable in the online FOM
      archive); no separate proceedings
    - >-
      Authors may request a 20-minute oral presentation or a poster, but 'Oral presentations can not be guaranteed' - the abstract selection
      committee and organizing committee make the final decision; for 2027, notification in early February
    - >-
      Held annually at a different location each year (the week before Easter), co-organized by the FOM foundation and a local
      society/university
    - >-
      40-minute plenaries and 20-minute parallel-session talks (including discussion), two poster sessions (2027: March 22 and 23); flash
      poster presentations have been held in the past
    - >-
      Accompanied by a technical exhibition of microscopy companies ('accompanied by a technical exhibition'); the 2027 main sponsor is
      Nikon
  acceptance_rate: null
  sources:
    - https://www.focusonmicroscopy.org/
    - https://www.focusonmicroscopy.org/2027-submit/?event_id=11725
    - https://www.focusonmicroscopy.org/2027-about/?event_id=11725
    - https://www.becker-hickl.com/events/focus-on-microscopy-2026/
optica-imaging:
  about: >-
    The Optica Imaging Congress (formerly the Imaging and Applied Optics Congress), renamed the 'Optica ImageSense Congress' from 2027, is
    an integrated imaging and sensing conference held by Optica every July that brings together 14 topical meetings including COSI
    (Computational Optical Sensing and Imaging), DH (Digital Holography), 3D, AO and IS. It 'showcases breakthroughs in image acquisition,
    processing and display' and covers computational imaging, neuromorphic imaging, AR/VR and optical sensors. The 2026 edition is July
    12-17 in Maastricht and the 2027 edition is July 11-15 in Ottawa, Canada (The Westin Ottawa).
  topics:
    - 'COSI: Computational Optical Sensing and Imaging'
    - 'DH: Digital Holography and 3-D Imaging (standalone in alternating years)'
    - '3D: 3D Image Acquisition and Display'
    - 'AO: Adaptive Optics'
    - 'IS: Imaging Systems and Applications'
    - 'pcAOP: Propagation through and Characterization of Atmospheric and Oceanic Phenomena'
    - 'QSM: Quantum Sensing and Metrology'
    - 'HISE: Hyperspectral Imaging and Sounding of the Environment'
    - 'AIS: Applied Industrial Spectroscopy'
    - 'FTS: Fourier Transform Spectroscopy'
    - 'LACSEA: Laser Applications to Chemical, Security and Environmental Analysis'
    - Optical Sensors / ES / RadIT
    - 'Category: Photonic and Biological/Biomedical Sensing and Imaging'
    - 'Subtopic: 2D/3D Computational Microscopy, Tomography and Endoscopy'
  features:
    - >-
      Submission format: 35-word abstract plus 2-page summary; summaries are published as the Technical Digest by Optica Publishing Group
      (indexed in Ei Compendex, Scopus and Google Scholar)
    - >-
      'All paper submissions are carefully peer-reviewed' - Oral Only / Poster Only / Oral or Poster selection, with the final decision made
      by the committee
    - '2027 deadline: 2027-03-09, 12:00 US Eastern Time (UTC-5); no revisions after the deadline'
    - >-
      Of the nine topic categories, 'Photonic and Biological/Biomedical Sensing and Imaging' and 'Computational Imaging Techniques'
      (including computational microscopy and tomography) are the ones relevant to neurophotonics research
    - Student paper competitions per topical meeting (3-4 finalists, opt-in at submission)
    - >-
      Journal special issues linked to COSI (Applied Optics / Biomedical Optics Express / Optics Express; 2026 special issue deadline
      2026-11-30)
  acceptance_rate: null
  sources:
    - https://www.optica.org/events/congress/optica_imagesense_congress/
    - https://www.optica.org/events/congress/optica_imagesense_congress/about/
    - https://www.optica.org/events/congress/optica_imagesense_congress/submit_papers/
    - https://www.optica.org/events/congress/optica_imagesense_congress/program/topic_categories/
    - https://opg.optica.org/content/feature/announcement/item/boe-cosi2026
auto-icpr:
  about: >-
    ICPR (International Conference on Pattern Recognition) is the flagship conference of the International Association for Pattern
    Recognition (IAPR); following the 27th edition in Kolkata in 2024, the 28th was held August 17-22, 2026 in Lyon, France. A
    long-established conference that marked its 50th anniversary in 2024, it is organized into six tracks spanning pattern recognition,
    machine learning, computer vision, image/signal processing, biometrics, document analysis and biomedical imaging.
  topics:
    - Artificial Intelligence, Pattern Recognition and Machine Learning
    - Computer and Robot Vision
    - Image, Speech, Signal and Video Processing
    - Biometrics and Human Computer Interaction
    - Document Analysis and Recognition
    - Biomedical Imaging and Bioinformatics
  features:
    - Six-track structure with a dedicated 'Biomedical Imaging and Bioinformatics' track, so medical imaging work can be submitted
    - >-
      Review is single-blind (author names and affiliations must appear on the manuscript; the same in both the ICPR 2024 and 2026 official
      guidelines)
    - >-
      As of ICPR 2024, Springer LNCS format with a maximum of 15 pages including references (the ICPR 2026 page limit could not be confirmed
      on the official page)
    - Supplementary material is optional, a single file of up to 50MB, used for reviewers' reference only (ICPR 2026 Instructions)
    - >-
      Proceedings published by Springer (ICPR 2024: Springer LNCS; the ICPR 2026 Proceedings page links to Springer DOIs, 16 volumes for the
      main conference plus 5 for workshops)
    - Reproducible Research in Pattern Recognition (RRPR) badge program in place
    - ICPR 2024 (Kolkata) accepted 963 of 2,106 submissions (per the Springer LNCS proceedings description, confirmed via search snippet)
  acceptance_rate: >-
    2024: 963 accepted / 2,106 submissions (approx. 45.7%, Springer LNCS proceedings description; based on search result snippet, the page
    itself could not be opened)
  sources:
    - https://icpr2026.org/
    - https://icpr2026.org/calls.html
    - https://icpr2026.org/instructions.html
    - https://icpr2026.org/proceedings.html
    - https://iapr.org/archives/icpr2024/cfp.html
kccv:
  name_en: KCCV
  full_en: Korean Conference on Computer Vision
  about: >-
    KCCV (Korean Conference on Computer Vision) is the flagship domestic computer vision conference organized by the Korean Computer Vision
    Society (KCVS), an incorporated association. First held in 2014, it reached its 12th edition in 2025. It is held once a year in summer
    (early August), and the core format invites Korean researchers who have published at top-tier international venues such as CVPR, ICCV,
    NeurIPS and ICLR to give oral and poster presentations. For 2026 (BEXCO, Busan), about 170 presentations and more than 1,300
    participants are expected, announced as the largest edition ever.
  topics:
    - Computer vision in general (centered on work presented at top-tier venues such as CVPR, ICCV, ECCV, NeurIPS and ICLR)
    - Privacy & Safety (2026 oral session name)
    - Diffusion Models (2026 oral session name)
    - 3D vision (specialty of 2026 keynote/invited speakers Matthias Niessner and Angela Dai; an official topic list has not been confirmed)
  features:
    - >-
      No separate public call for papers (CFP) document could be found on the official site. The official description reads 'Korean
      researchers who have presented results at top-tier international conferences are invited to give oral and poster presentations' (i.e.,
      a re-presentation format for already-published papers)
    - Main conference of 3 days plus a separate 1-day online (virtual only) workshop/tutorial day
    - Doctoral Colloquium (PhD student session), mentoring sessions, sponsor exhibition and recruiting booths
    - Officially announced that student poster presentation opportunities were greatly expanded in 2026
    - 'Keynotes are delivered in English by overseas speakers (2026: Rene Vidal, Matthias Niessner, Angela Yao)'
    - >-
      Registration fees (2026, early/on-site): regular KRW 360,000/400,000, graduate students KRW 260,000/300,000, undergraduates KRW
      200,000/200,000
    - The host society KCVS also organizes the IPIU workshop and runs a 'Researcher Forum' twice a year
  typical_schedule: >-
    Held for 3 days in early August every year (2025: Aug 4-6, BEXCO Busan; 2026: Aug 3-5, BEXCO Busan). 2026 early registration deadline
    Jul 30. The pattern of paper/poster application deadlines could not be confirmed on the official pages. 2027 schedule not yet announced
    (as of 2026-11-17)
  acceptance_rate: null
  sources:
    - https://kcvs.kr/?act=info.workshop&pseq=9
    - https://kcvs.kr/?act=info.workshop&pseq=8
    - http://kcvs.kr/
    - https://kcvs.kr/?act=board&bbs_code=news-notice
ipiu:
  name_en: IPIU
  full_en: Workshop on Image Processing and Image Understanding
  about: >-
    IPIU (Workshop on Image Processing and Image Understanding) is a long-running domestic workshop in image processing and computer vision,
    started in 1989 and reaching its 39th edition in 2027. It is organized by the Korean Computer Vision Society (KCVS) and co-hosted by the
    Korean Institute of Broadcast and Media Engineers, The Institute of Electronics and Information Engineers, the Korean Institute of
    Information Scientists and Engineers, the Korea Multimedia Society and the Korean Institute of Communications and Information Sciences,
    and is held once a year in February on Jeju. It brings together academic and industry researchers and students, and is sponsored by many
    companies including Hanwha, Samsung, LG AI Research and Qualcomm.
  topics:
    - Image processing
    - Image understanding
    - Pattern recognition
    - Image coding
    - Software for image processing
    - Computer vision
    - Machine learning
    - Medical imaging
    - Multimedia communications
    - Multimedia applications
    - Character recognition and related areas
  features:
    - Papers of 2-6 pages, written in Korean or English (Hangul/MS Word templates and an Overleaf LaTeX template provided)
    - Program centered on oral and poster presentations; final revised paper submitted after review notification
    - Early-career researcher sessions (4 sessions in 2027), special lectures and invited talks
    - 'Doctoral Consortium: separate call for new PhDs or PhD candidates about to graduate'
    - >-
      Many industry sponsors from Platinum to Startup tiers, with recruiting promotion (Hanwha Vision, Samsung, LG AI Research, Qualcomm,
      etc.)
    - IPIU 2026 Proceedings and program book posted on the notice board (DBpia indexing not confirmed)
    - Author registration deadline is one week earlier than general early registration
  typical_schedule: >-
    Held for 3 days in mid-February every year on Jeju (2027: Feb 17-19, Maison Glad Jeju). Paper deadline in mid-December (2027:
    2026-12-18), review notification Jan 18, camera-ready Jan 22, author registration Jan 29, early registration Feb 5
  acceptance_rate: null
  sources:
    - https://ipiu.or.kr/
    - https://ipiu.or.kr/?act=info.page&pcode=sub02
    - https://ipiu.or.kr/?act=info.page&pcode=greetings
    - http://kcvs.kr/
kcc:
  name_en: KCC
  full_en: Korea Computer Congress
  about: >-
    KCC (Korea Computer Congress) is a comprehensive conference covering all areas of computer science and information technology, organized
    by the Korean Institute of Information Scientists and Engineers (KIISE), and held for 3 days in late June every year (one of two annual
    comprehensive conferences, together with KSC). The 2026 edition was held at ICC Jeju under the theme 'New Challenges of Computing toward
    the Era of Superintelligent AI', with 25 oral sessions and 10 poster sessions organized across regular, undergraduate and junior paper
    categories. About 35 institutions and companies sponsored it, including IITP, Samsung SDS and SK hynix.
  topics:
    - Artificial intelligence (general and applied)
    - Computer systems and next-generation architecture
    - System software
    - Data security and ethics
    - On-device AI optimization (2026 competition topic)
    - Workshop areas run by SIGs and research groups, such as explainable AI (XAI)
    - >-
      (The common KIISE comprehensive-conference call covers 23 areas per the KSC 2025 announcement, including high-performance computing,
      databases, software engineering, algorithms and language engineering; the KCC 2026-specific list has not been confirmed)
  features:
    - >-
      Paper categories: regular papers / undergraduate papers / junior papers (first author a high-school student); undergraduate and junior
      papers are judged by separate evaluators in the poster session
    - >-
      Presentation evaluation: session chairs and evaluators score out of 100 as 'quality of delivery 50 points + quality of research
      results 50 points'
    - >-
      About the top 10% of accepted papers are selected as Outstanding Papers and about the top 10% of presentations as Outstanding
      Presentation Papers, recommended for publication in the society's journals (undergraduate/junior papers excluded)
    - >-
      Oral presentations 15 minutes (including Q&A; bring a USB drive, personal laptops not allowed), poster boards 1 x 2 m (nine A4 sheets
      or one full sheet), poster presentations 5-7 minutes
    - No-show results in withdrawal from the proceedings, notification to the advisor, and non-recognition as a research achievement
    - >-
      Keynotes, invited talks, special sessions, Top Conference sessions, tutorials, workshops, early-career researcher networking session,
      competitions (on-device AI optimization, etc.), promotional booths
    - Templates for regular papers and undergraduate/junior papers (Hangul/MS Word) distributed in the resources section
  typical_schedule: >-
    Held for 3 days in late June every year (2026: Jun 24-26, ICC Jeju). 2026 paper templates released Mar 18; the paper deadline could not
    be confirmed on the official pages (the notice board is JS-rendered). 2027 schedule not yet announced
  acceptance_rate: null
  sources:
