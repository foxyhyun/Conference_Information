cleo:
  about: >-
    CLEO (Conference on Lasers and Electro-Optics) is the leading international conference on lasers and electro-optics, co-sponsored by
    Optica, the IEEE Photonics Society and the American Physical Society, and held every May in the United States. It features more than
    2,000 technical presentations across 29 topic categories, spanning fundamental science to industrial applications. The 2027 edition
    takes place May 2-7 at the Long Beach Convention Center (California), with the exhibition on May 4-5.
  topics:
    - Fundamental Science
    - Science & Innovations
    - Applications & Technology
    - Quantum computing / quantum technologies
    - Advanced imaging technologies
    - Laser science
    - Photonics / electro-optic technologies
  features:
    - >-
      Submission format: 35-word abstract plus 2-page summary; accepted summaries are published in the Technical Digest (based on a snippet
      of the CLEO submission guidelines page)
    - >-
      'Comprehensive, peer-reviewed' technical sessions - the IEEE Photonics Society announced that the 2026 program committee reviewed
      'thousands of submitted abstracts'
    - Postdeadline paper option available - 'strictly oral' (based on snippet)
    - >-
      Invited speakers and the program are organized around three core areas (Fundamental Science / Science & Innovations / Applications &
      Technology)
    - A two-day exhibition (May 4-5) runs alongside the Technical Conference (May 2-7)
    - >-
      2027 submission deadline: the official site shows only 'Now Accepting Submissions'; an aggregator site (cantonfair.net) lists
      2026-11-23 - official confirmation needed
