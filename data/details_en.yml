pw-bios:
  about: >-
    The Biomedical Optics / Biophotonics Symposium (BiOS) held within SPIE Photonics West, organized by SPIE every year in late January to
    early February at the Moscone Center in San Francisco. Photonics West as a whole draws roughly 24,000 attendees, more than 100
    conferences and over 4,500 presentations (per the 2027 announcement); BiOS is the track covering biophotonics, biomedical optics and
    imaging and is described as 'the most comprehensive biophotonics conference in the field'. Photonics West 2027 runs January 30 to
    February 4, with the BiOS Expo on January 30-31.
  topics:
    - Neurophotonics, Neurosurgery, and Optogenetics
    - Clinical and Translational Neurophotonics
    - 'Photons Plus Ultrasound: Imaging and Sensing'
    - Multiphoton Microscopy in the Biomedical Sciences
    - Optical Coherence Tomography
    - Therapeutics and Diagnostics
    - Tissue Optics
    - Nanophotonics (biomedical)
    - New imaging modalities
  features:
