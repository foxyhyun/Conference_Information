chil:
  about: >-
    CHIL (Conference on Health, Inference, and Learning) is a machine learning for health conference organized by the Association for Health
    Learning and Inference (AHLI); it has been AHLI's official conference since 2022 and is held annually. The 7th edition in 2026 was held
