    - https://cantonfair.net/event/34302-cleo-conference-and-exhibition
optica-biophotonics:
  about: >-
    The Optica Biophotonics Congress is a conference covering all of biophotonics, held by Optica (formerly OSA) every April in the United
    States; it merges the topics of Optica's former Biomedical Optics (BIOMED) and Optics in Life Sciences meetings into a single integrated
    program. Described as 'a leading international forum covering the full spectrum of biophotonics', it consists of technical sessions,
    industry panels, posters, postdeadline papers and networking. The 2027 edition takes place April 18-21 in Denver (Embassy Suites by
    Hilton Denver Downtown); the 2026 edition was held April 26-29 in Fort Lauderdale.
  topics:
    - 'Bio-Optics: Design and Application'
    - Clinical and Translational Biophotonics
    - Novel Techniques in Microscopy
    - Optical Manipulation and Its Applications
    - Optical Molecular Probes, Imaging and Drug Delivery
    - Optics and the Brain (Brain)
    - '  - Optics in the human central nervous system and peripheral nerves'
    - '  - Rethinking scan patterns and shaping light'
    - '  - Structural and super-resolution techniques'
    - '  - Analyzing circuitry, network function and information processing'
    - '  - Optogenetics, genetic encoding and novel probes'
    - '  - Scattering, clearing and wavefront engineering'
    - '  - Brain physiology and disease'
    - '  - Functional brain imaging and neurodevelopment'
    - '  - Big data tools / Optical hybrids'
  features:
    - >-
      Submission format: 35-word abstract plus 2-page summary; summaries are published as the Technical Digest on the Optica Publishing
