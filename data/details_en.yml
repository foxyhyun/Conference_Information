kosaim:
  name_en: KoSAIM Conference
  full_en: Korean Society of Artificial Intelligence in Medicine Annual Conference
  about: >-
    The Korean Society of Artificial Intelligence in Medicine (KoSAIM) is a medical AI society founded jointly by the medical and
    engineering communities, following a founding public hearing and founders' meeting at Asan Medical Center in Seoul in July 2018; its
    first Spring Conference in May 2019 drew about 600 experts. It now holds its annual conference every October at the Grand
    InterContinental Seoul Parnas (2025: Oct 24-25; 2026: Oct 23-24), and KoSAIM 2026 drew about 700 attendees, roughly 1.5 times the
    previous year. Its scope is expanding from radiology to pathology and biosignals (ECG), and medical AI companies such as Lunit, Deepnoid
    and VUNO take part in the exhibition.
  topics:
    - Medical foundation models (2026 session topic)
    - Agentic AI (2026 session topic)
    - Chest imaging AI (X-ray/CT, vision-language)
    - Brain MRI analysis
    - Digital pathology / cytopathology (AI for Pathology satellite workshop)
    - Biosignal (ECG) analysis
    - Hospital AI adoption cases (presentations from Asan Medical Center, Seoul National University Hospital and Severance)
    - Medical AI reimbursement, regulation and trustworthiness
  features:
    - >-
      Abstract submission categories: poster exhibition/presentation vs. free-paper oral presentation; oral submissions may be reassigned to
      poster after review (2025 announcement)
    - >-
      Online submission via the abstract submission menu on the event page after signing up/logging in on the society website; an Abstract
      Template for the abstract book must be completed and uploaded, with the presenter underlined
    - 2026 poster/free-paper abstract submission extended to Sep 15; 2025 deadline Sep 12 midnight; 2024 window Jul 15 - Aug 31 23:00
    - 'Satellite sessions (2026: AI for Pathology, the 1st Pathology Imaging Research Group workshop)'
    - Award calls such as the Lunit Academic Award (2026 application deadline Jun 30)
    - Corporate exhibition booths (Lunit, Deepnoid, VUNO, AITRICS, Seers Technology, Mediwhale, etc.)
    - >-
      The official site (kosaim.org) blocks automated fetching (HTTP 403), so detailed format, length and language requirements are
      unconfirmed
  typical_schedule: >-
    2 days, Friday to Saturday in the fourth week of October every year at the Grand InterContinental Seoul Parnas (2025: Oct 24-25; 2026:
    Oct 23-24). Abstract deadline mid-September (2025: Sep 12; 2026: extended to Sep 15). 2027 schedule not yet announced
  acceptance_rate: null
  sources:
    - https://www.kosaim.org/html/?pmode=BBBS0007100001
    - https://www.kosaim.org/html/?pmode=BBBS0007100001&seq=1163&smode=view
    - https://kosaim.org/html/?pmode=BBBS0007100001&seq=1043&smode=view
    - https://newsway.co.kr/news/view?ud=2026102009380157840
    - https://medicaltimes.com/Users/News/NewsView.html?ID=1171474
    - https://www.medicaltimes.com/Main/view.html?ID=1126525
ksbns:
  name_en: KSBNS K-Brain
  full_en: Korean Society for Brain and Neural Sciences Annual Meeting (K-Brain)
  about: >-
    The Korean Society for Brain and Neural Sciences (KSBNS), an incorporated association, is the leading domestic neuroscience society,
    founded in December 1998 through the merger of the Korean Society for Neuroscience and the Korean Society for Neurobiology (incorporated
    in 2018). Since its 1st annual meeting in June 1999 it has held an annual international meeting once a year. Recently branded 'K-Brain',
    the 29th meeting in 2026 (K-Brain 2026, Sep 6-8, Daejeon Convention Center) was reported as the largest international neuroscience
    conference in Korea, with about 2,500 participants from 20 countries. The society has 10 divisions including glia, synapses, higher
    cognition and translational medicine.
  topics:
    - Molecular and Cellular Neuroscience
    - Synapses and Circuits Neuroscience
    - Systems and Cognitive Neuroscience
    - Mechanistic, Translational, and Clinical Neuroscience of Brain Disorders
    - Computational Neuroscience, Neuro-Tools and Neuroengineering
    - Others
  features:
    - >-
      Abstracts entirely in English, submitted online; title 250 characters, body 2,200 characters, acknowledgments 400 characters
      (including spaces), one graphic (JPG/PDF, 10 MB or less), one abstract per person, two categories designated
    - >-
      Presentation type chosen among Poster / Oral / Invited session; Oral selection is decided by Scientific Program Committee review, and
      those not selected may present a poster; review outcomes are accept, reject or revision requested
    - Submitters and presenters must complete registration payment; co-authors also register individually
    - >-
      Awards: KSBNS Outstanding Poster Awards (student and postdoc members, KRW 100,000), Scitech Korea Best Oral Presentation Awards (10
      papers, KRW 500,000), IBRO Travel Awards (14 papers from IBRO-APRC countries, KRW 500,000); award applicants must submit an extended
      abstract and research highlights and attend the closing ceremony
    - Late-breaking abstract call (2026)
    - >-
      31 symposia, educational sessions, joint sessions with related societies (Korean Society for the Study of Obesity, Korean Movement
      Disorder Society, Korean Society for Brain Stimulation, etc.), up to 15 continuing education credits
    - >-
      Keynotes centered on overseas distinguished scholars (2026: Ole Kiehn, Masashi Yanagisawa, Jennifer Raymond, Jun Huh); Abstract Book
      made public
  typical_schedule: >-
    Held for 3 days in early September every year (2026: Sep 6-8, DCC Daejeon). 2026 abstract submission Mar 16 - Aug 31 23:59 KST,
    early-bird registration Mar 16 - Jun 12. K-Brain 2027 symposium proposal deadline 2027-01-10 (announced 2026-11-16); 2027 main meeting
    dates and abstract deadline not yet announced
  acceptance_rate: null
  sources:
    - https://www.ksbns.org/
    - https://www.ksbns.org/info/history.asp
    - https://ksbns2026.org/
    - https://ksbns2026.org/abstract/
    - https://www.newswire.co.kr/newsRead.php?no=1036298
