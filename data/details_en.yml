      Oral: regular talks 15 minutes (including Q&A), invited 30 minutes, tutorials 90 minutes, plenary 45 minutes; oral may be converted to
      poster depending on venue operations
    - Poster panels 95 x 150 cm; presenters must stay at least 40 minutes after the session starts (otherwise treated as a No Show)
    - The Winter Meeting is held concurrently with the Nth annual general assembly, alongside the optical industry exhibition OptoWin
    - Non-members can also submit abstracts using the account created at early registration
    - >-
      The Photonics Conference (PC) is a divisional conference with Program (Oral)/Program (Poster) tracks and special sessions (2026: laser
      notching for secondary batteries); the Photonics Division holds it annually together with COOC (Conference on Optoelectronics and
      Optical Communications)
    - The society's Young Scientist grant can be used for Winter/Summer Meeting registration fees
  typical_schedule: >-
    Winter: 4 days in early-to-mid February every year at BEXCO Busan (2026: Feb 3-6; 2027: Feb 16-19). Abstract submission mid-October to
    mid-December (2026 Winter: Oct 20 - Dec 14; 2027 Winter: 2026-10-19 - 12-13), early registration until mid-to-late January (2027: until
    Jan 25). Summer (OPC 2026): Jul 19-22, ICC Jeju, abstracts Mar 30 - May 17, early registration until Jun 29. Photonics Conference: 3
    days in the last week of November every year (2026: Nov 25-27, Yeosu), abstract deadline mid-October (2026: Oct 16 -> Oct 23, no further
    extension), early registration Nov 6
