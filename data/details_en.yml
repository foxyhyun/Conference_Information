    - https://confcats-event-sessions.s3.us-east-1.amazonaws.com/isbi26/uploads/ISBI_2026_Program_v11b.pdf
ipmi:
  about: >-
    IPMI (Information Processing in Medical Imaging) is a biennial conference on medical image computing methodology, described as one of
    the premier forums in the field with a tradition of about 58 years. The 30th edition in 2027 will be held at the Jouvence centre in
    Orford, Quebec, Canada (June 27 - July 2) with an expected attendance of about 120; it is run in a retreat format in which all
    participants lodge and dine together. Accepted papers are published in Springer LNCS.
  topics:
    - Mathematical foundations and computational methods
    - Image formation and reconstruction
    - Machine learning and intelligence
    - Clinical applications and translation
    - Visualization and human-AI interaction
  features:
    - >-
      12 pages of main text (excluding references) in Springer LNCS format; no supplementary material of any kind is allowed, and formatting
      violations result in a desk reject
    - Double-blind review; the full-paper deadline is 1 week after the abstract deadline (no extensions)
    - Unlimited, untimed Q&A after each presentation is central to the conference
    - 'A small retreat of about 120 participants: all-inclusive registration covering lodging and meals'
    - Authors must attend in person, and one author registration is required per accepted paper
    - >-
      Accepted papers are published in Springer LNCS; outstanding papers are invited to submit extended versions to a Medical Image Analysis
      (MedIA) special issue (2027, publisher process in progress)
  acceptance_rate: null
  typical_schedule: null
  sources:
    - https://2027.ipmi-conf.org/
embc:
  about: >-
    EMBC is the annual flagship conference of the IEEE Engineering in Medicine and Biology Society (EMBS); its first meeting was held in
    Denver in 1979, and average attendance is about 3,000. The 48th edition in 2026 will be held at the Metro Toronto Convention Centre in
    Toronto, Canada (July 26-30), with submissions from more than 80 countries. It is a broad community spanning all of biomedical
    engineering, including biosignal processing, medical imaging, neural engineering and wearable sensors.
  topics:
    - Biomedical Signal Processing
    - Biomedical Imaging and Image Processing
    - Bionanotechnology & BioMEMS (BNM)
    - Cardio-Pulmonary Systems and Physiological Engineering
    - Neural and Rehabilitation Engineering
    - Therapeutic & Diagnostic Systems and Technologies
    - Wearable Biomedical Sensors and Systems
    - Biorobotics and Biomechanics
    - Biomedical & Health Informatics
    - 'Biomedical Engineering for Society: Educating Innovators and Advancing Health Equity'
    - 'From Fashion to Function: User-Centered Smart Textiles for Healthcare'
  features:
    - Two tracks, Full Contributed Papers (4-7 pages per the 2026 template) and 1-Page Research Poster Papers
    - Full papers that are not accepted despite high scores are offered a transfer to the 1-page poster track
    - Single-blind review, with reviewers assigned by theme and keywords
    - >-
      Accepted full papers are indexed in IEEE Xplore and PubMed/MEDLINE after on-site presentation; 1-page papers are neither published nor
      indexed
    - Roughly the top 7% of submissions by review score are invited to submit extended versions to an IEEE TBME special issue
    - Up to 2 accepted papers per registration, and up to 35 authors per paper
  acceptance_rate: null
  typical_schedule: null
  sources:
    - https://embc.embs.org/2026/
    - https://embc.embs.org/2026/papers/
    - https://embs.org/events/sponsorship
spie-mi:
  about: >-
    SPIE Medical Imaging is a symposium dedicated to medical imaging, held every February by SPIE (the international society for optics and
    photonics) and composed of 9 sub-conferences including image processing, physics, computer-aided diagnosis, perception and image-guided
    procedures. The 2027 meeting will be held in Vancouver, Canada (February 14-18), and the abstract deadline was August 5, 2026. The
    community brings together researchers in technology development and clinical evaluation, from imaging physics and hardware to CAD and
    pathology.
  topics:
    - Physics of medical imaging
    - Medical image processing
    - Computer-aided diagnosis
    - Image perception and observer performance
    - Image-guided procedures
    - Digital and computational pathology
    - Ultrasonic imaging and tomography
    - Imaging informatics
    - AI/ML application track (artificial intelligence, machine learning, deep learning)
  features:
    - >-
      Abstract-first submission: an abstract for technical review (200-300 words), a program summary (50-150 words) and a review-only 2-4
      page supplementary PDF
    - Conference chairs/editors assess technical merit and fit and decide oral/poster assignments
    - >-
      After acceptance, a technical manuscript of at least 4 pages must be submitted about 3 weeks before the conference to be published in
      the Proceedings of SPIE (SPIE Digital Library)
    - >-
      Only manuscripts that are presented on site and submitted by the deadline are published; oral presentations are recorded and included
      in the Proceedings along with the slides
    - >-
      About 6 months elapse between the abstract deadline (August) and the conference (February); the manuscript deadline is in January,
      just before the conference
  acceptance_rate: null
  typical_schedule: null
  sources:
    - https://www.spie.org/conferences-and-exhibitions/medical-imaging/presenters/abstract-submission-guidelines
    - https://www.electrooptics.com/event/spie-medical-imaging-2027
icip:
  about: >-
    ICIP (IEEE International Conference on Image Processing) is the IEEE Signal Processing Society's flagship conference for image
    processing, vision and imaging, held annually since 1994 and attended by more than 1,000 participants from over 100 countries. The 33rd
    edition in 2026 will be held in Tampere, Finland (September 13-17). It is a large community covering all of image processing, with more
    than 100 technical sessions, satellite workshops, special sessions and grand challenges.
  topics:
    - Image processing
    - Computer vision
    - Imaging
    - Special sessions
    - Satellite workshops
    - Grand challenges
  features:
    - Regular papers of up to 5 pages plus 1 page reserved for references, published in IEEE Xplore
    - >-
      OJSP (IEEE Open Journal of Signal Processing) track: 8+1 pages, reviewed on the same timeline as the conference, published in the
      open-access journal and then presented at the conference
    - Double-anonymous review plus an author rebuttal period
    - A 1-page Work-in-Progress abstract track (May deadline) and a track for presenting recently accepted SPS journal papers
    - Top papers are selected for Spotlight sessions and offered fast-track review of extended versions in IEEE TIP/TCI
    - >-
      Open Preview: accepted papers are made freely available on IEEE Xplore before the conference; strict no-show policy (papers not
      presented are not published)
  acceptance_rate: null
  typical_schedule: null
  sources:
    - https://2026.ieeeicip.org/
    - https://2026.ieeeicip.org/call-for-papers-and-abstracts/
    - https://ieeeicip.org/
icassp:
  about: >-
    ICASSP (IEEE International Conference on Acoustics, Speech and Signal Processing) is the flagship conference of the IEEE Signal
    Processing Society, held annually since its start in Philadelphia in 1976. It is the largest conference in signal processing, with 4,403
    attendees in Seoul in 2024 and about 4,000 in Hyderabad in 2025, and 3,393 accepted papers in 2025; the 51st edition in 2026 will be
    held in Barcelona (May 4-8) and the 52nd in 2027 in Toronto (May 16-21). It gathers the whole signal processing community, spanning
    audio, speech, image, medical imaging and machine learning.
  topics:
    - Biomedical Imaging & Signal Processing
    - Computational Imaging
    - Image, Video & Multidimensional Signal Processing
    - Machine Learning and Generative AI
    - Computer Vision
    - Compressive Sensing, Sparse Modeling
    - Signal Processing Theory & Methods
    - Sensor Array & Multichannel SP
    - Audio & Acoustic Signal Processing
    - Speech & Language Processing
    - Signal Processing over Graphs
    - Multimedia Signal Processing
    - Remote Sensing & Signal Processing
    - Applied Signal Processing Systems
  features:
    - Regular papers have up to 4 pages of technical content plus a 5th page reserved for references (5 pages total may not be exceeded)
    - >-
      Single-anonymous review, at least 3 reviewers per paper, and an optional rebuttal of 1 week or more (visible only to the TC/Area
      Chair)
    - 12 Technical Committees handle reviewing by area
    - >-
      OJSP special track (8+1 pages): same review timeline as the conference, journal publication followed by conference presentation (not
      included in the proceedings)
    - 'Open Preview: proceedings are freely available on IEEE Xplore from 30 days before the conference'
    - A presentation track for accepted IEEE SPS/EURASIP journal papers (no re-review, not included in the proceedings)
    - >-
      One author of each accepted paper must present in person; papers without completed registration are automatically withdrawn from the
      proceedings
  acceptance_rate: null
  typical_schedule: null
  sources:
