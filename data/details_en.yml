  features:
    - >-
      Submission format: 35-word abstract plus 2-page summary; summaries are published as the Technical Digest on the Optica Publishing
      Group platform (indexed in Ei Compendex, Scopus and Google Scholar)
    - >-
      'All paper submissions are carefully peer-reviewed' - presentation type is chosen from Oral Only / Poster Only / Oral or Poster
      Acceptable, with the final decision made by the committee
    - '2027 deadline: 2026-12-08, 12:00 US Eastern Time (UTC-5); no revisions after the deadline'
    - >-
      The neurophotonics community participates through the 'Optics and the Brain' category (formerly the BRAIN topical meeting) - 10
      subtopics are listed in the official category
    - >-
      Through 2026 the congress was organized as five topical meetings (Translational / Microscopy / OCT / OT&S / Brain); from 2027 it is
      restructured into six topic categories
    - >-
      Recorded presentations are made available on the Optica website for up to 60 days after the meeting, including the postdeadline papers
      session
  acceptance_rate: null
  sources:
    - https://www.optica.org/events/congress/biophotonics_congress/about/
    - https://www.optica.org/events/congress/biophotonics_congress/submit_papers/
    - https://www.optica.org/events/congress/biophotonics_congress/program/topic_categories/
ecbo:
  about: >-
    The European Conferences on Biomedical Optics (ECBO), co-sponsored by Optica and SPIE, is Europe's largest biomedical optics conference.
    It is held biennially (June of odd years) at the ICM in Munich as part of the World of Photonics Congress, alongside the LASER World of
    PHOTONICS trade fair. It brings together researchers, engineers and clinicians applying optics and photonics to medical and biomedical
    problems; the 2027 edition takes place June 20-24 in Munich. The World of Photonics Congress 2025 as a whole had 3,500 attendees and
    2,670 oral and poster presentations.
  topics:
    - 'ECBO 1: Translational Biophotonics: Diagnostics and Therapeutics'
    - 'ECBO 2: Diffuse Optical Spectroscopy and Imaging'
    - 'ECBO 3: Optical Systems for Mechanical and Biophysical Investigation (OMBI)'
    - 'ECBO 4: Advances in Microscopic Imaging'
    - 'ECBO 5: Optoacoustic Methods and Applications in Biophotonics'
    - 'ECBO 6: Optical Coherence Imaging Techniques and Imaging in Scattering Media'
  features:
    - >-
      Biennial - held concurrently with the World of Photonics Congress (2027: June 20-25) and the LASER World of PHOTONICS trade fair
      (2027: June 22-25)
    - '2027 abstract deadline: 2027-01-27, 23:55 US Eastern Time (UTC-5) (per the Optica submission page)'
    - >-
      Co-sponsored by Optica and SPIE - presented papers are published in both the SPIE Digital Library and Optica Publishing Group (per
      SPIE guidance snippet); Optica provides them as 'Technical Digest papers'
    - >-
      Organized as six sub-conferences (ECBO 1-6) (topic list as of 2025) - includes neurophotonics-related tracks such as diffuse optical
      spectroscopy/imaging (ECBO 2) and optoacoustics (ECBO 5)
    - >-
      CLEO/Europe-EQEC, Optical Metrology, Digital Optical Technologies, LiM and others are held within the same Congress, allowing
      cross-attendance
  acceptance_rate: null
  sources:
    - https://www.optica.org/events/topical_meetings/european_conferences_biomedical_optics/about/
    - https://optica.org/events/topical_meetings/european_conferences_biomedical_optics/program/scope_and_topics/
    - https://www.optica.org/events/topical_meetings/european_conferences_biomedical_optics/submit_papers/
    - https://world-of-photonics.com/en/congress
    - https://lux.spie.org/conferences-and-exhibitions/european-conferences-on-biomedical-optics/programme/conferences
spie-optics-photonics:
  about: >-
    SPIE Optics + Photonics is North America's largest multidisciplinary optics and photonics meeting ('the largest international,
    multidisciplinary optical sciences and technology meeting in North America'), held by SPIE every August at the San Diego Convention
    Center and consisting of a technical program, an industry exhibition and networking. Third-party tallies put attendance at roughly
    4,000. It covers a broad range including optical engineering, nanophotonics, quantum technologies, organic photonics and astronomical
    instrumentation; biomedical optics is not a main track.
  topics:
    - Nanoscience + Engineering (Applications)
    - Optical Engineering + Applications
    - Organic Photonics + Electronics
    - Nano-photonics
    - Quantum technologies / quantum science
    - Imaging
    - Astronomical instrumentation
  features:
    - >-
      Organized into three programs (Nanoscience + Engineering / Optical Engineering + Applications / Organic Photonics + Electronics)
      (based on search results)
    - >-
      SPIE-style abstract submission followed by a SPIE Proceedings manuscript (presumed to follow the same system as Photonics West, but
      the official O+P 2027 guidance was not accessible)
    - Industry exhibition held alongside - the 2026 exhibition is August 25-27 (per third-party listing)
    - Scheduled for San Diego in 2027 but dates are 'TBD' and the abstract deadline is unpublished (the 2025 deadline was May 7)
    - 2026 dates differ between sources (August 17-21 vs August 23-27) - official confirmation needed
  acceptance_rate: null
  sources:
    - https://starbridge.ai/conferences/spie-optics-photonics-2026
    - https://www.showsbee.com/fairs/90242-SPIE-Optics-Photonics-2027.html
    - https://www.gophotonics.com/events/details/1128-spie-optics-photonics-2026
    - https://spie.org/conferences-and-exhibitions/optics-and-photonics/presenters
sfn:
  about: >-
    'Neuroscience 20xx' is the world's largest neuroscience meeting, held by the Society for Neuroscience (SfN; founded 1969, roughly
    35,000-37,000 members) every October-November in a major US city. The 2024 meeting in Chicago had 22,359 attendees. The 2026 meeting
    takes place November 14-18 at the Walter E. Washington Convention Center in Washington, D.C., with a virtual component running November
    5 to December 20.
  topics:
    - 'Theme A: Development'
    - 'Theme B: Neural Excitability, Synapses, and Glia'
    - 'Theme C: Neural Aging and Degeneration'
    - 'Theme D: Neuroimmunity, Neurovasculature, and Neural Injury'
    - 'Theme E: Sensory Systems'
    - 'Theme F: Motor Systems'
    - 'Theme G: Integrative Physiology and Behavior'
    - 'Theme H: Motivation and Emotion'
    - 'Theme I: Cognition'
    - 'Theme J: Techniques'
    - 'Theme K: History, Education, and Society'
  features:
    - >-
      Abstract-only submission with a short regular submission window (2026: May 27 to June 10, 5 p.m. EDT); late-breaking abstracts
      September 8-15 or until the cap of 2,500 is reached
    - >-
      An SfN regular member must sign as the submitting author, and each person may be presenting author on only one scientific abstract
      plus one Theme K abstract
    - 'Non-refundable fee per abstract: $175 regular, $260 late-breaking'
    - >-
      Presentation formats: Nanosymposium (oral), Poster, Theme K Poster - no cap on the total number of regular abstracts accepted; the
      Program Committee rejects abstracts that violate the rules
    - Optical neuroimaging and neurophotonics work is typically submitted under Theme J (Techniques) or the relevant biological theme
    - Large industry exhibition held alongside (Exhibitor Prospectus available)
  acceptance_rate: null
  sources:
    - https://www.sfn.org/meetings/neuroscience-2026
    - https://www.sfn.org/meetings/neuroscience-2026/call-for-abstracts
    - https://www.sfn.org/meetings/neuroscience-2026/call-for-abstracts/rules-for-abstract-submissions
    - https://www.sfn.org/meetings/neuroscience-2026/themes-and-topics
    - https://en.wikipedia.org/wiki/Society_for_Neuroscience
ohbm:
  about: >-
    The Organization for Human Brain Mapping (OHBM, founded in Paris in 1995) is a neuroimaging society studying the anatomical and
    functional organization of the human brain; it holds its annual meeting every June, rotating between continents (recent attendance
    roughly 2,500-3,000). The 2026 meeting is June 14-18 in Bordeaux, France, and the 2027 meeting is June 26-30 at the Metro Toronto
    Convention Centre in Toronto, Canada. Members range from clinicians in neurology and psychiatry to physicists, engineers, software
    developers and statisticians.
  topics:
    - Poster Abstracts
    - Symposia
    - Educational Courses
    - Roundtable Discussions
    - Registered Reports (new for 2027)
    - SIG, Chapter, and Committee Activities
  features:
    - >-
      650-word abstract limit (four mandatory sections - Introduction/Methods/Results/Conclusion - including figure captions), up to 2
      figures (2MB each)
    - >-
      Regular submissions go to the 'Poster Abstracts' category - oral presentations are separate proposals such as Symposia; participation
      is limited to one Educational Course plus one scientific session
    - >-
      Abstract submission fee of $45 (non-refundable), waivable for submitters from eligible countries by UNESCO criteria; presenters must
      attend in person
    - >-
      2027 timeline: submissions open 11/2/2026 - deadline 12/14/2026 - acceptance notification February 2027 - registration opens January
      2027
    - Registered Reports introduced from 2027 (Stage 1 notification 2027-01-15, final decision 2027-05-07)
    - OHBM runs its own publishing platform, Aperture Neuro; a Korea Chapter exists
  acceptance_rate: null
  sources:
    - https://humanbrainmapping.org/ohbm-2027/
    - https://humanbrainmapping.org/ohbm-annual-meeting-faq/
    - https://www.humanbrainmapping.org/
    - https://en.wikipedia.org/wiki/Organization_for_Human_Brain_Mapping
fens:
  about: >-
    The FENS Forum of Neuroscience is Europe's largest international neuroscience meeting, held biennially (July of even years) since 1998
    by the Federation of European Neuroscience Societies (FENS; 42-43 societies from 32-33 countries, more than 22,000 members). Attendance
    was 7,890 in Paris in 2022 and 7,155 in Vienna in 2024. The 2026 Forum is July 6-10 in Barcelona (jointly with the Spanish Society for
    Neuroscience) and the 2028 Forum is July 8-12 in Glasgow, UK (hosted by the British Neuroscience Association).
  topics: []
  features:
    - Biennial (even years) - co-hosted with the host country's society (Spain in 2026, BNA/Glasgow in 2028)
    - >-
      Abstract deadline is five months before the meeting (2026: February 5, the same deadline as travel grants and early registration);
      late-breaking abstract deadline 2026-04-27
    - Poster-centered program ('Poster Presentations and Guidelines'); ePosters were used in 2024
    - Exhibition and sponsor program held alongside (exhibition floor plan, sponsor theatre sessions)
    - >-
      A theme/topic list exists under the 'Themes and Topics' menu on the official site, but its content could not be verified in this
      survey
  acceptance_rate: null
  sources:
    - https://fensforum.org/
    - https://fensforum.org/?p=5511
    - https://fens.org/news-activities/news/fens-forum-2028-location-announcement
    - https://www.bordeaux-neurocampus.fr/?p=195173
fom:
  about: >-
    Focus on Microscopy (FOM) is an annual international conference on optical microscopy that began in 1988, organized by the Dutch FOM
    foundation together with local institutions in the week before Easter at a different location each year (Taipei 2025, Stockholm 2026,
    Osaka 2027). Starting from three-dimensional imaging with confocal and multiphoton microscopy, it now covers the full range of
    microscopy innovation including super-resolution, light sheet, adaptive optics and AI, and serves as a meeting place for developers and
    users with an accompanying technical exhibition.
  topics:
    - Theory and practice of confocal and multiphoton-excitation microscopy
    - Super-resolution microscopy
    - AI in microscopy
    - 3D and 4D live cell and tissue imaging
    - Adaptive optics for microscopy
    - Light sheet microscopy
    - Phase/interference based microscopies
    - OCT, holography, endoscopy
    - 'Advanced fluorescence imaging/spectroscopy: FRET, FRAP, FLIM, FCS, SOFI'
    - New fluorescent probes, proteins, quantum dots, single molecule imaging
    - Clearing and expansion techniques
    - 'Coherent non-linear microscopies: SHG, THG, SFG, CARS'
    - Multi-dimensional fluorescence and Raman spectroscopy imaging
    - Fast acquisition, automated and high-content microscopy
    - 3D image processing and visualization for multidimensional data
  features:
    - >-
      One-page PDF abstract submission (all one-page abstracts since 2004 are permanently archived and searchable in the online FOM
      archive); no separate proceedings
    - >-
      Authors may request a 20-minute oral presentation or a poster, but 'Oral presentations can not be guaranteed' - the abstract selection
      committee and organizing committee make the final decision; for 2027, notification in early February
    - >-
      Held annually at a different location each year (the week before Easter), co-organized by the FOM foundation and a local
      society/university
    - >-
      40-minute plenaries and 20-minute parallel-session talks (including discussion), two poster sessions (2027: March 22 and 23); flash
      poster presentations have been held in the past
    - >-
      Accompanied by a technical exhibition of microscopy companies ('accompanied by a technical exhibition'); the 2027 main sponsor is
      Nikon
  acceptance_rate: null
  sources:
    - https://www.focusonmicroscopy.org/
    - https://www.focusonmicroscopy.org/2027-submit/?event_id=11725
    - https://www.focusonmicroscopy.org/2027-about/?event_id=11725
    - https://www.becker-hickl.com/events/focus-on-microscopy-2026/
abc:
  about: >-
    The SPIE Advanced Biophotonics Conference (SPIE ABC) is an international biophotonics conference hosted by the Optical Society of Korea
    (OSK) with an organizing committee run by SPIE, held in Korea in the autumn (Busan, November 4-6, 2021; Jeju, November 1-4, 2023; Sono
    Belle Jeju, October 29 to November 1, 2025). The 2025 meeting was led by Prof. Ki-Hun Jeong of KAIST (conference chair) and Prof.
    Jae-Byum Chang (event chair), and its papers were published as Proc. SPIE 14016 (86 pages). Only odd-year editions have been confirmed
    so far, suggesting a biennial cycle, but no official announcement of a 2026/2027 edition was found.
  topics:
    - Clinical and translational biophotonics (keynote session)
    - Neurotechnology in surgery (satellite symposium, 2025)
    - OSK-CSOE Joint Symposium
    - Young Investigator's Award session
  features:
    - >-
      Published in SPIE Proceedings - 2025 as Proc. SPIE Vol. 14016 (editors: Ki-Hun Jeong, Hongki Yoo, Seung Ah Lee, Eun-Yeong Park); the
      2023 and 2021 editions are also listed on proceedings.com
    - >-
      A Korea-US joint structure (hosted by the Optical Society of Korea with an SPIE-run organizing committee), making it highly accessible
      to Korean biophotonics researchers
    - Submission via the conference's own abstract template (docx) (per 2025 site materials); Young Investigator Award session held
    - As of 2025, a small proceedings volume of 86 pages - a small, focused meeting compared with large conferences such as BiOS
    - Editions confirmed only in odd years (2021, 2023, 2025; biennial cycle presumed) - 2027 dates and deadlines unpublished
  acceptance_rate: null
  sources:
    - https://www.proceedings.com/spie14016.html
    - https://www.proceedings.com/content/085/085286webtoc.pdf
    - https://d2j16w31g89z0j.cloudfront.net/site/spie2025/SPIE_ABC_2025_Sponsorship_Prospectus(EN).pdf
    - https://d2j16w31g89z0j.cloudfront.net/site/spie2025/glance/SPIE_ABC_2025_Program_Book.pdf
    - https://ndlsearch.ndl.go.jp/books/R100000002-I032030470
fnirs:
  about: >-
    The largest conference in the fNIRS field, held biennially by the Society for functional Near-Infrared Spectroscopy (SfNIRS) and
    described as 'the largest and most important scientific conference about fNIRS in the world'. It began in Boston in 2010 and has since
    been held in London, Montreal, Paris, Tokyo, Boston and Birmingham; the 2026 edition (October 16-19) took place in Macau, and the
    meeting subsequently rotates between the Americas (2028), Europe (2030) and Asia (2032). The society's official journal is SPIE's
    Neurophotonics.
  topics: []
  features:
    - >-
      Submission format: 100-word short abstract plus a 1-page PDF summary following the template (including references and figures,
      Times/Palatino 10pt)
    - >-
      'All paper submissions will be carefully peer-reviewed' - a presentation preference (oral or poster / poster only / virtual only) can
      be selected; oral presentations are decided by the committee
    - Accepted and presented papers are posted on the conference website (no separate proceedings)
    - Biennial, rotating between continents (America 2028 → Europe 2030 → Asia 2032); a call for proposals to host the 2030 edition is open
    - >-
      Educational courses before the main meeting (2026: October 15-16) and a virtual conference (2026: October 13-14) held alongside; DEI
      travel grants require a separate application
    - >-
      The 2026 abstract deadline was 2026-03-31, 23:59 GMT+8 (submissions opened January 15) - a pattern of deadlines roughly 6.5 months
      before the meeting
  acceptance_rate: null
  sources:
    - https://fnirs.org/conferences/
    - https://fnirs2026.fnirs.org/
    - https://fnirs2026.fnirs.org/call-for-abstracts/
    - https://fnirs.org/
optica-imaging:
  about: >-
    The Optica Imaging Congress (formerly the Imaging and Applied Optics Congress), renamed the 'Optica ImageSense Congress' from 2027, is
    an integrated imaging and sensing conference held by Optica every July that brings together 14 topical meetings including COSI
    (Computational Optical Sensing and Imaging), DH (Digital Holography), 3D, AO and IS. It 'showcases breakthroughs in image acquisition,
    processing and display' and covers computational imaging, neuromorphic imaging, AR/VR and optical sensors. The 2026 edition is July
    12-17 in Maastricht and the 2027 edition is July 11-15 in Ottawa, Canada (The Westin Ottawa).
  topics:
    - 'COSI: Computational Optical Sensing and Imaging'
    - 'DH: Digital Holography and 3-D Imaging (standalone in alternating years)'
    - '3D: 3D Image Acquisition and Display'
    - 'AO: Adaptive Optics'
    - 'IS: Imaging Systems and Applications'
    - 'pcAOP: Propagation through and Characterization of Atmospheric and Oceanic Phenomena'
    - 'QSM: Quantum Sensing and Metrology'
    - 'HISE: Hyperspectral Imaging and Sounding of the Environment'
    - 'AIS: Applied Industrial Spectroscopy'
    - 'FTS: Fourier Transform Spectroscopy'
    - 'LACSEA: Laser Applications to Chemical, Security and Environmental Analysis'
    - Optical Sensors / ES / RadIT
    - 'Category: Photonic and Biological/Biomedical Sensing and Imaging'
    - 'Subtopic: 2D/3D Computational Microscopy, Tomography and Endoscopy'
  features:
    - >-
      Submission format: 35-word abstract plus 2-page summary; summaries are published as the Technical Digest by Optica Publishing Group
      (indexed in Ei Compendex, Scopus and Google Scholar)
    - >-
      'All paper submissions are carefully peer-reviewed' - Oral Only / Poster Only / Oral or Poster selection, with the final decision made
      by the committee
    - '2027 deadline: 2027-03-09, 12:00 US Eastern Time (UTC-5); no revisions after the deadline'
    - >-
      Of the nine topic categories, 'Photonic and Biological/Biomedical Sensing and Imaging' and 'Computational Imaging Techniques'
      (including computational microscopy and tomography) are the ones relevant to neurophotonics research
    - Student paper competitions per topical meeting (3-4 finalists, opt-in at submission)
    - >-
      Journal special issues linked to COSI (Applied Optics / Biomedical Optics Express / Optics Express; 2026 special issue deadline
      2026-11-30)
  acceptance_rate: null
  sources:
    - https://www.optica.org/events/congress/optica_imagesense_congress/
    - https://www.optica.org/events/congress/optica_imagesense_congress/about/
    - https://www.optica.org/events/congress/optica_imagesense_congress/submit_papers/
    - https://www.optica.org/events/congress/optica_imagesense_congress/program/topic_categories/
    - https://opg.optica.org/content/feature/announcement/item/boe-cosi2026
auto-icpr:
  about: >-
    ICPR (International Conference on Pattern Recognition) is the flagship conference of the International Association for Pattern
    Recognition (IAPR); following the 27th edition in Kolkata in 2024, the 28th was held August 17-22, 2026 in Lyon, France. A
    long-established conference that marked its 50th anniversary in 2024, it is organized into six tracks spanning pattern recognition,
    machine learning, computer vision, image/signal processing, biometrics, document analysis and biomedical imaging.
  topics:
    - Artificial Intelligence, Pattern Recognition and Machine Learning
    - Computer and Robot Vision
    - Image, Speech, Signal and Video Processing
    - Biometrics and Human Computer Interaction
    - Document Analysis and Recognition
    - Biomedical Imaging and Bioinformatics
  features:
    - Six-track structure with a dedicated 'Biomedical Imaging and Bioinformatics' track, so medical imaging work can be submitted
    - >-
      Review is single-blind (author names and affiliations must appear on the manuscript; the same in both the ICPR 2024 and 2026 official
      guidelines)
    - >-
      As of ICPR 2024, Springer LNCS format with a maximum of 15 pages including references (the ICPR 2026 page limit could not be confirmed
      on the official page)
    - Supplementary material is optional, a single file of up to 50MB, used for reviewers' reference only (ICPR 2026 Instructions)
    - >-
      Proceedings published by Springer (ICPR 2024: Springer LNCS; the ICPR 2026 Proceedings page links to Springer DOIs, 16 volumes for the
      main conference plus 5 for workshops)
    - Reproducible Research in Pattern Recognition (RRPR) badge program in place
    - ICPR 2024 (Kolkata) accepted 963 of 2,106 submissions (per the Springer LNCS proceedings description, confirmed via search snippet)
  acceptance_rate: >-
    2024: 963 accepted / 2,106 submissions (approx. 45.7%, Springer LNCS proceedings description; based on search result snippet, the page
    itself could not be opened)
  sources:
    - https://icpr2026.org/
    - https://icpr2026.org/calls.html
    - https://icpr2026.org/instructions.html
    - https://icpr2026.org/proceedings.html
    - https://iapr.org/archives/icpr2024/cfp.html
auto-icme:
  about: >-
    IEEE ICME (International Conference on Multimedia and Expo) is the flagship multimedia conference co-sponsored by four IEEE societies
    (Circuits and Systems, Communications, Computer, Signal Processing), held annually since 2000. The 2026 edition is July 5-9 in Bangkok,
    Thailand (QSNCC), and the 2027 edition is scheduled for July in Xiamen, China; it includes oral and poster sessions, keynotes, an expo,
    demos, tutorials, grand challenges and industry workshops.
  topics:
    - 3D multimedia, AR/VR and immersive media
    - Emerging multimedia applications and technologies
    - AI/machine learning-based multimedia
    - Image and video processing
    - Multimedia analysis and generation
    - Multimedia communications, networking and mobility
    - Multimedia databases and data mining
    - Multimedia quality assessment and metrics
    - Multimedia security, privacy and forensics
    - Multimedia standards, trends and related research
    - Multi-modal media computing, interaction, and human-machine interaction
    - Social media analysis and applications
    - Speech/audio processing
  features:
    - Flagship multimedia conference co-sponsored by four IEEE societies (CAS, ComSoc, CS, SPS)
    - >-
      ICME 2026 timeline: regular paper deadline 2025-12-31 (AoE), author rebuttal 2026-02-22 to 26, notification 2026-03-13 (a rebuttal
      stage exists)
    - Proceedings published by IEEE, included in IEEE Xplore and indexed in EI Compendex
    - >-
      Beyond regular and special-session papers, there are Grand Challenges, demo, workshop, industry technical workshop, tutorial and panel
      tracks
    - 'Rankings: CCF B, CORE (ICORE) A, QUALIS A1 (as tallied by myhuiban)'
    - >-
      Page limit and whether review is double-blind could not be confirmed on accessible official pages (the official site
      attend.ieee.org/icme-2026 was not accessible)
  acceptance_rate: null
  sources:
    - https://www.aischolar.com/conference/icme2026
    - https://gdr-iasis.cnrs.fr/?p=4682
    - https://www.myhuiban.com/conference/278?lang=en-us
auto-icmr:
  about: >-
    ACM ICMR (International Conference on Multimedia Retrieval) is the leading conference on multimedia retrieval, sponsored by ACM SIGMM
    and held annually since Trento in 2011, with the principle of not being held on the same continent in consecutive years. The 16th
    edition (2026) was held in hybrid form June 16-19 in Amsterdam (KIT); the 2027 edition is planned for Singapore (tentatively June 7-10)
    and 2028 for Dublin. Its core scope is the analysis, retrieval and recommendation of image, video, audio and multimodal content.
  topics:
    - Content-based and hybrid search, retrieval, and recommender systems (large-scale / web-scale)
    - Multimedia content extraction, analysis, indexing, semantic features
    - Multimedia analytics, knowledge discovery, browsing, summarization, visualization
    - Machine, deep, and transfer learning for retrieval; relevance feedback, active learning
    - Fine-grained retrieval, event-based indexing, query processing
    - Crowdsourcing, community-contributed and social multimedia
    - Synthetic media generation and detection; narrative generation and analysis
    - User intent and human perception in retrieval
    - Multimedia beyond video (3D, sensor data), mobile search, hardware acceleration (GPU, FPGA)
    - Benchmarks and evaluation methodologies
    - Privacy, fairness, explainability; legal, ethical, societal impact
    - Applications in news, media, medicine, sports, commerce, lifelogs, travel, security, environment
  features:
    - >-
      Long papers 8 pages plus 2 pages of references, short papers 4 pages plus 2 pages of references (ACM sigconf format; no appendices or
      supplementary material)
    - Double-blind review for regular papers; submitting authors are required to serve as reviewers if requested by the TPC
    - Proceedings published in the ACM International Conference Proceedings Series (fully open access at ACM from 2026, via APC or ACM Open)
    - The CFP explicitly lists medicine among application areas - medical image retrieval/analysis work can be submitted
    - Co-located events include the MediaEval workshop and the ACM SIGMM European Chapter Symposium
    - 'ICMR 2026 timeline: paper deadline 2026-02-13, notification 04-15, camera-ready 04-25'
  acceptance_rate: null
  sources:
    - https://icmr2026.org/
    - https://icmr2026.org/calls.html
    - https://sites.google.com/view/www-acmicmr-org
auto-acm-mm:
  about: >-
    ACM Multimedia (ACM MM), which began in Anaheim in 1993, is the flagship conference of ACM SIGMM and is regarded as the premier
    international conference for multimedia research, innovation and applications, held annually. It is very large, with 5,330 submissions
    in 2025; the 34th edition in 2026 was held November 10-14 in Rio de Janeiro, Brazil. Beyond technical sessions it includes tutorials,
    panels and an interactive art exhibition.
  topics:
    - Art and Culture
    - Data Systems Management and Indexing
    - Embodied and Immersive Multimedia
    - Emotional and Social Signals
    - Interactions and Quality of Experience
    - Multimedia Applications
    - Multimodal Fusion
    - Multimedia Generative and Foundation Models
    - Multimedia Interpretability and Explainability
    - Multimedia and Language
    - Multimedia Search and Recommendation
    - Multimedia Reasoning
    - New Forms of Media Content
    - Responsible Multimedia
    - Summarization, Analytics, and Storytelling
    - Transport and Delivery
  features:
    - >-
      6-8 pages of main text plus 2 pages reserved for references; exceeding this results in desk rejection; supplementary material up to
      50MB submitted separately
    - >-
      Double-blind review (OpenReview), optional anonymous rebuttal, Author's Advocate mediation system; submitting authors are required to
