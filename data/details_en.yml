pw-bios:
  about: >-
    The Biomedical Optics / Biophotonics Symposium (BiOS) held within SPIE Photonics West, organized by SPIE every year in late January to
    early February at the Moscone Center in San Francisco. Photonics West as a whole draws roughly 24,000 attendees, more than 100
    conferences and over 4,500 presentations (per the 2027 announcement); BiOS is the track covering biophotonics, biomedical optics and
    imaging and is described as 'the most comprehensive biophotonics conference in the field'. Photonics West 2027 runs January 30 to
    February 4, with the BiOS Expo on January 30-31.
  topics:
    - Neurophotonics, Neurosurgery, and Optogenetics
    - Clinical and Translational Neurophotonics
    - 'Photons Plus Ultrasound: Imaging and Sensing'
    - Multiphoton Microscopy in the Biomedical Sciences
    - Optical Coherence Tomography
    - Therapeutics and Diagnostics
    - Tissue Optics
    - Nanophotonics (biomedical)
    - New imaging modalities
  features:
    - >-
      Abstract-only submission - per the SPIE 2025 flyer, a 250-word abstract for technical review plus a 100-word summary for the program;
      the 2026 flyer changes this to a 200-300-word technical abstract plus a 50-150-word summary (based on search snippet; varies by
      conference)
    - >-
      After acceptance, a SPIE Proceedings manuscript is submitted separately - the manuscript is submitted after the presentation, and
      acceptance is decided by the conference chairs
    - >-
      One of the six technical areas of Photonics West; runs alongside the BiOS Expo (January 30-31) and the Photonics West exhibition
      (February 2-4, more than 1,400 exhibitors)
    - >-
      Neurophotonics-related conferences are run as two or more separate conferences - 'Neurophotonics, Neurosurgery, and Optogenetics' and
      'Clinical and Translational Neurophotonics' (confirmed to be held January 17-19, 2026)
    - Hot Topics and plenary sessions take place during the week (per press release)
    - >-
      The 2027 BiOS abstract deadline could not be confirmed on accessible pages (spie.org blocked) - another Photonics West conference,
      LA303, lists a deadline of 2026-07-22, so a mid-2026 deadline for BiOS is possible but unconfirmed
  acceptance_rate: null
  sources:
