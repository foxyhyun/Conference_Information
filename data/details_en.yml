ecbo:
  about: >-
    The European Conferences on Biomedical Optics (ECBO), co-sponsored by Optica and SPIE, is Europe's largest biomedical optics conference.
    It is held biennially (June of odd years) at the ICM in Munich as part of the World of Photonics Congress, alongside the LASER World of
    PHOTONICS trade fair. It brings together researchers, engineers and clinicians applying optics and photonics to medical and biomedical
    problems; the 2027 edition takes place June 20-24 in Munich. The World of Photonics Congress 2025 as a whole had 3,500 attendees and
    2,670 oral and poster presentations.
  topics:
    - 'ECBO 1: Translational Biophotonics: Diagnostics and Therapeutics'
    - 'ECBO 2: Diffuse Optical Spectroscopy and Imaging'
    - 'ECBO 3: Optical Systems for Mechanical and Biophysical Investigation (OMBI)'
    - 'ECBO 4: Advances in Microscopic Imaging'
    - 'ECBO 5: Optoacoustic Methods and Applications in Biophotonics'
    - 'ECBO 6: Optical Coherence Imaging Techniques and Imaging in Scattering Media'
  features:
    - >-
      Biennial - held concurrently with the World of Photonics Congress (2027: June 20-25) and the LASER World of PHOTONICS trade fair
      (2027: June 22-25)
    - '2027 abstract deadline: 2027-01-27, 23:55 US Eastern Time (UTC-5) (per the Optica submission page)'
    - >-
      Co-sponsored by Optica and SPIE - presented papers are published in both the SPIE Digital Library and Optica Publishing Group (per
      SPIE guidance snippet); Optica provides them as 'Technical Digest papers'
    - >-
      Organized as six sub-conferences (ECBO 1-6) (topic list as of 2025) - includes neurophotonics-related tracks such as diffuse optical
