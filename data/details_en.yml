    ICASSP (IEEE International Conference on Acoustics, Speech and Signal Processing) is the flagship conference of the IEEE Signal
    Processing Society, held annually since its start in Philadelphia in 1976. It is the largest conference in signal processing, with 4,403
    attendees in Seoul in 2024 and about 4,000 in Hyderabad in 2025, and 3,393 accepted papers in 2025; the 51st edition in 2026 will be
