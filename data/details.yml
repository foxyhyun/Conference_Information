kosaim:
  about: >-
    대한의료인공지능학회(KoSAIM)는 2018년 7월 서울아산병원에서 창립공청회·발기인대회를 거쳐 의료계와 공학계가 함께 설립한 의료 인공지능 학회로, 2019년 5월 첫 춘계학회에 전문가 600여 명이 참석했다. 현재는 매년 10월 서울 그랜드
    인터컨티넨탈 파르나스에서 정기학술대회를 개최하며(2025: 10/24~25, 2026: 10/23~24), KoSAIM 2026에는 전년 대비 약 1.5배인 700여 명이 참석했다. 영상의학 중심에서 병리·생체신호(ECG) 등으로 범위가
    넓어지고 있으며 루닛·딥노이드·뷰노 등 의료 AI 기업이 전시에 참여한다.
  topics:
    - 의료 파운데이션 모델 (2026 세션 주제)
    - 에이전틱 AI (2026 세션 주제)
    - 흉부 영상 AI (X-ray/CT, vision-language)
    - 뇌 MRI 분석
    - 디지털 병리 / 세포병리 (AI for Pathology 위성 워크샵)
    - 생체신호(ECG) 분석
    - 병원 AI 도입 사례 (서울아산병원·서울대병원·세브란스 발표)
    - 의료 AI 수가·규제·신뢰성
  features:
    - '초록 접수 부문: 포스터 전시/발표 vs 자유연제 구연발표 선택; 구연 접수분은 심사 후 포스터로 통보될 수 있음 (2025 안내)'
    - 학회 홈페이지 회원가입/로그인 후 행사 페이지 초록접수 메뉴로 온라인 제출; 초록집 게재용 Abstract Template 작성·업로드 필수, 발표자 밑줄 표기
    - 2026년 포스터/자유연제 초록 접수 9/15까지 연장; 2025년 마감 9/12 자정; 2024년 7/15~8/31 23시
    - '위성 세션 운영 (2026: AI for Pathology — 제1회 병리영상연구회 워크샵)'
    - 루닛학술상 등 시상 공고 운영 (2026 신청 마감 6/30)
    - 기업 전시 부스 (루닛, 딥노이드, 뷰노, 에이트릭스, 씨어스테크놀로지, 메디웨일 등)
    - 공식 사이트(kosaim.org)가 자동 fetch를 차단(HTTP 403)하여 세부 양식·분량·언어는 미확인
  typical_schedule: '매년 10월 넷째 주 금~토 2일간 서울 그랜드 인터컨티넨탈 파르나스(2025: 10/24~25, 2026: 10/23~24). 초록 마감 9월 중순(2025: 9/12, 2026: 9/15 연장). 2027 일정 미공개'
  acceptance_rate: null
  sources:
    - https://www.kosaim.org/html/?pmode=BBBS0007100001
    - https://www.kosaim.org/html/?pmode=BBBS0007100001&seq=1163&smode=view
    - https://kosaim.org/html/?pmode=BBBS0007100001&seq=1043&smode=view
    - https://newsway.co.kr/news/view?ud=2026102009380157840
    - https://medicaltimes.com/Users/News/NewsView.html?ID=1171474
    - https://www.medicaltimes.com/Main/view.html?ID=1126525
ksbns:
  about: >-
    사단법인 한국뇌신경과학회(KSBNS)는 1998년 12월 한국신경과학회와 한국신경생물학회가 통합하여 창립된 국내 뇌과학 대표 학회로(2018년 사단법인화), 1999년 6월 제1차 정기학술대회 이후 매년 1회 정기국제학술대회를 개최한다.
    최근에는 'K-Brain'으로 브랜드화되어 2026년 제29회 대회(K-Brain 2026, 9/6~8 대전컨벤션센터)에 20개국 2,500여 명이 참가하는 국내 최대 규모의 뇌과학 국제학술대회로 보도되었다. 신경교세포·시냅스·고등인지·중개의학
    등 10개 분과를 두고 있다.
  topics:
    - Molecular and Cellular Neuroscience
    - Synapses and Circuits Neuroscience
    - Systems and Cognitive Neuroscience
    - Mechanistic, Translational, and Clinical Neuroscience of Brain Disorders
    - Computational Neuroscience, Neuro-Tools and Neuroengineering
    - Others
  features:
    - 초록 전면 영어, 온라인 제출; 제목 250자·본문 2,200자·사사 400자(공백 포함), 그래픽 1개(JPG/PDF 10MB 이하), 1인 1편 제한, 카테고리 2개 지정
    - 발표 유형 Poster / Oral / Invited session 선택; Oral 선정은 Scientific Program Committee 심사로 결정, 미선정 시 포스터 발표 가능; 심사 결과는 채택·거절·수정요청
    - 제출·발표자는 등록비 납부 완료 필수; 공동저자도 개별 등록
    - >-
      수상: KSBNS Outstanding Poster Awards(학생·포닥 회원, 10만원), Scitech Korea Best Oral Presentation Awards(10편, 50만원), IBRO Travel
      Awards(IBRO-APRC 국가 14편, 50만원); 수상 신청 시 extended abstract·research highlights 제출, 폐회식 참석 필수
    - Late-breaking abstract 모집 운영 (2026)
    - 31개 심포지엄, 교육 세션, 유관 학회(대한비만학회·대한파킨슨병및이상운동질환학회·대한뇌자극학회 등) 공동 세션, 보수교육 평점 최대 15점
    - '기조강연 해외 석학 중심 (2026: Ole Kiehn, Masashi Yanagisawa, Jennifer Raymond, Jun Huh); Abstract Book 공개'
  typical_schedule: >-
    매년 9월 초 3일간 개최 (2026: 9/6~8 대전 DCC). 2026 초록 접수 3/16~8/31 23:59 KST, 얼리버드 등록 3/16~6/12. K-Brain 2027 심포지엄 공모 마감 2027-01-10 (2026-11-16
    공지); 2027 본대회 일정·초록 마감은 미공개
  acceptance_rate: null
  sources:
    - https://www.ksbns.org/
    - https://www.ksbns.org/info/history.asp
    - https://ksbns2026.org/
    - https://ksbns2026.org/abstract/
    - https://www.newswire.co.kr/newsRead.php?no=1036298
auto-icpr:
  about: >-
    ICPR(International Conference on Pattern Recognition)은 국제패턴인식학회(IAPR)의 플래그십 학회로, 2024년 콜카타(27회)에 이어 2026년 8월 17-22일 프랑스 리옹에서 28회가 열렸다.
    2024년에 50주년을 맞은 역사 있는 학회이며, 패턴인식·머신러닝·컴퓨터비전·영상/신호처리·생체인식·문서분석·바이오메디컬 이미징 등 6개 트랙으로 구성된다.
  topics:
    - Artificial Intelligence, Pattern Recognition and Machine Learning
    - Computer and Robot Vision
    - Image, Speech, Signal and Video Processing
    - Biometrics and Human Computer Interaction
    - Document Analysis and Recognition
    - Biomedical Imaging and Bioinformatics
  features:
    - 6개 트랙 체제이며 'Biomedical Imaging and Bioinformatics' 트랙이 별도로 있어 의료영상 연구 투고 가능
    - 리뷰는 single-blind (저자명·소속을 원고에 기재해야 함; ICPR 2024·2026 공식 안내 모두 동일)
    - ICPR 2024 기준 Springer LNCS 포맷, 참고문헌 포함 최대 15페이지 (ICPR 2026 페이지 제한은 공식 페이지에서 확인 못함)
    - 보충자료는 선택이며 단일 파일 50MB 이내, 리뷰어 참고용으로만 사용 (ICPR 2026 Instructions)
    - '프로시딩은 Springer 출간 (ICPR 2024: Springer LNCS; ICPR 2026 Proceedings 페이지는 Springer DOI 링크, 본 학회 16권 + 워크숍 5권)'
    - 재현성 연구 배지(Reproducible Research in Pattern Recognition, RRPR Badge) 제도 운영
    - ICPR 2024(콜카타)는 2,106편 투고 중 963편 채택 (Springer LNCS 프로시딩 설명문 기준, 검색 스니펫으로 확인)
  acceptance_rate: '2024: 963 accepted / 2,106 submissions (약 45.7%, Springer LNCS 프로시딩 설명문; 검색 결과 스니펫 기반, 직접 페이지 열람은 못함)'
  sources:
    - https://icpr2026.org/
    - https://icpr2026.org/calls.html
    - https://icpr2026.org/instructions.html
    - https://icpr2026.org/proceedings.html
    - https://iapr.org/archives/icpr2024/cfp.html
auto-icme:
  about: >-
    IEEE ICME(International Conference on Multimedia and Expo)는 IEEE 4개 소사이어티(Circuits and Systems, Communications, Computer, Signal
    Processing)가 공동 후원하는 멀티미디어 분야 플래그십 학회로 2000년부터 매년 개최된다. 2026년은 7월 5-9일 태국 방콕(QSNCC)에서, 2027년은 7월 중국 샤먼에서 열릴 예정이며 구두·포스터 세션, 키노트, 전시, 데모,
    튜토리얼, 그랜드 챌린지, 산업 워크숍을 포함한다.
  topics:
    - 3D multimedia, AR/VR and immersive media
    - Emerging multimedia applications and technologies
    - AI/machine learning-based multimedia
    - Image and video processing
    - Multimedia analysis and generation
    - Multimedia communications, networking and mobility
    - Multimedia databases and data mining
    - Multimedia quality assessment and metrics
    - Multimedia security, privacy and forensics
    - Multimedia standards, trends and related research
    - Multi-modal media computing, interaction, and human-machine interaction
    - Social media analysis and applications
    - Speech/audio processing
  features:
    - IEEE CAS·ComSoc·CS·SPS 4개 소사이어티 공동 후원 플래그십 멀티미디어 학회
    - 'ICME 2026 일정: 정규논문 마감 2025-12-31(AoE), 저자 리버털 2026-02-22~26, 통보 2026-03-13 (리버털 단계 존재)'
    - 프로시딩은 IEEE 출판, IEEE Xplore 수록, EI Compendex 색인
    - 정규/특별세션 논문 외 Grand Challenges, 데모, 워크숍, 산업 기술 워크숍, 튜토리얼, 패널 트랙 운영
    - '랭킹: CCF B, CORE(ICORE) A, QUALIS A1 (myhuiban 집계)'
    - 페이지 제한·더블블라인드 여부는 열람 가능한 공식 페이지에서 확인 못함 (공식 사이트 attend.ieee.org/icme-2026 접근 불가)
  acceptance_rate: null
  sources:
    - https://www.aischolar.com/conference/icme2026
    - https://gdr-iasis.cnrs.fr/?p=4682
    - https://www.myhuiban.com/conference/278?lang=en-us
auto-icmr:
  about: >-
    ACM ICMR(International Conference on Multimedia Retrieval)은 ACM SIGMM이 후원하는 멀티미디어 검색 분야의 대표 학회로, 2011년 트렌토 이후 매년 개최되며 같은 대륙에서 연속 개최하지 않는
    것을 원칙으로 한다. 16회(2026)는 6월 16-19일 암스테르담(KIT)에서 하이브리드로 열렸고, 2027년은 싱가포르(6월 7-10일 잠정), 2028년은 더블린 예정이다. 영상·비디오·오디오·멀티모달 콘텐츠의 분석·검색·추천이 핵심
    범위이다.
  topics:
    - Content-based and hybrid search, retrieval, and recommender systems (large-scale / web-scale)
    - Multimedia content extraction, analysis, indexing, semantic features
    - Multimedia analytics, knowledge discovery, browsing, summarization, visualization
    - Machine, deep, and transfer learning for retrieval; relevance feedback, active learning
    - Fine-grained retrieval, event-based indexing, query processing
    - Crowdsourcing, community-contributed and social multimedia
    - Synthetic media generation and detection; narrative generation and analysis
    - User intent and human perception in retrieval
    - Multimedia beyond video (3D, sensor data), mobile search, hardware acceleration (GPU, FPGA)
    - Benchmarks and evaluation methodologies
    - Privacy, fairness, explainability; legal, ethical, societal impact
    - Applications in news, media, medicine, sports, commerce, lifelogs, travel, security, environment
  features:
    - Long paper 8페이지 + 참고문헌 2페이지, Short paper 4페이지 + 참고문헌 2페이지 (ACM sigconf 양식, 부록·보충자료 불허)
    - 정규논문 더블블라인드 리뷰; 투고 저자는 TPC 요청 시 리뷰어로 참여 의무
    - 프로시딩은 ACM International Conference Proceedings Series로 출판 (2026년부터 ACM 완전 오픈액세스, APC 또는 ACM Open 적용)
    - CFP 응용 분야에 medicine(의료) 명시 - 의료영상 검색/분석 연구 투고 가능
    - MediaEval 워크숍, ACM SIGMM European Chapter Symposium 등 병행 개최
    - 'ICMR 2026 일정: 논문 마감 2026-02-13, 통보 04-15, 카메라레디 04-25'
  acceptance_rate: null
  sources:
    - https://icmr2026.org/
    - https://icmr2026.org/calls.html
    - https://sites.google.com/view/www-acmicmr-org
auto-acm-mm:
  about: >-
    ACM Multimedia(ACM MM)는 1993년 애너하임에서 시작된 ACM SIGMM의 플래그십 학회로 멀티미디어 연구·혁신·응용 분야 최고 권위 국제학회로 꼽히며 매년 개최된다. 2025년 5,330편 투고로 규모가 매우 크고,
    2026년 34회는 11월 10-14일 브라질 리우데자네이루에서 열렸다. 기술 세션 외 튜토리얼·패널·인터랙티브 아트 전시를 포함한다.
  topics:
    - Art and Culture
    - Data Systems Management and Indexing
    - Embodied and Immersive Multimedia
    - Emotional and Social Signals
    - Interactions and Quality of Experience
    - Multimedia Applications
    - Multimodal Fusion
    - Multimedia Generative and Foundation Models
    - Multimedia Interpretability and Explainability
    - Multimedia and Language
    - Multimedia Search and Recommendation
    - Multimedia Reasoning
    - New Forms of Media Content
    - Responsible Multimedia
    - Summarization, Analytics, and Storytelling
    - Transport and Delivery
  features:
    - 본문 6-8페이지 + 참고문헌 전용 2페이지, 초과 시 데스크리젝; 보충자료 50MB 별도 제출
    - 더블블라인드 리뷰 (OpenReview), 선택적 익명 리버털, Author's Advocate 중재 제도; 투고 저자는 리뷰 의무(최대 4편)
    - 멀티미디어/멀티모달 기여가 아닌 논문은 데스크리젝 가능; 저자당 3개 트랙 합산 최대 10편
    - Main Technical Track 외 Brave New Ideas(BNI) 트랙과 Datasets 트랙 운영; BNI 논문은 본 프로시딩에 수록되며 신규성·영향력 중심 평가
    - '채택률 추이: 2020 27.9%, 2022 27.95%, 2023 29.36%, 2024 26.2%, 2025 23.45% (acmmm.org 연구트랙 통계)'
    - '랭킹: CCF A, CORE(ICORE) A* (myhuiban 집계); 2006 CORE A+, 2012 브라질 Qualis A1 (Wikipedia)'
  acceptance_rate: '2025: 1,250 / 5,330 = 23.45% (acmmm.org research track statistics)'
  sources:
    - https://2026.acmmm.org/site/cfp-guidelines.html
    - https://2026.acmmm.org/site/call-bni.html
    - https://acmmm.org/
    - https://en.wikipedia.org/wiki/ACM_Multimedia
    - https://www.myhuiban.com/conference/53?lang=en-us
auto-mmm:
  about: >-
    MMM(International Conference on Multimedia Modeling)은 매년 1월경 개최되는 중규모 국제 멀티미디어 학회로, 2026년 32회는 프라하, 2027년 33회는 1월 5-8일 캄보디아 시엠레아프에서 열린다.
    정규/특별세션 논문, 데모, Brave New Ideas 세션, 키노트와 함께 대화형 비디오 검색 대회인 Video Browser Showdown(VBS)이 함께 열리는 것이 특징이다.
  topics:
    - 'Multimedia content analysis: indexing, retrieval, summarisation, annotation, fusion, verification, content generation'
    - 'Signal processing and communications: media representation, coding, streaming, security/privacy, sensor networks, multi-camera systems'
    - >-
      Applications and services: browsing/retrieval tools, AR/VR, mobile, analytics, personalisation, multimodal conversation and
      recommendation
    - 'Domain applications: cultural, educational, social media, e-health and medical uses'
    - 'Ethical, legal and societal aspects: fairness, environmental impact, reproducibility, responsible modeling'
    - 'Emerging topics: large multimedia models and LLMs, multimodal pre-training, embodied multimodal systems'
    - 'Special session (2027): Multimodal Computer Vision in Medicine'
    - 'Special session (2027): Embodied Multimedia Modeling'
    - 'Special session (2027): Video Understanding with Multimodal LLMs'
    - 'Special session (2027): Multimodal Agentic Systems and Applications'
    - 'Special session (2027): Trustworthy Multimedia Modeling'
  features:
    - Full paper 본문 12페이지(그림·표·부록 포함) + 참고문헌 2페이지, Springer LNCS 양식
    - 정규/특별세션 논문 더블블라인드 리뷰 (ConfTool 제출)
    - 프로시딩 Springer LNCS 출간 (Open Access/Open Choice 선택 가능)
    - 2027 특별세션에 'Multimodal Computer Vision in Medicine' 포함, CFP에 e-health/medical 응용 명시 - 의료영상 관련 투고에 적합
    - Video Browser Showdown(VBS), 데모 트랙, Best Paper(USD 1,500)/Best Student Paper(USD 1,000) 시상, 여행 지원금 운영
    - 'MMM 2027 일정: 정규논문 마감 2026-08-30(연장), 통보 10-19, 카메라레디 11-01'
    - '랭킹: CCF C, CORE(ICORE) B, QUALIS B1 (myhuiban 집계)'
  acceptance_rate: null
  sources:
    - https://mmm2027.net/
    - https://mmm2027.net/call_for_papers.html
    - https://www.myhuiban.com/conference/620?lang=en-us
auto-euvip:
  about: >-
    EUVIP(European Conference on Visual Information Processing, 구 European Workshop on Visual Information Processing)는 시각정보처리 분야의 학계·산업계가
    모이는 유럽 학회로, 14회(2026)는 9월 28일-10월 1일 룩셈부르크에서 열렸다. EURASIP과 IEEE Signal Processing Society 등이 커뮤니티 후원자로 참여하며 키노트·튜토리얼·구두/포스터·특별세션·데모·학생
    세션으로 구성된다.
  topics:
    - 'Modalities: conventional image/video, stereoscopic, multi-view, 360°, light fields, point clouds, meshes, holography'
    - Medical imaging
    - Multimodal perception (vision, language, audio, depth); multi-/hyper-spectral, thermal, event-based sensing
    - 'Performance assessment: subjective/objective quality, QoE, benchmarking, robustness, bias, explainability'
    - 'Applications: biometrics, forensics, trust and security; face, body, pose, gesture'
    - 'Applications: AR/VR, gaming, broadcasting; medical, education, cultural, industrial uses'
    - 'Applications: drones, autonomous vehicles, autonomous navigation and perception in space systems'
    - Sensing, representation, modelling, registration; computational vision modelling
    - Vision-language modelling; multimodal learning and cross-modal fusion
    - 3D vision from sensors; visual anomaly detection
    - Restoration, denoising, enhancement; detection, recognition, retrieval, classification
    - Coding and transmission; efficient, scalable, distributed vision; synthesis, rendering, visualization
  features:
    - 본문 최대 6페이지(그림·참고문헌 포함, 6페이지는 참고문헌만) - 짧은 분량의 학회
    - 더블블라인드 리뷰, Microsoft CMT 제출
    - 정규논문은 프로시딩 수록 및 IEEE Xplore 게재 예정
    - CFP 주제에 'medical imaging'과 medical 응용이 명시되어 의료영상 연구 투고에 적합
    - 튜토리얼, 데모/산업 전시, 프로젝트 성과 발표 세션, 박사과정 대상 학생 세션(2페이지 형식) 운영; 박사과정 여행 지원금(€500, 10명)
    - EURASIP, IEEE SPS, IEEE Benelux가 커뮤니티/학회 후원자로 참여 (2026 공식 사이트)
    - 'EUVIP 2026 일정: 논문 마감 2026-06-15(연장), 결과 발표 07-23'
  acceptance_rate: null
  sources:
    - https://euvip2026.github.io/
    - https://euvip2026.github.io/calls/
    - https://euvip2026.github.io/C4P.pdf
    - https://euvip2026.github.io/information/paper-submission/
    - https://signalprocessingsociety.org/tags/euvip-2026
auto-sibgrapi:
  about: >-
    SIBGRAPI(Conference on Graphics, Patterns and Images)는 브라질컴퓨터학회(SBC)의 컴퓨터그래픽스·패턴인식·영상처리 분과(CEGRAPI)가 주관하는 라틴아메리카의 연례 학회로 1988년 시작되었다.
    컴퓨터그래픽스·비전·패턴인식·영상처리를 다루며 메인 트랙 외 워크숍과 단기 코스로 구성되고, SBGames·SVR 등과 공동 개최된다. 2026년 39회는 브라질 고이아니아(Goiânia)에서 열렸다.
  topics:
    - Computer graphics
    - Computer vision
    - Pattern recognition
    - Image processing
    - Remote sensing / Earth observation image analysis (GRSL special stream)
    - Image enhancement and restoration (GRSL stream)
    - Low-level feature extraction (GRSL stream)
  features:
    - 메인 트랙 논문은 영어, IEEE 양식 최대 6페이지 (2024·2025 기준)
    - 더블블라인드 리뷰, 논문당 최소 3명 전문가 리뷰; 조건부 채택 시 2차 짧은 리뷰 사이클(리버털/수정) 운영
    - 프로시딩 IEEE Xplore 게재, SIBGRAPI Digital Library Archive(INPE) 및 SBC Open Lib(SOL) 색인
    - '저널 연계 트랙: Computers & Graphics(C&G) 트랙, IEEE GRSL(Geoscience and Remote Sensing Letters) 트랙, JBCS 특별호'
    - '부가 트랙: WIP(Work in Progress), WTD(학위논문 워크숍), WUW, WIA(산업 워크숍), 주제별 워크숍, 튜토리얼'
    - arXiv 프리프린트 허용; 현장 구두 발표 필수(원격 발표 불가, 미발표 시 프로시딩 제외)
    - '메인 트랙 마감은 통상 6월 중하순 (2024: 06-30 연장마감, 2025: 06-23/06-30)'
  acceptance_rate: null
  sources:
    - https://sibgrapi.sbc.org.br/2025/?p=4432
    - https://sibgrapi.sbc.org.br/2025/?p=4741
    - https://sibgrapi.sbc.org.br/2024/?p=1203
    - >-
      https://www.grss-ieee.org/publications/author-resources/grsl-special-streams/grss-special-stream-of-the-pattern-recognition-and-image-analysis-for-geoscience-and-remote-sensing-at-sibgrapi-2026/
isc:
  about: 미국심장협회(AHA)/미국뇌졸중협회(ASA)가 매년 개최하는 세계 최대 규모의 뇌졸중·뇌건강 학회. 기초연구부터 대규모 임상시험까지 22개 카테고리를 다룬다. 2027년은 휴스턴에서 열린다.
  topics:
    - Acute Ischemic Stroke Management
    - Arteriosclerosis, Thrombosis, and Vascular Biology
    - Brain Health and Cognitive Impairment
    - Epidemiology, Risk Factors, and Prevention
    - Hemorrhagic Stroke Treatment
    - Imaging in Stroke
    - Molecular and Cellular Brain Science
    - Neurocritical Care and Complex Brain Physiology
    - Neuroimmunology and Inflammation in Stroke
    - Neurointervention
    - Omics, Big Data, Precision Medicine, Bioengineering, and Artificial Intelligence
    - Regenerative Medicine and Novel Therapeutic Strategies
    - Rehabilitation and Recovery
    - Translational Research, Therapeutic Development, and Biomarkers
    - Vascular Malformations, Aneurysms, Moyamoya, and Other Vascular Conditions
  features:
    - '초록 제출비: AHA 회원 $45, 비회원 $95; 1차 카테고리 필수, 2차 선택'
    - 선택한 카테고리별 심사팀이 초록을 채점
    - 채택 초록은 Stroke 저널 웹사이트에 온라인 게재 (LB·OGCT 초록 제외)
    - 상위 30개 초록은 Stroke 저널에 원고 투고 초청(신속 심사)
    - 'Late-Breaking Science / Ongoing Clinical Trials 별도 트랙: 2,500자, 그래픽 최대 3개'
    - 학생·트레이니·초기경력 연구자 대상 ISC 초록 기반 상 및 트래블 지원
  acceptance_rate: null
  sources:
    - https://professional.heart.org/en/meetings/international-stroke-conference/submit-science
esoc:
  about: 유럽뇌졸중학회(ESO)가 주최하는 제13회 연례 학술대회로, 2027년은 ESO 창립 20주년을 기념해 비엔나에서 현장 개최된다. 공식 수치로 참가자 4,200명 이상, 100개국 이상, 초록 2,000편 이상 규모다.
  topics:
    - Regular abstracts (all aspects of stroke science and care)
    - YSPR (Young Stroke Physicians and Researchers)
    - Ongoing Trials (poster only)
    - Late Breaking Science
  features:
    - 초록 제출·등록 2026-11-02 오픈, 정규 마감 2027-01-19 17:00 CET
    - 'YSPR: 35세 이하 또는 수련 중 연구자, 상위 2편은 2027 ESO Summer/Winter School 참가'
    - 채택 초록은 동료심사 저널에 게재 (엠바고 해제 2027-05-19)
    - '발표 형식: 구연, 종이 포스터, e-포스터'
    - 저·중저소득국 발표자 트래블 그랜트, 35세 이하 Young Investigator Award
    - 채택 통보 2027년 2월 말, LBA 통보 3월 말
  acceptance_rate: null
  sources:
    - https://eso-stroke.org/esoc2027/
    - https://eso-stroke.org/esoc2027/abstracts/
    - https://eso-stroke.org/wp-content/uploads/ESOC2027-Flyer.pdf
wsc:
  about: >-
    세계뇌졸중기구(WSO)가 매년 개최하는 국제 뇌졸중 학회로 2,500명 이상이 참가한다. 개최지는 아시아/오세아니아·미주·유럽·아프리카/중동 순으로 순환한다. 2026년(18회)은 서울 COEX에서 10월 21-23일 열렸고, 2027년 일정은
    아직 공식 발표 전이다.
  topics:
    - Artificial Intelligence
    - Basic Science
    - Biomarkers
    - Cognition and Dementia
    - Epidemiology
    - Intracranial Hemorrhage
    - Large Artery Disease
    - Neurocritical Care
    - Neuroimaging
    - Prevention
    - Rehabilitation and Life After Stroke
    - Small Vessel Disease
    - Thrombectomy
    - Thrombolysis
  features:
    - 초록 본문 250단어(감사 포함), 이미지 JPG 500KB·600x800px 이하
    - 2026년부터 진행 중 임상시험도 결과가 학회 전 나오면 제출 가능
    - '발표: Plenary, Large International Registry, Sub-Plenary, e-포스터'
    - 조기등록 마감까지 등록한 발표자 초록은 International Journal of Stroke 게재
    - 'Late-Breaking 트랙 별도 운영 (2026: 5월 25일 23:59 CEST 마감)'
    - Young Investigator Award 운영
  acceptance_rate: null
  sources:
