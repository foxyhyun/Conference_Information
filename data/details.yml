    - 구연 또는 포스터, 현장·온라인 발표 가능
    - 'Developing Topics(3/30-4/9): 포스터 전용, late-breaking이면 구연 가능'
    - 앙코르 초록은 Alzheimer's & Dementia에 게재되지 않음
    - Conference Fellowship 및 시상(추천 1/5-2/5), Beyond the Data 아트 공모
