    - https://www.world-stroke.org/news-and-blog/news/be-part-of-the-wsc-2026-program-submit-your-abstracts/
brain-pet:
  about: >-
    국제뇌혈류대사학회(ISCBFM)가 주최하는 제33회 BRAIN 심포지엄과 제18회 BRAIN PET 학회의 합동 회의. 기초·중개·임상 신경과학자가 뇌 혈류·대사·기능을 논의하며 약 1,000명 참가가 예상된다. 2027년 주제는 AI가
    뇌졸중·치매·뇌손상 연구에 미치는 영향이다.
  topics:
    - BRAIN (cerebral blood flow, metabolism and function)
    - BRAIN PET (quantification of brain function with PET)
  features:
    - '심포지엄 제안: 리드 오거나이저는 ISCBFM 정회원, 최대 5명·90분, 300단어 요약'
    - '제안서 평가 기준: 과학적 우수성, 주제 적합성, 참여 다양성, 프로그램 균형'
    - '제출 사이트: brain2027.sciconf.cn'
    - ISCBFM Lab Travel Bursary 링크 제공
