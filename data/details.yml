adpd:
  about: Kenes Group이 운영하는 알츠하이머·파킨슨병 및 관련 신경질환 국제 학회로 매년 3월 하이브리드로 열린다. 기전·임상시험·진단·신약개발·신치료·예방을 다룬다.
  topics:
    - Mechanisms
    - Clinical Trials
    - Diagnostics (fluid markers, neuroimaging)
    - Drug Discovery
    - New Therapies
    - Prevention
  features:
    - 초록 280단어(Objectives/Methods/Results/Conclusions), 제목 20단어, 그래프 JPG
