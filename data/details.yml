i2k:
  about: >-
    현미경 데이터 중심의 계산 영상 분석 개발자·연구자·학생을 위한 학회로, 오픈소스 도구 튜토리얼 중심. 최근 회차: 2024년 Milan(Human Technopole, 10/23-25), 2026년 BINA와 공동 개최한 I2KxBINA
    2026(Madison, WI, 9/27-10/2, 하이브리드). 다음 회차(2027/2028)는 아직 공지 없음.
  topics:
    - Computational and multiscale imaging
    - Image analysis with QuPath, Fiji, napari, CellProfiler
    - Deep learning segmentation and restoration (Cellpose, StarDist, SAM, CAREamics)
    - Metadata and data formats (N5, OME-Zarr)
    - Image publication practices
    - Colocalization, FLIM/phasor analysis
    - Microscope control, AI-driven acquisition
    - LLM tools for image analysis
    - Volume EM, expansion microscopy
    - Intravital microscopy
    - Cell tracking benchmarks
  features:
    - 학술 발표, 인터랙티브 튜토리얼, 벤더 핸즈온 워크숍, 포스터로 구성
    - 발표·포스터·워크숍 제안은 Airtable 폼으로 제출
    - 2026 포스터 제출 마감 8/10, 초록 형식 규정은 공개 페이지에 없음
    - 하이브리드 운영, 녹화 발표는 YouTube 공개
    - 트래블 어워드 및 BINA 시상(오픈소스 이미징상 등)
  acceptance_rate: null
  sources:
    - https://www.i2kconference.org/
    - https://www.bioimagingnorthamerica.org/events/i2kxbina2026/
    - https://events.humantechnopole.it/event/1/
cosyne:
  about: >-
    2004년 창립된 계산·시스템 신경과학 학회로 실험·이론 연구자가 모여 행동·인지의 신경 기반을 다룸. 매년 1,000명 이상 참가. 2027년은 Montréal에서 본회의 3/11-14, 워크숍 3/15-16. 2027 초록 접수는 이미
    마감, 결과 통보 2026년 12월.
  topics:
    - Systems neuroscience
    - Computational neuroscience
    - Theory and modeling of neural systems
    - Neural basis of behavior
    - Neural basis of cognition
    - Computational biology
  features:
    - '초록: 2쪽 PDF(A4/Letter), 제목 100자 이내, 300단어 텍스트 요약(채택 시 이 부분만 공개)'
    - '2020년부터 double-blind 심사: 중요성·독창성·명확성·Cosyne 청중 관련성'
    - '결과: talk / poster / reject로 통보'
    - 뇌와 연결 없는 순수 ML, 신경계 함의 없는 단일 뉴런 연구는 보통 불채택
    - 트래블 그랜트 운영, 본회의 후 2일 워크숍
  acceptance_rate: null
  sources:
    - https://www.cosyne.org
    - https://www.cosyne.org/abstracts
