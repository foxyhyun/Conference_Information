    - https://www.optica.org/events/congress/biophotonics_congress/submit_papers/
    - https://www.optica.org/events/congress/biophotonics_congress/program/topic_categories/
ecbo:
  about: >-
    European Conferences on Biomedical Optics(ECBO)는 Optica와 SPIE가 공동 후원하는 유럽 최대 생의학광학 학회로, 2년마다(홀수 해 6월) 뮌헨 ICM에서 열리는 World of Photonics
    Congress의 일부로 개최되며 LASER World of PHOTONICS 전시회와 병행된다. 광학·포토닉스를 의료 및 생의학 문제에 적용하는 연구자·엔지니어·임상의가 모이며, 2027년은 6월 20~24일 뮌헨에서 열린다. World of
    Photonics Congress 2025 전체는 참가자 3,500명, 구두·포스터 발표 2,670편 규모였다.
  topics:
    - 'ECBO 1: Translational Biophotonics: Diagnostics and Therapeutics'
    - 'ECBO 2: Diffuse Optical Spectroscopy and Imaging'
    - 'ECBO 3: Optical Systems for Mechanical and Biophysical Investigation (OMBI)'
    - 'ECBO 4: Advances in Microscopic Imaging'
    - 'ECBO 5: Optoacoustic Methods and Applications in Biophotonics'
    - 'ECBO 6: Optical Coherence Imaging Techniques and Imaging in Scattering Media'
  features:
    - '2년 주기(biennial) - World of Photonics Congress(2027: 6/20~25)와 LASER World of PHOTONICS 전시회(2027: 6/22~25)와 동시 개최'
    - '2027 초록 마감: 2027-01-27 23:55 미동부시간(UTC-5) (Optica 제출 페이지 기준)'
    - >-
      Optica와 SPIE 공동 후원 - 발표 논문은 SPIE Digital Library와 Optica Publishing Group 양쪽에 게재(SPIE 안내 스니펫 기준), Optica 측에서는 'Technical Digest
      papers'로 제공
    - 6개 서브컨퍼런스(ECBO 1~6) 체제(2025년 기준 토픽 목록) - 확산광 분광/이미징(ECBO 2), 광음향(ECBO 5) 등 신경광학 관련 트랙 포함
    - 같은 Congress 안에 CLEO/Europe-EQEC, Optical Metrology, Digital Optical Technologies, LiM 등이 함께 열려 교차 참석 가능
