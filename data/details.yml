kcc:
  about: >-
    KCC(한국컴퓨터종합학술대회)는 한국정보과학회(KIISE)가 주최하는 컴퓨터과학·정보기술 전 분야의 종합학술대회로, 매년 6월 말 3일간 개최된다(KSC와 함께 연 2회 종합학술대회 중 하나). 2026년은 '초지능 AI 시대를 향한 컴퓨팅의
    새로운 도전'을 주제로 제주 ICC에서 열렸으며, 일반논문·학부생논문·주니어논문 구분으로 구두 25개 세션과 포스터 10개 세션이 운영되었다. 정보통신기획평가원, 삼성SDS, SK하이닉스 등 약 35개 기관·기업이 후원했다.
  topics:
    - 인공지능 (일반·응용)
    - 컴퓨터 시스템·차세대 아키텍처
    - 시스템 소프트웨어
    - 데이터 보안 및 윤리
    - 온디바이스 AI 최적화 (2026 경진대회 주제)
    - 설명가능 인공지능(XAI) 등 분과·연구회 주관 워크숍 분야
    - (KIISE 종합학술대회 공통 모집분야는 KSC 2025 안내 기준 고성능컴퓨팅·데이터베이스·소프트웨어공학·알고리즘·언어공학 등 23개 분야 — KCC 2026 자체 목록은 미확인)
  features:
    - '논문 구분: 일반논문 / 학부생논문 / 주니어논문(제1저자 고등학생); 학부생·주니어 논문은 포스터 세션에서 별도 평가위원이 심사'
    - '발표 평가: 좌장·평가위원이 ''내용전달의 우수성 50점 + 연구결과의 우수성 50점''으로 100점 만점 평가'
    - 채택 논문 상위 약 10%를 우수논문, 발표 상위 약 10%를 우수발표논문으로 선정해 학회 논문지 게재 추천 (학부생/주니어 논문은 제외)
    - 구두 발표 15분(질의응답 포함, USB 지참·개인 노트북 사용 불가), 포스터 보드 1×2m(A4 9장 또는 전지), 포스터 발표 5~7분
    - 미발표 시 게재 취소·지도교수 통보·연구실적 불인정
    - 기조강연, 초청강연, 특별세션, Top Conference 세션, 튜토리얼, 워크숍, 신진연구자 네트워킹 세션, 경진대회(온디바이스 AI 최적화 등), 홍보부스 운영
    - 일반논문 및 학부생/주니어논문 양식(한글/MS Word)을 자료실에서 배포
  typical_schedule: '매년 6월 말 3일간 개최 (2026: 6/24~26 제주 ICC). 2026 논문 양식 공개 3/18; 논문 마감일은 공식 페이지에서 확인 불가(공지 게시판이 JS 렌더링). 2027년 일정 미공개'
  acceptance_rate: null
  sources:
