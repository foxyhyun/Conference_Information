# 학회 상세 설명 (사이트의 "학회 상세" 패널). 직접 수정해도 됩니다.
#   about: 소개 / topics: 제출 분야 / features: 특징 / acceptance_rate / typical_schedule / sources

cvpr:
  about: >-
    IEEE Computer Society와 Computer Vision Foundation(CVF)이 공동 후원하는 컴퓨터 비전 분야 최대 규모의 연례 학회로, 1985년부터 매년 개최된다. 2026년 Denver 대회에는 16,092편이
    투고되어 4,071편이 채택되었고 등록자는 12,322명에 달하는 등, 컴퓨터 비전·패턴 인식 커뮤니티의 대표 학회로 꼽힌다. Wikipedia에 따르면 전체 논문의 30% 미만, 구두 발표는 5% 미만만 채택하는 선별적 학회다.
  topics:
    - 3D from multi-view and sensors / 3D from single images
    - Computational imaging
    - Medical and biological vision, cell microscopy
    - Low-level vision
    - Image and video synthesis and generation
    - 'Recognition: categorization, detection, retrieval'
    - Segmentation, grouping and shape analysis
    - Self-, semi-, meta- and unsupervised learning
    - Transfer / low-shot / continual / long-tail learning
    - Vision, language, and reasoning
    - Multimodal learning
    - Datasets and evaluation
    - Efficient and scalable vision
    - Physics-based vision and shape-from-X
    - 'Video: action and event understanding / low-level analysis, motion, tracking'
  features:
    - 본문 8페이지 제한(그림·표 포함, 참고문헌 제외), CVPR 스타일 템플릿 필수. 초과 시 리뷰 없이 거절.
    - OpenReview 기반 이중 맹검(double-blind) 심사. 모든 공저자가 최신 OpenReview 프로필을 보유해야 하며, 기관 이메일 없는 프로필은 승인에 최대 2주 소요.
    - '리뷰 공개 후 1페이지 PDF 리버틀(rebuttal) 기간(2026 대회: 1월 22~29일). 리버틀에 새 기여·외부 링크 추가 불가.'
    - 모든 저자는 초청 시 리뷰어·AC·SAC로 참여할 것을 약속해야 하며(reviewer-service commitment), 예외는 사전에 프로그램 체어 승인 필요. 2027 CFP에도 동일 조항 유지.
    - '채택 논문은 학회 2주 전 CVF 오픈액세스로 공개. 2027년 CFP에는 ''Agentic AI'', ''Physical AI: World Models, VLA, Planning, Simulation'' 등 신규 토픽이 추가됨.'
    - 이중 투고 금지(20% 이상 내용 중복 시 거절), arXiv 프리프린트는 출판물로 간주하지 않음. 존재하지 않는 문헌 인용 등 LLM 관련 오류는 거절 사유('an LLM did it'은 방어가 아님).
    - '초록 제출과 논문 제출 마감이 분리되어 있고 연장 없음(2026: 초록 11/7, 논문 11/13; 2027: 등록 11/10, 논문 11/16).'
  acceptance_rate: '2026: 25.3% (4071/16092); 2025: 22.1% (2872/13008) — Wikipedia (CVPR article) 표 기준'
  sources:
    - https://cvpr.thecvf.com/Conferences/2026/CallForPapers
    - https://cvpr.thecvf.com/Conferences/2026/AuthorGuidelines
    - https://cvpr.thecvf.com/Conferences/2027/CallForPapers
    - https://en.wikipedia.org/wiki/Conference_on_Computer_Vision_and_Pattern_Recognition
    - https://github.com/lixin4ever/Conference-Acceptance-Rate
iccv:
  about: >-
    IEEE가 후원하는 컴퓨터 비전 학회로 1987년에 시작되어 ECCV가 열리지 않는 홀수 해에 2년마다 개최된다. CVPR·ECCV와 함께 컴퓨터 비전 3대 학회 중 하나로 꼽히며, 최우수 논문상은 신경과학자 David Marr의 이름을 딴
    Marr Prize다. 2025년 대회(하와이)에는 약 1만 1천 편이 투고되어 약 2,700편이 채택되었다.
  topics:
    - 3D from multi-view and sensors / single images
    - Computational imaging
    - Medical and biological vision, cell microscopy
    - Low-level vision
    - Image and video synthesis and generation
    - 'Recognition: categorization, detection, retrieval'
    - Segmentation, grouping and shape analysis
    - Self-, semi-, meta- and unsupervised learning
    - Transfer / low-shot / continual / long-tail learning
    - Vision, language, and reasoning
    - Multimodal learning
    - Datasets and evaluation
    - Physics-based vision and shape-from-X
    - 'Video: action and event understanding / motion and tracking'
    - Photogrammetry and remote sensing
  features:
    - 본문 8페이지 제한(그림·표 포함, 참고문헌 제외), ICCV 스타일. 초과 시 리뷰 없이 거절.
    - 'OpenReview 기반 이중 맹검 심사, 리뷰 공개 후 1페이지 PDF 리버틀(2025: 5/10~5/16). 리버틀에 외부 링크(코드·영상) 불가.'
    - 저자는 요청 시 리뷰어로 참여해야 하며 모든 저자가 최신 OpenReview 프로필 필요.
    - 이중 투고 금지(20% 이상 중복 시 위반), arXiv 프리프린트·기술보고서는 출판물로 간주하지 않음. 존재하지 않는 문헌 인용 등 LLM 관련 오류는 거절 사유.
    - 채택 논문은 학회 2주 전 CVF 오픈액세스로 공개(IEEE Xplore와 병행).
    - '논문 등록·제출 마감 연장 없음(2025: 등록 3/3, 제출 3/7 HST).'
    - 2025년 CFP는 37개 토픽 영역을 열거하며 'Medical and biological vision, cell microscopy'를 명시적으로 포함.
  acceptance_rate: '2025: 약 24.2% (2698/11152) — Paper Copilot(제3자 집계, 공식 수치 아님)'
  sources:
    - https://iccv.thecvf.com/Conferences/2025/CallForPapers
    - https://iccv.thecvf.com/Conferences/2025/AuthorGuidelines
    - https://en.wikipedia.org/wiki/International_Conference_on_Computer_Vision
    - https://papercopilot.com/venue-overview/iccv-2025-venue-overview/
eccv:
  about: >-
    스위스 취리히에 기반한 비영리 단체 European Computer Vision Association(ECVA)이 주관하는 컴퓨터 비전 학회로, 1990년 프랑스 Antibes에서 시작되어 짝수 해에 2년마다 열린다. CVPR·ICCV와 함께
    컴퓨터 비전 3대 학회로 평가되며, 논문집은 Springer(LNCS 템플릿)로 출판된다. 2024년 밀라노 대회에는 약 8,585편이 투고되었다.
  topics:
    - 3D from multi-view and sensors / single images
    - Camera pose estimation and calibration
    - Computational imaging
    - Medical and biological vision, cell microscopy
    - Low-level vision
    - Image and video synthesis and generation
    - (Neural) scene representations
    - 'Recognition: categorization, detection, retrieval'
    - Segmentation, grouping and shape analysis
    - Self-, semi-, meta- and unsupervised learning
    - Vision, language, and reasoning
    - Synthetic data and simulation
    - Visual localization, SLAM, Structure-from-Motion
    - Geometric deep learning
    - Vision for climate and sustainability
  features:
    - 본문 14페이지 제한(그림·표 포함, 참고문헌 제외), ECCV 2026 LNCS 템플릿 필수. 다른 학회 템플릿·폰트 사용이나 여백 변경 시 데스크 리젝.
    - 'OpenReview 기반 이중 맹검 심사. 리뷰 공개 후 1페이지 2단 PDF 리버틀(2026: 5/2 리뷰 공개, 5/11 리버틀 마감).'
    - 모든 저자가 자동으로 리뷰어 풀에 추가되며(예외는 극히 제한적), 리뷰어는 투고 논문을 LLM에 업로드·처리 금지.
    - 채택 논문은 Springer 및/또는 ECVA를 통해 학회 4주 전 이후 공개. 2026 투고는 iThenticate로 표절 검사.
    - '저자 목록은 등록 마감(2026: 2/26) 이후 추가·삭제 불가(순서 변경만 가능). 2026부터 주 Contribution Type 선택 필수, Datasets/Benchmarks 유형은 카메라레디 시점에 공개 필수.'
    - 1월 29일부터 최종 결정까지 미디어·소셜미디어 엠바고 적용. 투고·보충자료·리버틀에 외부 링크 금지.
    - 채택 논문은 저자 또는 위임자가 현장 발표해야 함.
  acceptance_rate: '2024: 27.9% (2395/8585, 포스터 기준; 구두 200편 포함 시 30.2%) — Paper Copilot/aiwiki 집계(검색 결과 기반, 공식 발표 수치 재인용)'
  sources:
    - https://eccv.ecva.net/Conferences/2026/CallForPapers
    - https://eccv.ecva.net/Conferences/2026/SubmissionPolicies
    - https://www.ecva.net/
    - https://en.wikipedia.org/wiki/European_Conference_on_Computer_Vision
    - https://papercopilot.com/statistics/ECCV-statistics
wacv:
  about: >-
    IEEE/CVF가 후원하는 컴퓨터 비전 응용 중심 연례 학회로, 매년 겨울(2~3월)에 개최된다. 알고리즘 논문도 받지만 '비전 요소가 큰 시스템과 응용'에 중점을 두는 것이 특징이며, Applications 트랙과 Algorithms 트랙으로
    나뉘어 각기 다른 심사 기준을 적용한다. 2027년부터는 Evaluations & Dataset 트랙이 신설되었다.
  topics:
    - 'Applications track: Biomedical, healthcare, and medicine'
    - 'Applications track: Robotics / Autonomous driving / Remote sensing'
    - 'Applications track: Virtual and augmented reality / Visualization'
    - 'Applications track: Embedded sensing and real-time techniques'
    - 'Applications track: Agriculture / Environmental monitoring / Social good'
    - 'Algorithms track: 3D computer vision'
    - 'Algorithms track: Computational photography'
    - 'Algorithms track: Generative models for image, video, 3D'
    - 'Algorithms track: Low-level and physics-based vision'
    - 'Algorithms track: Image recognition and understanding (detection, segmentation, scene modeling)'
    - 'Algorithms track: Video recognition and understanding (tracking, action recognition)'
    - 'Algorithms track: Vision + language and/or other modalities'
    - 'Algorithms track: Foundation models for downstream vision tasks'
    - 'Algorithms track: Datasets and evaluations'
    - Evaluations & Dataset track (2027 신설)
  features:
    - >-
      두 번의 투고 라운드 운영. Round 1(7월) 논문은 accept / revise-and-resubmit / reject 판정을 받고, 수정본과 1페이지 리버틀을 제출해 Round 2에서 재심사. Round 2(9월) 신규 투고는 리버틀
      없이 accept/reject만 결정.
    - 본문 8페이지 제한(그림·표 포함, 참고문헌 제외), WACV 템플릿 필수. OpenReview 기반 이중 맹검 심사, 논문당 최소 3명 리뷰어.
    - Applications 트랙은 시스템 수준 혁신·도메인 신규성·비교 평가로, Algorithms 트랙은 CVPR/ICCV/ECCV와 유사하게 알고리즘 신규성·정량 비교로 심사.
    - 모든 저자는 리뷰어/AC로 참여할 의향이 있어야 하며, 질 낮은 리뷰를 제출한 저자의 논문은 데스크 리젝될 수 있음.
    - 채택 논문은 CVF 오픈액세스로 학회 2주 전 공개. 최소 1명 현장 등록 필수(미등록 시 논문집에서 제외). 2026 채택 논문 확장판은 Machine Vision and Applications(MVA) 저널 특집호에 게재 예정.
    - 'LLM 정책은 NeurIPS 2025 가이드라인 기반: 방법론에 LLM을 사용한 경우 기술 필수, 존재하지 않는 문헌 인용 시 거절.'
    - 'Round 1 단독 채택률은 매우 낮음(2025 Round 1: 1,329편 중 85편 채택, 732편 Round 2 재투고 초청).'
  acceptance_rate: >-
    2024: 41.4% (846/2043) — Paper Copilot(제3자 집계); 2025 Round 1: 6.4% (85/1329), Round 2: 재투고 440편·신규 303편 채택(1,809편 중) — 공식 라운드별 수치, 종합
    채택률 공식 미발표
  sources:
    - https://wacv.thecvf.com/Conferences/2026/CallForPapers
    - https://wacv.thecvf.com/Conferences/2027/AuthorGuides
    - https://papercopilot.com/statistics/wacv-statistics/
    - https://ami.kaist.ac.kr/275fdae6-c854-80b1-8169-dff86cc4665e
neurips:
  about: >-
    1987년 시작된 머신러닝·계산신경과학 분야의 연례 학회로, 매년 12월에 열리며 NeurIPS Foundation이 주관한다(초대 대회는 IEEE 후원). 원래 생물학적·인공 신경망 연구자들의 학제적 모임으로 출발했으며 2018년 약칭을
    NIPS에서 NeurIPS로 변경했다. 2025년 메인 트랙에 21,575편이 투고되어 5,290편이 채택되는 등 ICML·ICLR과 함께 ML 분야 최고 권위 학회로 평가된다.
  topics:
    - Applications (vision, language, speech, etc.)
    - Deep learning
    - Evaluation
    - General machine learning
    - Infrastructure / ML systems
    - Machine learning for sciences
    - Neuroscience and cognitive science
    - Optimization
    - Probabilistic methods
    - Reinforcement learning
    - Social and economic aspects of machine learning
    - Theory
    - Robotics and embodied systems (2026 CFP)
    - AI/ML for health, sustainability, creative work (2026 CFP)
  features:
    - 본문 9페이지 제한(그림·표 포함; 참고문헌·체크리스트·기술 부록 제외), 채택 시 카메라레디에 1페이지 추가. 논문 끝에 Paper Checklist 필수 첨부.
    - OpenReview 기반 이중 맹검 심사. 초록 마감 이후 저자 추가·삭제 불가(순서 변경만). 리뷰에 대한 1주 author response 기간이 있으나 논문 수정본 제출은 불가.
    - '메인 트랙 외에 Datasets & Benchmarks(2026: Evaluations and Datasets) 트랙과 Position Paper 트랙(2025 신설)을 별도 포털로 운영, 제출 후 트랙 간 이동 불가.'
    - 저자에게 리뷰 참여 요청(reciprocal reviewing)이 있으며, 담합(collusion) 적발 시 거절·향후 제재. 프로그램 체어가 IRB 승인 하에 리뷰 과정에 대한 무작위 대조 실험을 수행.
    - arXiv 프리프린트 허용(단 'Under review at NeurIPS' 표기 금지). 2025년 3월 1일 이후 공개된 논문은 동시기 연구로 간주해 비교 누락만으로 거절되지 않음.
    - 카메라레디에 자금 출처 공개 필수, 코드·데이터 공개 강력 권장. 2026년에는 복수 도시(Sydney, Paris, Atlanta)에서 개최.
    - Wikipedia에 따르면 2021년 중복 투고 실험에서 23%의 논문이 상이한 채택 결정을 받아 심사 일관성 논쟁이 있음.
  acceptance_rate: '2025: 24.5% (5290/21575); 2024: 25.8% (4037/15671) — lixin4ever/Conference-Acceptance-Rate 집계'
  sources:
    - https://neurips.cc/Conferences/2025/CallForPapers
    - https://neurips.cc/Conferences/2026/CallForPapers
    - https://en.wikipedia.org/wiki/Conference_on_Neural_Information_Processing_Systems
    - https://github.com/lixin4ever/Conference-Acceptance-Rate
    - https://blog.neurips.cc/2026/08/10/announcing-the-neurips-2026-workshops/
iclr:
  about: >-
    Yann LeCun과 Yoshua Bengio가 2012년에 창립해 2013년 첫 대회를 연 표현 학습(representation learning) 중심의 연례 머신러닝 학회로, 보통 4월 말~5월 초에 개최된다. 출범 이래 OpenReview
    기반의 공개 동료 심사(open peer review)를 채택한 것이 가장 큰 특징이며, NeurIPS·ICML과 함께 ML 분야 3대 학회로 꼽힌다. 2025년 싱가포르 대회에는 85개국 11,039명이 참가했고, 2026년에는 19,525편
    투고 중 5,355편이 채택되었다.
  topics:
    - Representation learning (supervised, self-supervised, semi-supervised, unsupervised)
    - Reinforcement learning
    - Generative models
    - Causal reasoning
    - Optimization
    - Learning theory
    - Fairness, safety, privacy
    - Datasets and benchmarks
    - Neurosymbolic systems
    - Robotics
    - Applications to neuroscience and cognitive science
    - Applications to physical sciences
    - General machine learning
  features:
    - 본문 9페이지 제한(투고 시), 리버틀·카메라레디 단계에서 10페이지로 확장. 참고문헌·부록 무제한, 초과 시 데스크 리젝.
    - '리뷰가 OpenReview에 익명으로 공개되고, 약 3주간(2026: 11/11~12/3) 공개 토론 기간 동안 저자가 응답하고 논문을 수정할 수 있음. 결정 후 모든 투고가 비익명화되어 공개되며 거절 논문의 리뷰도 그대로 남음.'
    - '강력한 상호 리뷰 의무: 3편 이상 투고한 저자는 최소 6편 리뷰, 모든 투고에 최소 1명의 리뷰 가능 저자(ICLR/NeurIPS/ICML 등 채택 이력 보유) 등록 필수. 미이행 시 데스크 리젝 가능.'
    - 이중 맹검이지만 arXiv 공개 허용. 마감 후 철회한 논문도 즉시 비익명화되어 공개 상태 유지.
    - LLM이 아이디어 도출·집필에 상당한 역할을 했다면 별도 섹션에 공개 필수, 미공개 시 데스크 리젭 가능. LLM은 저자 자격 없음.
    - 논문집은 OpenReview에 오픈액세스로 호스팅(별도 출판사 없음). Ethics statement(1페이지)·reproducibility statement는 선택이지만 권장.
  acceptance_rate: '2026: 27% (5355/19525); 2025: 31.9% — Wikipedia (ICLR article)'
  sources:
    - https://iclr.cc/Conferences/2026/CallForPapers
    - https://iclr.cc/Conferences/2026/AuthorGuide
    - https://en.wikipedia.org/wiki/International_Conference_on_Learning_Representations
icml:
  about: >-
    1980년 Carnegie Mellon에서 워크숍으로 시작해 1993년 정식 학회 시리즈가 된 가장 오래된 머신러닝 학회로, International Machine Learning Society(IMLS)가 주관하며 매년 1월 말 마감, 7월
    개최된다. NeurIPS·ICLR과 함께 ML 분야 3대 최고 권위 학회로 평가되며, 투고 수가 2015년 1,037편에서 2025년 12,107편, 2026년 약 2만 4천 편으로 급증했다. 2026년 대회는 서울에서 개최되었다.
  topics:
    - General machine learning
    - Deep learning
    - Evaluation
    - Theory
    - ML systems
    - Optimization
    - Probabilistic methods
    - Reinforcement learning
    - Trustworthy machine learning
    - Application-driven machine learning
  features:
    - 본문 8페이지 제한(참고문헌·impact statement·부록 무제한), 카메라레디에 1페이지 추가. 참고문헌 앞에 Impact Statement 섹션 필수, 채택 후 lay summary 제출 필수.
    - OpenReview 기반 이중 맹검 심사. 채택 논문은 원 투고본·익명 리뷰·메타리뷰·리버틀·토론이 카메라레디와 함께 공개됨(거절 논문은 선택).
    - '상호 리뷰 의무: 투고마다 최소 1명의 저자가 리뷰어로 참여(한 저자가 최대 2편 담당), 4편 이상 투고한 저자는 리뷰 필수. 미이행 또는 불성실 리뷰 시 투고 논문 데스크 리젝 가능.'
    - 논문집은 PMLR(Proceedings of Machine Learning Research, JMLR 산하)에 오픈액세스로 출판.
    - Position paper 트랙을 메인 트랙과 별도 OpenReview 사이트로 운영. 2026년부터 채택 논문의 proceedings-only(가상 등록) 옵션 허용.
    - arXiv 프리프린트 허용(단 ICML 투고임을 광고 금지). LLM 사용 가능하되 저자 전적 책임, 프롬프트 인젝션은 데스크 리젝. 복수 투고 저자는 선택적으로 자기 논문 순위를 integrity chair에게만 제출 가능.
    - '초록·논문 마감 연장 없음(2026: 초록 1/23, 논문 1/28). 초록 마감 후 저자 목록 변경 불가.'
  acceptance_rate: '2026: 26.6%; 2025: 26.9% (3260/12107); 2024: 30.5% — Wikipedia (ICML article)'
  sources:
    - https://icml.cc/Conferences/2026/CallForPapers
    - https://en.wikipedia.org/wiki/International_Conference_on_Machine_Learning
aaai:
  about: >-
    Association for the Advancement of Artificial Intelligence(AAAI)가 주관하는 종합 인공지능 학회로, 1980년 스탠퍼드에서 첫 대회가 열렸고 매년 개최된다(투고 8월 전후, 개최 1~2월).
    머신러닝·NLP·컴퓨터 비전·계획·추론·다중 에이전트 등 AI 전 분야를 포괄하며, Google Scholar H5 지수 기준 AI 출판물 중 ICLR·NeurIPS·ICML에 이어 4위다. AAAI-26(싱가포르)은 2만 편 이상의 투고를
    받았다.
  topics:
    - Machine learning
    - Natural language processing
    - Computer vision
    - Data mining
    - Multiagent systems
    - Knowledge representation
    - Human-in-the-loop AI
    - Search, planning, reasoning
    - Robotics and perception
    - Ethics
    - 'Special track: AI for Social Impact'
    - 'Special track: AI Alignment'
  features:
    - 기술 본문 7페이지 제한 + 참고문헌 전용 추가 페이지. 모든 저자에게 재현성 체크리스트(reproducibility checklist) 필수.
    - >-
      OpenReview 기반 2단계 심사: Phase 1에서 인간 리뷰 2건 + AI 생성 리뷰 1건(비결정적)으로 SPC가 통과 여부 결정, Phase 2에서 추가 인간 리뷰 후 author response·토론·메타리뷰. Phase 1 탈락
      논문은 리버틀 기회 없음.
    - 'AAAI-26부터 AI 보조 심사 파일럿 운영: AI 리뷰는 점수·추천 없이 참고용이며 최종 결정은 인간이 내림. 저자는 AI 리뷰에도 응답 가능.'
    - LLM 생성 텍스트는 실험 분석 대상이 아닌 한 금지(저자가 쓴 글의 교정·윤문 용도는 허용). AI 도구는 저자·인용 출처 불가.
    - 모든 저자에게 리뷰 참여 기대(가벼운 부담), 불이행 시 거절 포함 제재 가능.
    - 초록(7월 말)·본문(8월 초) 마감 분리. 보충자료는 리뷰어가 읽을 의무가 없으므로 핵심 내용은 본문에 포함해야 함.
    - 학제 간 연구(신경과학·인지과학과의 연계 등) 및 헬스케어·지속가능성 응용을 명시적으로 장려.
  acceptance_rate: '2026: 약 17.6% (4167/23680) — Bohrium 블로그(제3자, 출처 미표기); 2025: 23.4% (3032/12957) — lixin4ever/Conference-Acceptance-Rate'
  sources:
    - https://aaai.org/conference/aaai/aaai-26/main-technical-track-call/
    - https://en.wikipedia.org/wiki/AAAI_Conference_on_Artificial_Intelligence
    - https://github.com/lixin4ever/Conference-Acceptance-Rate
    - https://www.bohrium.com/en/blog/research-notes/aaai-2026-accepted-papers-highlights/
bmvc:
  about: >-
    British Machine Vision Association(BMVA)이 주관하는 영국의 연례 컴퓨터 비전 학회로, 2026년 Lancaster 대회가 37회째다. 구두·포스터 발표로 구성된 단일 트랙(single-track) 학회라는 점이
    특징이며, 2026년에는 1,448편 투고 중 406편이 채택되었다. 영상처리·컴퓨터 비전·머신러닝 전반을 다루며 의료·생물 영상 분석 토픽을 명시적으로 포함한다.
  topics:
    - 3D from X, Shape Modeling and Processing
    - Medical and Biological Image Analysis
    - Computational Photography and Photogrammetry
    - Low-level and Physics-based Vision
    - Generative Models
    - Recognition, Segmentation, and Scene Understanding
    - Representation, Self-supervised, and Transfer Learning
    - Multimodal Learning (Vision + Language, Audio, etc.)
    - Motion Estimation and Tracking
    - Action, Event, and Video Understanding
    - Uncertainty
    - Explainable, Fair, and Ethical AI
    - Datasets and Evaluation
    - Vision Applications, Systems, and Robotics
    - Brave New Ideas (벤치마크 성능 향상이 아닌 새로운 접근·이론)
  features:
    - 본문 14페이지 제한(참고문헌 제외), 공식 BMVC LaTeX/Word 템플릿 필수. 보충자료는 단일 zip으로 논문 마감과 동시에 제출.
    - 'OpenReview 기반 이중 맹검 심사, 논문당 최소 3명 리뷰어 + Area Chair 메타리뷰. 리버틀 기간 운영(2026: 7/3~7/10).'
    - '커뮤니티 리뷰 제도: 저자는 투고 수에 비례한 편수를 리뷰할 것을 약속하며, 불성실 참여 시 거절 가능.'
    - '''Brave New Ideas'' 토픽을 두어 벤치마크 성능 향상 없이도 새로운 접근·이론을 장려.'
    - 단일 트랙(구두+포스터) 운영, 논문집은 BMVA가 출판. 다른 학회·저널 동시 심사 금지, arXiv 프리프린트는 선행 출판으로 보지 않음.
    - 초록(5월 22일)·논문(5월 29일) 마감 분리, 연장 없음. 2026년 워크숍에 MFM4Health(헬스케어용 멀티모달 파운데이션 모델) 등 의료 관련 워크숍 포함.
    - 채택 논문 중 상위 논문은 IJCV 특집호 확장판 투고에 초청(검색 결과 요약 기준).
  acceptance_rate: '2026: 28.0% (406/1448) — 공식 accepted papers 페이지'
  sources:
    - https://bmvc2026.bmva.org/calls/call-for-papers/
    - https://bmvc2026.bmva.org/programme/accepted_papers/
accv:
  about: >-
    Asian Federation of Computer Vision(AFCV)이 후원하는 아시아 지역의 대표 컴퓨터 비전 학회로, 짝수 해에 2년마다 개최되며 2026년 오사카 대회가 18회째다. 논문집은 Springer LNCS로 출판되고 CVF
    오픈액세스에도 병행 게재되며, 2024년 하노이 대회에는 839편 투고 중 270편이 채택되었다. CVPR/ICCV/ECCV와 유사한 토픽 구조에 'Biomedical Image Analysis'를 별도 영역으로 둔다.
  topics:
    - 3D Computer Vision
    - Biomedical Image Analysis
    - Computational Photography, Sensing, and Display
    - Low-level Vision and Image Processing
    - Illumination and Reflectance Modeling
    - Physics-based Vision and Shape from X
    - Deep Learning for Computer Vision
    - Generative Models for Computer Vision
    - Recognition (Feature Detection, Indexing, Matching, Shape Representation)
    - Segmentation and Grouping
    - Motion and Tracking
    - Scene Analysis and Understanding
    - Video Analysis and Event Recognition
    - Vision and Language
    - Datasets and Performance Analysis
  features:
    - 본문 14페이지 제한(그림·표 포함, 참고문헌 제외), 공식 LNCS 스타일·ACCV LaTeX 템플릿 필수. 카메라레디 추가 페이지 없음.
    - 'OpenReview 기반 이중 맹검 심사. 1페이지 PDF 리버틀(2026: 8/26 리뷰 공개, 9/2 리버틀 마감), 새 기여·외부 링크 불가.'
    - 논문집은 Springer LNCS 사후 간행(2027년 1월경) + CVF Open Access 병행 게재.
    - 모든 저자는 요청 시 리뷰어로 참여해야 하며 자동으로 리뷰어 풀에 추가될 수 있음.
    - LLM으로 생성된 논문·허위 인용 금지(제한적 언어 교정만 허용), 숨은 프롬프트·보이지 않는 텍스트 삽입 시 데스크 리젝.
    - 저자 목록은 등록 후 고정, 최소 1명 현장 발표 필수(1인 등록으로 최대 2편 커버). 기여로 주장한 데이터셋은 카메라레디까지 공개 필수.
    - 등록(7/3)·제출(7/5)·보충자료(7/8) 마감 분리(2026, 23:59 GMT). 수상 논문은 IJCV 특집호 투고 초청(검색 결과 요약 기준).
  acceptance_rate: '2024: 약 32% (270/839) — Springer LNCS 논문집 소개문 기준(검색 결과), 공식 채택률 발표는 미확인'
  sources:
    - https://accv2026.org/
    - https://accv2026.org/submissions/author-guidelines/
    - https://link.springer.com/978-981-96-0916-1
3dv:
  about: >-
    3D 컴퓨터 비전·그래픽스 전문 국제 학회로 2013년부터 매년 열리며, IEEE Computer Society가 기술 후원(technically co-sponsored)한다. 2026년 밴쿠버 대회가 13회째로 177편의 논문이 채택되었으며,
    단일 트랙 구두·포스터 발표와 산업 전시, 멘토링 세션으로 구성된 비교적 소규모의 커뮤니티 밀착형 학회다. 취득(acquisition)·모델링·분석·렌더링·응용의 5개 축으로 토픽을 구분하며 응용 영역에 medical, biology,
    neuroscience를 명시한다.
  topics:
    - 'Acquisition: geometry, calibration, photogrammetry, SfM and SLAM'
    - 'Acquisition: dense reconstruction and stereo, structured light and ToF sensors'
    - 'Acquisition: physics-based vision and shape from X, computational photography'
    - 'Modelling: shape representation, geometry processing, registration'
    - 'Modelling: 4D dynamic shapes and scenes, generative and morphable models'
    - 'Analysis: shape recognition and analysis, segmentation, motion and tracking'
    - 'Analysis: body/face/gesture, dataset and benchmarking'
    - 'Rendering and Interaction: neural rendering, image-based rendering, AR/MR'
    - 'Applications: medical, biology, neuroscience'
    - 'Applications: robotics, industrial, cultural heritage, digital fabrication'
  features:
    - 본문 8페이지 제한(그림·표 포함, 참고문헌 제외), 초록 4,000자 제한. 초과 시 리뷰 없이 거절.
    - OpenReview 기반 이중 맹검 심사이며, 2026 대회는 리버틀 없음('there will be no rebuttal at 3DV 2026').
    - 이중 투고 금지(20% 이상 중복 시 위반), arXiv·기술보고서는 출판물로 간주하지 않음. 보충자료(PDF/ZIP, 200MB)에 새 데이터셋 결과·개선된 방법 결과 포함 불가.
    - '모든 마감은 23:59 Pacific Time, 연장 없음(2026: 논문 8/18, 보충자료 8/21, 통보 11/5). 최소 1명 저자 등록·발표 필수.'
    - 최종 결정 전까지 SNS에 학회명을 언급하지 않는 조건으로 투고 논문 홍보 가능. 특허 공개 기준일은 학회 1주 전.
    - Vision Systems Inc. 후원 최우수 논문상, Dissertation Award, 별도 마감의 Nectar Track 운영. 단일 트랙 구두·포스터, 산업 전시, 멘토링 세션 포함.
    - '채택률이 주요 CV 학회보다 높은 편(2025: 약 40%, 제3자 집계).'
  acceptance_rate: '2026: 177편 채택(공식, SFU 보도) / 404편 투고·43.8% (Voxel51 데이터셋 카드, 제3자); 2025: 약 40.2% (142/353) — Paper Copilot(제3자)'
  sources:
    - https://3dvconf.github.io/2026/call-for-papers/
    - https://3dvconf.github.io/2026/author-guidelines/
    - https://www.sfu.ca/fas/computing/news-events/news/2026/march/sfu-computing-science-helps-bring-the-global-3d-vision-research-.html
    - https://papercopilot.com/statistics/3dv-statistics/
miccai:
  about: >-
    MICCAI(Medical Image Computing and Computer Assisted Intervention)는 MICCAI Society가 주관하는 의료영상 컴퓨팅 및 컴퓨터 보조 중재 분야의 대표 국제학회로, 매년 개최된다.
    2025년 3,677편, 2026년 4,601편(공식 수치 기준)의 투고가 몰린 대규모 학회이며, 2026년(제29회)은 프랑스 스트라스부르(9월 27일–10월 1일)에서 열렸다. 의료영상 분석(MIC)과 컴퓨터 보조 중재(CAI) 두 축의
    방법론 연구자와 임상 연구자가 모이는 커뮤니티다.
  topics:
    - Image formation and reconstruction
    - Image segmentation and anomaly detection
    - Multimodal data integration
    - Computer-aided diagnosis
    - Trustworthy and generalizable AI
    - Algorithmic fairness
    - Surgical data science
    - Image-guided robotic surgery
    - Point-of-care imaging
    - Teleradiology
    - Medical Image Computing (MIC) / Computer Assisted Intervention (CAI) primary areas
  features:
    - 본문 최대 8페이지 + 참고문헌 최대 2페이지, MICCAI 전용 LNCS 템플릿 필수(여백·행간 변경 등 형식 위반 시 자동 desk reject)
    - '완전 이중맹검(double-blind) 리뷰: 논문당 외부 리뷰어 평균 3명 + Area Chair 1–3명'
    - '2단계 결정: 1차에서 15–20%는 early accept, 40–50%는 early reject, 나머지는 1주일 rebuttal 후 AC 3명이 독립 판정(새 실험·결과 추가 불가)'
    - 투고 2주 전 abstract(intention-to-submit) 등록 필수, 본문 마감은 연장 없음; 공동저자 리뷰어 등록 요구
    - 보충자료는 비디오(avi/mp4/wmv)만 허용, PDF 보충자료 불가(2026 기준)
    - 채택 논문은 Springer LNCS로 출판되고 MICCAI Society 사이트에 오픈액세스 버전 공개
    - '채택률은 약 27–29% 수준(2025: 1,027/3,677 ≈ 28%; 2026: 공식 발표 약 27%)'
  acceptance_rate: '2025: 약 28% (1,027/3,677, MICCAI 2025 General Chair 보고); 2026: 약 27% (1,167편 채택 / 4,601편 투고, MICCAI 2026 공식 수치 인용 보도)'
  sources:
    - https://conferences.miccai.org/2026/en/CALL-FOR-PAPERS.html
    - https://conferences.miccai.org/2026/en/PAPER-SUBMISSION-GUIDELINES.html
    - https://conferences.miccai.org/2026/en/THE-MICCAI-REVIEW-PROCESS.html
    - https://www.uni-bamberg.de/en/xai/news/artikel/2026-conference-miccai/
    - https://miccai.org/index.php/publications/newsletters/december-winter-2025/memories-of-miccai-2025/
midl:
  about: >-
    MIDL(Medical Imaging with Deep Learning)은 MIDL Foundation이 주관하는 의료영상 딥러닝 전문 국제학회로 매년 개최된다. 2026년(7월 8–10일)은 타이베이에서 현장 개최와 무료 온라인 스트리밍을
    병행했다. 의료영상에 특화된 딥러닝 방법론 연구자 중심의 커뮤니티로, 채택 full paper는 PMLR로 출판된다.
  topics:
    - Segmentation, detection, and classification of medical images
    - Learning-based image registration and reconstruction
    - Clinical integration, workflow, and deployment
    - Self-, semi-, and unsupervised representation learning
    - Transfer learning, domain adaptation, learning with limited or noisy labels
    - Generative AI and diffusion models for imaging
    - Foundation and large vision-language models for healthcare
    - Multimodal learning (imaging with text, omics, sensors, clinical data)
    - Uncertainty estimation, calibration, and interpretability
    - Federated, distributed, and privacy-preserving learning
    - Safe, trustworthy, and responsible AI
    - Validation and benchmarking across radiology, pathology, endoscopy, dermatology, ophthalmology
  features:
    - 'Main Track(방법론) full paper: 투고 시 최대 10페이지(참고문헌·감사·부록 제외), 카메라레디 최대 12페이지; 공식 MIDL LaTeX 템플릿 필수'
    - '2026년 신설 Special Track(Validation Studies): 투고 최대 14페이지, 카메라레디 최대 16페이지, 별도 OpenReview 포털'
    - Short paper(3페이지 이하, 참고문헌 제외)는 포스터/스포트라이트로 발표되며 proceedings에 포함되지 않음
    - 'OpenReview 기반 단일맹검(single-blind) 리뷰: 리뷰어는 저자를 알지만 저자는 리뷰어를 모름'
    - Full paper는 약 1주 rebuttal + 리뷰어 토론 기간 후 meta-review로 최종 결정
    - 채택 full paper는 Proceedings of Machine Learning Research(PMLR)에 출판
  acceptance_rate: null
  sources:
    - https://2026.midl.io/call-for-papers
isbi:
  about: >-
    ISBI(IEEE International Symposium on Biomedical Imaging)는 IEEE Signal Processing Society(SPS)와 IEEE Engineering in Medicine and Biology
    Society(EMBS)가 공동 주관하는 연례 심포지엄으로, 생물·의료영상의 수학적·알고리즘적·계산적 측면을 다룬다. 2026년(제23회)은 런던 ExCeL(4월 8–11일)에서 수백 명 규모로 열렸고, 2027년(5월 25–28일, 로잔
    EPFL)은 첫 ISBI 이후 25주년이 되는 해다. 키노트·튜토리얼·챌린지·clinical day 등으로 구성된 프로그램을 운영한다.
  topics:
    - Image formation and reconstruction
    - Computational and statistical image processing and analysis
    - Segmentation
    - Image quality assessment
    - Biological and biomedical imaging (nano to macro)
  features:
    - '두 가지 투고 트랙: 4페이지 full paper(IEEE 형식, IEEE Xplore 출판)와 1페이지 abstract(마감이 더 늦음)'
    - 4페이지 논문은 가을(2027년 기준 11월 2일) 마감, 1페이지 abstract는 이듬해 2월 마감 등 시차가 큼
    - 채택 논문은 발표 저자가 등록·현장 발표해야 IEEE Xplore에 게재(2025 카메라레디 정책)
    - 메인 트랙 외 워크숍 논문, 챌린지 논문, 튜토리얼·스페셜세션·데모 제안 트랙 운영; 챌린지 논문은 EDAS로 리뷰 전달
    - 2025년(휴스턴) 채택 논문 631편 중 190편 구두 발표
  acceptance_rate: '2026: 51.0% (893편 채택; ISBI 2026 Program PDF 통계 — 검색 스니펫으로만 확인, 원문 PDF 직접 열람 불가)'
  sources:
    - https://biomedicalimaging.org/2026/
    - https://biomedicalimaging.org/2027/
    - https://signalprocessingsociety.org/newsletter/2025/11/isbi-2026-london-where-machines-learn-see-body-and-humans-learn-what-comes-next
    - https://warwick.ac.uk/fac/cross_fac/tia/news/highlights_from_isbi
    - https://confcats-event-sessions.s3.us-east-1.amazonaws.com/isbi26/uploads/isbi26-cfp_web-05.pdf
    - https://confcats-event-sessions.s3.us-east-1.amazonaws.com/isbi26/uploads/ISBI_2026_Program_v11b.pdf
ipmi:
  about: >-
    IPMI(Information Processing in Medical Imaging)는 2년마다 열리는 의료영상 컴퓨팅 방법론 학회로, 약 58년 전통을 가진 분야 최고(premier) 포럼 중 하나로 소개된다. 2027년 제30회는 캐나다
    퀘벡 오르포드의 Jouvence 센터(6월 27일–7월 2일)에서 열리며 예상 참가자는 약 120명으로, 참가자 전원이 함께 숙박·식사하는 retreat 형식이다. 채택 논문은 Springer LNCS로 출판된다.
  topics:
    - Mathematical foundations and computational methods
    - Image formation and reconstruction
    - Machine learning and intelligence
    - Clinical applications and translation
    - Visualization and human-AI interaction
  features:
    - 본문 12페이지(참고문헌 제외) Springer LNCS 형식, 보충자료 일체 불허; 형식 위반 시 desk reject
    - 이중맹검(double-blind) 리뷰; abstract 마감 1주 후 full paper 마감(연장 없음)
    - 발표 후 시간제한 없는 Q&A(Unlimited Q&A)가 학회의 핵심
    - '참가자 약 120명 규모의 소규모 retreat: 숙박·식사 포함 all-inclusive 등록'
    - 저자는 반드시 현장 참석, 채택 논문 1편당 1건의 저자 등록 필요
    - 채택 논문은 Springer LNCS 출판, 우수 논문은 Medical Image Analysis(MedIA) 특집호 확장 초청(2027, 출판사 절차 진행 중)
  acceptance_rate: null
  sources:
    - https://2027.ipmi-conf.org/
embc:
  about: >-
    EMBC는 IEEE Engineering in Medicine and Biology Society(EMBS)의 연례 플래그십 학회로, 1979년 덴버에서 첫 회가 열렸고 평균 참가자는 약 3,000명이다. 2026년 제48회는 캐나다 토론토
    Metro Toronto Convention Centre(7월 26–30일)에서 열리며 80개국 이상에서 투고된다. 생체신호처리, 의료영상, 신경공학, 웨어러블 센서 등 의공학 전 분야를 아우르는 광범위한 커뮤니티다.
  topics:
    - Biomedical Signal Processing
    - Biomedical Imaging and Image Processing
    - Bionanotechnology & BioMEMS (BNM)
    - Cardio-Pulmonary Systems and Physiological Engineering
    - Neural and Rehabilitation Engineering
    - Therapeutic & Diagnostic Systems and Technologies
    - Wearable Biomedical Sensors and Systems
    - Biorobotics and Biomechanics
    - Biomedical & Health Informatics
    - 'Biomedical Engineering for Society: Educating Innovators and Advancing Health Equity'
    - 'From Fashion to Function: User-Centered Smart Textiles for Healthcare'
  features:
    - Full Contributed Paper(2026 템플릿 기준 4–7페이지)와 1-Page Research Poster Paper 두 트랙
    - Full paper가 높은 점수로 불채택되면 1페이지 포스터 트랙으로 전환 기회 제공
    - 단일맹검(single-blind) 리뷰, 테마·키워드 기반 리뷰어 배정
    - 채택 full paper는 현장 발표 후 IEEE Xplore 및 PubMed/MEDLINE 색인 대상; 1페이지 논문은 출판·색인 불가
    - 리뷰 점수 기준 상위 약 7% 투고는 IEEE TBME 특집호 확장 투고 초청
    - 등록 1건당 채택 논문 최대 2편, 논문당 저자 최대 35명
  acceptance_rate: null
  sources:
    - https://embc.embs.org/2026/
    - https://embc.embs.org/2026/papers/
    - https://embs.org/events/sponsorship
spie-mi:
  about: >-
    SPIE Medical Imaging은 SPIE(국제광공학회)가 매년 2월에 개최하는 의료영상 전문 심포지엄으로, 영상처리·물리·컴퓨터 보조 진단·지각·영상유도 시술 등 9개 세부 컨퍼런스로 구성된다. 2027년은 캐나다 밴쿠버(2월
    14–18일)에서 열리며, abstract 마감은 2026년 8월 5일이었다. 영상 물리·하드웨어부터 CAD·병리까지 기술개발과 임상 평가 연구자가 함께 모이는 커뮤니티다.
  topics:
    - Physics of medical imaging
    - Medical image processing
    - Computer-aided diagnosis
    - Image perception and observer performance
    - Image-guided procedures
    - Digital and computational pathology
    - Ultrasonic imaging and tomography
    - Imaging informatics
    - AI/ML application track (artificial intelligence, machine learning, deep learning)
  features:
    - 'abstract 선투고 방식: 기술심사용 abstract(200–300단어) + 프로그램용 요약(50–150단어) + 심사 전용 2–4페이지 보충 PDF 제출'
    - 학회 chair/editor가 기술적 가치와 적합성을 심사하고 구두/포스터 배정 결정
    - 채택 후 4페이지 이상 technical manuscript를 학회 약 3주 전까지 제출해야 Proceedings of SPIE(SPIE Digital Library)에 출판
    - 현장 발표되고 기한 내 제출된 원고만 출판; 구두 발표는 녹화되어 슬라이드와 함께 Proceedings에 게재
    - abstract 마감(8월)에서 학회(2월)까지 약 6개월, 원고 마감은 학회 직전 1월
  acceptance_rate: null
  sources:
    - https://www.spie.org/conferences-and-exhibitions/medical-imaging/presenters/abstract-submission-guidelines
    - https://www.electrooptics.com/event/spie-medical-imaging-2027
chil:
  about: >-
    CHIL(Conference on Health, Inference, and Learning)은 Association for Health Learning and Inference(AHLI)가 주관하는 의료 머신러닝 학회로, 2022년부터 AHLI
    공식 학회이며 매년 개최된다. 2026년 제7회는 시애틀 아동연구소(6월 29–30일)에서 열렸고 PMLR Volume 333에 40편의 논문이 수록되었다. ML 연구자, 임상의, 산업계, 정책 전문가가 함께 모이는 비교적 소규모의 건강 AI
    커뮤니티다.
  topics:
    - Models and Methods (2024 CFP 트랙)
    - Applications and Practice (2024 CFP 트랙)
    - Policy, Impact and Society (2024 CFP 트랙)
    - AI/ML for clinical healthcare, public health, health economics, informatics
  features:
    - OpenReview 기반 투고, 익명화된 PDF 제출(2024 CFP)
    - 저자 응답(author response) 기간과 리뷰어 토론 기간을 모두 운영(2024 CFP)
    - '채택 논문은 Proceedings of Machine Learning Research(PMLR)에 출판(2026: Vol. 333, 40편)'
    - 본회의 외 Research Roundtables(주제별 30분 토론 세션) 등 토론 중심 프로그램 운영(2025)
    - 참가자는 CS·통계·역학·의학·공공정책 등 다학제 구성
  acceptance_rate: null
  sources:
    - https://proceedings.mlr.press/v333
    - https://physionet.org/news/post/chil-conference-call-for-papers-1/
    - https://arxiv.org/html/2510.15217v2
    - https://ahli.cc/
icip:
  about: >-
    ICIP(IEEE International Conference on Image Processing)는 IEEE Signal Processing Society의 영상처리·비전·이미징 분야 플래그십 학회로 1994년부터 매년 개최되며, 100개국
    이상에서 1,000명 이상이 참가한다. 2026년 제33회는 핀란드 탐페레(9월 13–17일)에서 열린다. 영상처리 전반을 다루는 대규모 커뮤니티로 100개 이상의 기술 세션, 위성 워크숍, 스페셜 세션, 그랜드 챌린지를 운영한다.
  topics:
    - Image processing
    - Computer vision
    - Imaging
    - Special sessions
    - Satellite workshops
    - Grand challenges
  features:
    - 정규 논문 최대 5페이지 + 참고문헌 전용 1페이지, IEEE Xplore 출판
    - 'OJSP(IEEE Open Journal of Signal Processing) 트랙: 8+1페이지, 학회와 동일 일정으로 심사, 오픈액세스 저널 출판 후 학회 발표'
    - 이중맹검(double-anonymous) 리뷰 + 저자 rebuttal 기간
    - 1페이지 Work-in-Progress abstract 트랙(5월 마감) 및 최근 SPS 저널 채택 논문 발표 트랙 운영
    - 상위 논문은 Spotlight 세션에 선정되고 IEEE TIP/TCI 확장판 신속 심사 기회 제공
    - 'Open Preview: 채택 논문을 학회 전 IEEE Xplore에서 무료 공개; 엄격한 no-show 정책(미발표 시 미출판)'
  acceptance_rate: null
  sources:
    - https://2026.ieeeicip.org/
    - https://2026.ieeeicip.org/call-for-papers-and-abstracts/
    - https://ieeeicip.org/
icassp:
  about: >-
    ICASSP(IEEE International Conference on Acoustics, Speech and Signal Processing)는 IEEE Signal Processing Society의 플래그십 학회로 1976년 필라델피아에서
    시작해 매년 열린다. 2024년 서울 4,403명, 2025년 하이데라바드 약 4,000명이 참가하고 2025년 채택 논문이 3,393편에 이르는 신호처리 분야 최대 규모 학회이며, 2026년 제51회는 바르셀로나(5월 4–8일), 2027년
    제52회는 토론토(5월 16–21일)에서 열린다. 오디오·음성·영상·의료영상·머신러닝 등 신호처리 전 분야 커뮤니티가 모인다.
  topics:
    - Biomedical Imaging & Signal Processing
    - Computational Imaging
    - Image, Video & Multidimensional Signal Processing
    - Machine Learning and Generative AI
    - Computer Vision
    - Compressive Sensing, Sparse Modeling
    - Signal Processing Theory & Methods
    - Sensor Array & Multichannel SP
    - Audio & Acoustic Signal Processing
    - Speech & Language Processing
    - Signal Processing over Graphs
    - Multimedia Signal Processing
    - Remote Sensing & Signal Processing
    - Applied Signal Processing Systems
  features:
    - 정규 논문 기술 본문 최대 4페이지 + 참고문헌 전용 5페이지(총 5페이지 초과 불가)
    - 단일맹검(single-anonymous) 리뷰, 논문당 최소 3명 리뷰어, 1주 이상의 선택적 rebuttal(TC/Area Chair만 열람)
    - 12개 Technical Committee가 분야별로 심사 담당
    - 'OJSP 특별 트랙(8+1페이지): 학회와 동일 심사 일정, 저널 출판 후 학회 발표(proceedings 미포함)'
    - 'Open Preview: 학회 30일 전부터 IEEE Xplore에서 proceedings 무료 공개'
    - IEEE SPS/EURASIP 저널 채택 논문의 발표 트랙 운영(재심사 없음, proceedings 미포함)
    - 채택 논문은 저자 중 1인이 반드시 현장 발표; 등록 미완료 시 proceedings에서 자동 철회
  acceptance_rate: null
  sources:
    - https://2026.ieeeicassp.org/call-for-papers/
    - https://2026.ieeeicassp.org/editorial-policies/
    - https://2026.ieeeicassp.org/?p=4445
    - https://2027.ieeeicassp.org/call-for-papers/
    - https://en.wikipedia.org/wiki/International_Conference_on_Acoustics,_Speech,_and_Signal_Processing
iccp:
  about: >-
    ICCP(IEEE International Conference on Computational Photography)는 2009년부터 매년 열리는 계산 이미징·계산 사진학 전문 학회로, IEEE Computer Society의 PAMI
    기술위원회와 연계되어 있다. 2026년은 프린스턴(7월 13–15일), 2027년은 미국 메릴랜드 College Park(8월 2–4일)에서 열린다. 광학·센서·조명 하드웨어부터 물리기반 렌더링과 머신러닝 결합까지 다루는 소규모 전문
    커뮤니티로, 의학·생물학 응용 이미징도 포함한다.
  topics:
    - High-performance imaging
