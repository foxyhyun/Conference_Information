aaic:
  about: 알츠하이머협회(Alzheimer's Association)가 매년 개최하는 세계 최대 치매 과학 학회. 기초과학·바이오마커·임상·돌봄·공중보건을 아우르며 현장과 온라인으로 진행된다. 2027년은 시카고에서 열린다.
  topics:
    - Basic Science and Pathogenesis
