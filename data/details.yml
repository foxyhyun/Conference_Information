kosaim:
  about: >-
    대한의료인공지능학회(KoSAIM)는 2018년 7월 서울아산병원에서 창립공청회·발기인대회를 거쳐 의료계와 공학계가 함께 설립한 의료 인공지능 학회로, 2019년 5월 첫 춘계학회에 전문가 600여 명이 참석했다. 현재는 매년 10월 서울 그랜드
    인터컨티넨탈 파르나스에서 정기학술대회를 개최하며(2025: 10/24~25, 2026: 10/23~24), KoSAIM 2026에는 전년 대비 약 1.5배인 700여 명이 참석했다. 영상의학 중심에서 병리·생체신호(ECG) 등으로 범위가
    넓어지고 있으며 루닛·딥노이드·뷰노 등 의료 AI 기업이 전시에 참여한다.
  topics:
    - 의료 파운데이션 모델 (2026 세션 주제)
    - 에이전틱 AI (2026 세션 주제)
    - 흉부 영상 AI (X-ray/CT, vision-language)
    - 뇌 MRI 분석
    - 디지털 병리 / 세포병리 (AI for Pathology 위성 워크샵)
    - 생체신호(ECG) 분석
    - 병원 AI 도입 사례 (서울아산병원·서울대병원·세브란스 발표)
    - 의료 AI 수가·규제·신뢰성
  features:
    - '초록 접수 부문: 포스터 전시/발표 vs 자유연제 구연발표 선택; 구연 접수분은 심사 후 포스터로 통보될 수 있음 (2025 안내)'
    - 학회 홈페이지 회원가입/로그인 후 행사 페이지 초록접수 메뉴로 온라인 제출; 초록집 게재용 Abstract Template 작성·업로드 필수, 발표자 밑줄 표기
    - 2026년 포스터/자유연제 초록 접수 9/15까지 연장; 2025년 마감 9/12 자정; 2024년 7/15~8/31 23시
    - '위성 세션 운영 (2026: AI for Pathology — 제1회 병리영상연구회 워크샵)'
    - 루닛학술상 등 시상 공고 운영 (2026 신청 마감 6/30)
    - 기업 전시 부스 (루닛, 딥노이드, 뷰노, 에이트릭스, 씨어스테크놀로지, 메디웨일 등)
    - 공식 사이트(kosaim.org)가 자동 fetch를 차단(HTTP 403)하여 세부 양식·분량·언어는 미확인
  typical_schedule: '매년 10월 넷째 주 금~토 2일간 서울 그랜드 인터컨티넨탈 파르나스(2025: 10/24~25, 2026: 10/23~24). 초록 마감 9월 중순(2025: 9/12, 2026: 9/15 연장). 2027 일정 미공개'
  acceptance_rate: null
  sources:
    - https://www.kosaim.org/html/?pmode=BBBS0007100001
    - https://www.kosaim.org/html/?pmode=BBBS0007100001&seq=1163&smode=view
    - https://kosaim.org/html/?pmode=BBBS0007100001&seq=1043&smode=view
    - https://newsway.co.kr/news/view?ud=2026102009380157840
    - https://medicaltimes.com/Users/News/NewsView.html?ID=1171474
    - https://www.medicaltimes.com/Main/view.html?ID=1126525
ksbns:
  about: >-
    사단법인 한국뇌신경과학회(KSBNS)는 1998년 12월 한국신경과학회와 한국신경생물학회가 통합하여 창립된 국내 뇌과학 대표 학회로(2018년 사단법인화), 1999년 6월 제1차 정기학술대회 이후 매년 1회 정기국제학술대회를 개최한다.
    최근에는 'K-Brain'으로 브랜드화되어 2026년 제29회 대회(K-Brain 2026, 9/6~8 대전컨벤션센터)에 20개국 2,500여 명이 참가하는 국내 최대 규모의 뇌과학 국제학술대회로 보도되었다. 신경교세포·시냅스·고등인지·중개의학
    등 10개 분과를 두고 있다.
  topics:
    - Molecular and Cellular Neuroscience
    - Synapses and Circuits Neuroscience
    - Systems and Cognitive Neuroscience
    - Mechanistic, Translational, and Clinical Neuroscience of Brain Disorders
    - Computational Neuroscience, Neuro-Tools and Neuroengineering
    - Others
  features:
    - 초록 전면 영어, 온라인 제출; 제목 250자·본문 2,200자·사사 400자(공백 포함), 그래픽 1개(JPG/PDF 10MB 이하), 1인 1편 제한, 카테고리 2개 지정
    - 발표 유형 Poster / Oral / Invited session 선택; Oral 선정은 Scientific Program Committee 심사로 결정, 미선정 시 포스터 발표 가능; 심사 결과는 채택·거절·수정요청
    - 제출·발표자는 등록비 납부 완료 필수; 공동저자도 개별 등록
    - >-
      수상: KSBNS Outstanding Poster Awards(학생·포닥 회원, 10만원), Scitech Korea Best Oral Presentation Awards(10편, 50만원), IBRO Travel
      Awards(IBRO-APRC 국가 14편, 50만원); 수상 신청 시 extended abstract·research highlights 제출, 폐회식 참석 필수
    - Late-breaking abstract 모집 운영 (2026)
    - 31개 심포지엄, 교육 세션, 유관 학회(대한비만학회·대한파킨슨병및이상운동질환학회·대한뇌자극학회 등) 공동 세션, 보수교육 평점 최대 15점
    - '기조강연 해외 석학 중심 (2026: Ole Kiehn, Masashi Yanagisawa, Jennifer Raymond, Jun Huh); Abstract Book 공개'
  typical_schedule: >-
    매년 9월 초 3일간 개최 (2026: 9/6~8 대전 DCC). 2026 초록 접수 3/16~8/31 23:59 KST, 얼리버드 등록 3/16~6/12. K-Brain 2027 심포지엄 공모 마감 2027-01-10 (2026-11-16
    공지); 2027 본대회 일정·초록 마감은 미공개
  acceptance_rate: null
  sources:
    - https://www.ksbns.org/
    - https://www.ksbns.org/info/history.asp
    - https://ksbns2026.org/
    - https://ksbns2026.org/abstract/
    - https://www.newswire.co.kr/newsRead.php?no=1036298
auto-icpr:
  about: >-
    ICPR(International Conference on Pattern Recognition)은 국제패턴인식학회(IAPR)의 플래그십 학회로, 2024년 콜카타(27회)에 이어 2026년 8월 17-22일 프랑스 리옹에서 28회가 열렸다.
    2024년에 50주년을 맞은 역사 있는 학회이며, 패턴인식·머신러닝·컴퓨터비전·영상/신호처리·생체인식·문서분석·바이오메디컬 이미징 등 6개 트랙으로 구성된다.
  topics:
    - Artificial Intelligence, Pattern Recognition and Machine Learning
    - Computer and Robot Vision
    - Image, Speech, Signal and Video Processing
    - Biometrics and Human Computer Interaction
    - Document Analysis and Recognition
    - Biomedical Imaging and Bioinformatics
  features:
    - 6개 트랙 체제이며 'Biomedical Imaging and Bioinformatics' 트랙이 별도로 있어 의료영상 연구 투고 가능
    - 리뷰는 single-blind (저자명·소속을 원고에 기재해야 함; ICPR 2024·2026 공식 안내 모두 동일)
    - ICPR 2024 기준 Springer LNCS 포맷, 참고문헌 포함 최대 15페이지 (ICPR 2026 페이지 제한은 공식 페이지에서 확인 못함)
    - 보충자료는 선택이며 단일 파일 50MB 이내, 리뷰어 참고용으로만 사용 (ICPR 2026 Instructions)
    - '프로시딩은 Springer 출간 (ICPR 2024: Springer LNCS; ICPR 2026 Proceedings 페이지는 Springer DOI 링크, 본 학회 16권 + 워크숍 5권)'
    - 재현성 연구 배지(Reproducible Research in Pattern Recognition, RRPR Badge) 제도 운영
    - ICPR 2024(콜카타)는 2,106편 투고 중 963편 채택 (Springer LNCS 프로시딩 설명문 기준, 검색 스니펫으로 확인)
  acceptance_rate: '2024: 963 accepted / 2,106 submissions (약 45.7%, Springer LNCS 프로시딩 설명문; 검색 결과 스니펫 기반, 직접 페이지 열람은 못함)'
  sources:
    - https://icpr2026.org/
    - https://icpr2026.org/calls.html
    - https://icpr2026.org/instructions.html
    - https://icpr2026.org/proceedings.html
    - https://iapr.org/archives/icpr2024/cfp.html
