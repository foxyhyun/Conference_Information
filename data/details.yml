    - https://conf.theieie.org/2026f
    - https://conf.theieie.org/2026f/pages/outlines.vm
    - https://conf.theieie.org/2026f/pages/conference_paperinfo.vm
    - https://conf.theieie.org/2026f/pages/conference_paper_announce.vm
    - https://www.koreadaily.com/article/20260626020541632
kosombe:
  about: >-
    대한의용생체공학회(KOSOMBE)는 국내 의공학 분야 대표 학회로, 매년 5월 춘계학술대회(주로 제주, 3일)와 11월 추계학술대회를 개최한다. 2026년 제67회 춘계학술대회(제주 신화월드)에는 교수·연구자·학생 약 1,300명이 참가해 국내
    의용생체공학 분야 최대 규모의 학술 교류의 장으로 소개되었다. 2026년 추계는 KOSOMBE가 IFMBE와 공동 주최하는 국제대회 APCMBE 2026(11/4~7, 대구 EXCO)과 함께 열렸다.
  topics:
    - 뇌공학
    - 생체계측
    - 의료영상 처리 및 시스템
    - 의료인공지능
    - 바이오센서&바이오칩
    - 의광학
    - 생체소재
    - 생체역학 및 의료로봇
    - 의료기기규제과학
    - 바이오반도체
    - 의료초음파
    - 의료데이터분석 및 생체전자시스템 (2026 신설 분과)
    - 의사공학자 / 여성의공학자 (초청 발표만)
  features:
    - '초록 양식: Extended abstract A4 2쪽 (워드 원본 + PDF 압축 업로드, 이메일 접수 불가)'
    - 구두 발표 희망 시 5분 이내 약식 발표 영상(avi/mp4/mov, 100MB 이하) 제출 → 사전심사 탈락 시 포스터로 자동 전환 (2025 춘계 기준); 추계는 학생 경연 Oral/Poster 선택제
    - Oral 발표 및 포스터 세션에서 우수 발표자 선정·시상
    - 발표자(초청·포스터)는 초록 제출 전 연회비 및 사전등록비 온라인 납부 필수
    - 생명과학·생물학 데이터 포함 연구는 IRB/IACUC 승인번호 필요(없으면 심사 제외 가능)
    - 포스터 A0(84.4×118.9cm) 출력(2025 춘계); 추계는 90×120cm 현장 인쇄(2024)
    - 기조강연, 특별세션(식약처 성과공유회 등), 패밀리 세션, 멘토링 세션, 숏츠 콘테스트, 전시부스 운영; 초록집(ebook PDF) 공개
  typical_schedule: >-
    춘계: 매년 5월 둘째 주 목~토 3일간 제주(2025: 5/8~10 롯데호텔, 2026: 5/7~9 신화월드). 초록 마감 4월 초~중순(2025: 4/11→4/18; 2026: 4/3, 포스터 한정 4/10, 채택통보 4/17, 사전등록
    4/17→4/24). 추계: 매년 11월 초(2024: 11/7~9, 초록 마감 10/11; 2025 추계 초록 마감 10/17 연장; 2026은 APCMBE 2026 11/4~7과 통합, 초록 마감 10/8)
  acceptance_rate: null
  sources:
    - https://www.kosombe.or.kr/
    - https://www.kosombe.or.kr/register/2026_spring/main.html
    - https://www.kosombe.or.kr/register/2025_spring/main.html
    - https://www.kosombe.or.kr/register/2025_spring/abstract/info.html
    - https://kosombe.or.kr/register/2024_fall/abstract/info.html
    - https://www.medipharmhealth.co.kr/news/article.html?no=116209
    - https://www.apcmbe2026.org/
osk:
  about: >-
    한국광학회(OSK)는 광학·포토닉스 분야 국내 학회로, 매년 2월 정기총회와 함께 동계학술발표회(최근 부산 벡스코, 광산업전시회 OptoWin 병행)를 열고, 여름에는 하계 학술행사(2026년은 Optics and Photonics
    Congress, OPC 2026, 7월 제주 ICC)를 개최한다. 이와 별도로 포토닉스 분과가 매년 11월 말 분과학술대회 'Photonics Conference(PC)'를 2008년부터 개최하고 있다(2026: 소노캄 여수).
    광과학·광기술·포토닉스·바이오포토닉스·양자광학 등 9개 분과로 초록을 모집한다.
  topics:
    - 광과학 (나노/마이크로 광학, 메타광학 등)
    - 광기술
    - 디지털홀로그래피 및 정보광학
    - 양자전자
    - 포토닉스
    - 바이오포토닉스 (OCT, 내시경 등)
    - 디스플레이
    - 양자광학 및 양자정보
    - 리소그래피
  features:
    - '초록 제출: MS Word/HWP 템플릿, 온라인 제출만 가능(이메일 불가), 발표 언어 국문/영문 선택, 사전등록비 미납 상태에서도 제출 가능 (2027 동계 기준)'
    - '구두: 일반발표 15분(질의응답 포함), 초청 30분, 튜토리얼 90분, 플레너리 45분; 장소 운영에 따라 구두→포스터 전환 가능'
    - 포스터 패널 95×150cm, 세션 시작 후 최소 40분 상주(미상주 시 No Show 처리)
    - 동계학술발표회는 제N회 정기총회와 동시 개최, 광산업전시회 OptoWin 병행
    - 비회원도 사전등록 시 생성한 계정으로 초록 제출 가능
    - 'Photonics Conference(PC)는 분과학술대회로 Program(Oral)/Program(Poster) 구분, 특별세션(2026: 이차전지 레이저노칭) 운영; 포토닉스 분과가 COOC(광전자 및 광통신 학술대회)와 함께 연례 개최'
    - 학회 Young Scientist 지원금은 동·하계학술발표회 등록비에 사용 가능
  typical_schedule: >-
    동계: 매년 2월 초~중순 부산 벡스코 4일간(2026: 2/3~6, 2027: 2/16~19). 초록 접수 10월 중순~12월 중순(2026 동계: 10/20~12/14; 2027 동계: 2026-10-19~12-13), 사전등록 ~1월
    중하순(2027: ~1/25). 하계(OPC 2026): 7/19~22 제주 ICC, 초록 3/30~5/17, 사전등록 ~6/29. Photonics Conference: 매년 11월 마지막 주 3일(2026: 11/25~27 여수), 초록
    마감 10월 중순(2026: 10/16→10/23, 추가 연장 없음), 사전등록 11/6
  acceptance_rate: null
  sources:
