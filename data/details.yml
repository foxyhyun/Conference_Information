    - https://2027.ieeeicassp.org/call-for-papers/
    - https://en.wikipedia.org/wiki/International_Conference_on_Acoustics,_Speech,_and_Signal_Processing
iccp:
  about: >-
    ICCP(IEEE International Conference on Computational Photography)는 2009년부터 매년 열리는 계산 이미징·계산 사진학 전문 학회로, IEEE Computer Society의 PAMI
    기술위원회와 연계되어 있다. 2026년은 프린스턴(7월 13–15일), 2027년은 미국 메릴랜드 College Park(8월 2–4일)에서 열린다. 광학·센서·조명 하드웨어부터 물리기반 렌더링과 머신러닝 결합까지 다루는 소규모 전문
    커뮤니티로, 의학·생물학 응용 이미징도 포함한다.
  topics:
    - High-performance imaging
    - Computational cameras, illumination, and displays
    - Advanced image and video processing
    - Integration of imaging, physics, and machine learning
    - Structured light and time-of-flight imaging
    - Appearance, shape, and illumination capture
    - Computational optics (wavefront coding, digital holography, compressive sensing)
    - Sensor and illumination hardware
    - Imaging models and limits
    - Physics-based, neural, and differentiable rendering
    - 'Applications: mobile imaging, scientific imaging, medicine and biology, AR/VR'
  features:
    - 이중맹검(double-blind) 리뷰 + 1차 리뷰 후 rebuttal(2025 CFP)
    - 단일 심사로 IEEE TPAMI 특집호(완전히 새로운 archival 수준 연구) 또는 ICCP Proceedings 중 하나로 채택 결정(2025 CFP)
    - 두 트랙 채택 논문 모두 구두 발표(2025 CFP)
    - '별도 Posters & Demos 트랙: 기발표 연구·late-breaking 결과 포스터와 동작 시연, 채택 논문에는 포스터 공간 보장(2026)'
    - '투고 마감 연장 없음(2025: 4월 9일 PT 고정)'
    - 학회와 연계된 ICCP Summer School 운영
  acceptance_rate: null
  sources:
    - https://iccp2027.iccp-conference.org/
    - https://iccp2026.iccp-conference.org/
    - https://www.f4news.com/2025/02/24/international-conference-on-computational-photography-iccp-2025-call-for-papers
    - https://www.f4news.com/2026/04/26/iccp-2026-posts-call-for-posters-demos-registrations-open/
pw-bios:
  about: >-
    SPIE Photonics West 안에서 열리는 생의학광학/바이오포토닉스 심포지엄(BiOS)으로, SPIE가 매년 1월 말~2월 초 샌프란시스코 Moscone Center에서 개최한다. Photonics West 전체는 약 24,000명
    참가, 100개 이상 컨퍼런스, 4,500편 이상의 발표(2027 예고 기준) 규모이며, BiOS는 그중 바이오포토닉스·생의학광학·이미징을 다루는 트랙으로 'the most comprehensive biophotonics conference
    in the field'로 소개된다. 2027년 Photonics West는 1월 30일~2월 4일, BiOS Expo는 1월 30~31일이다.
  topics:
    - Neurophotonics, Neurosurgery, and Optogenetics
    - Clinical and Translational Neurophotonics
    - 'Photons Plus Ultrasound: Imaging and Sensing'
    - Multiphoton Microscopy in the Biomedical Sciences
    - Optical Coherence Tomography
    - Therapeutics and Diagnostics
    - Tissue Optics
    - Nanophotonics (biomedical)
    - New imaging modalities
  features:
    - >-
      제출은 초록(abstract)만 - SPIE 2025 플라이어 기준 기술심사용 250단어 초록 + 프로그램용 100단어 요약, 2026 플라이어에서는 200~300단어 기술초록 + 50~150단어 요약으로 변경(검색 스니펫 기준,
      컨퍼런스별로 상이)
    - 채택 후 SPIE Proceedings 원고(manuscript)를 별도 제출하는 구조 - 발표 후 원고 제출, 채택 여부는 컨퍼런스 체어가 결정
    - Photonics West 6개 기술 분야 중 하나이며, BiOS Expo(1월 30~31일)와 Photonics West 전시회(2월 2~4일, 1,400개 이상 출품사)가 병행
    - >-
      신경광학 관련 컨퍼런스가 둘 이상 분리 운영됨 - 'Neurophotonics, Neurosurgery, and Optogenetics'와 'Clinical and Translational Neurophotonics'(2026년 1월
      17~19일 개최 확인)
    - Hot Topics 및 plenary 세션이 주간 중 진행(보도자료 기준)
    - >-
      2027 BiOS 초록 마감일은 접근 가능한 페이지에서 확인 불가(spie.org 차단) - 타 Photonics West 컨퍼런스 LA303은 2026-07-22 마감으로 공개되어 있어 BiOS도 2026년 중반 마감 가능성이 있으나
      미확인
  acceptance_rate: null
  sources:
    - https://via.tt.se/pressmeddelande/4596753/international-optics-and-photonics-community-invited-to-spie-photonics-west-2027?lang=en
    - https://www.laserfocusworld.com/events/event/55389685/spie-the-intl-society-for-optics-photonics-spie-bios-2027
    - https://www.gophotonics.com/events/details/1173-spie-bios-expo-2027
    - https://www.photonics.com/Articles/Photonics-West-Prepares-for-2026-Showcase/p1/a71728
    - https://www.proceedings.com/content/085/085196webtoc.pdf
    - https://www.proceedings.com/content/085/085213webtoc.pdf
    - https://spie.org/documents/cfp-flyers/PW25/BO603call.pdf
    - https://lux.spie.org/conferences-and-exhibitions/photonics-west/presenters/abstract-submission-guidelines
    - https://en.wikipedia.org/wiki/Photonics_West
cleo:
  about: >-
    CLEO(Conference on Lasers and Electro-Optics)는 Optica, IEEE Photonics Society, American Physical Society가 공동 후원하는 레이저·전기광학 분야의 대표 국제학회로
    매년 5월 미국에서 열린다. 29개 토픽 카테고리에 걸쳐 2,000편 이상의 기술 발표가 이루어지며, 기초과학부터 산업 응용까지 포괄한다. 2027년은 5월 2~7일 Long Beach Convention Center(캘리포니아)에서 개최되고
    전시회는 5월 4~5일이다.
  topics:
    - Fundamental Science
    - Science & Innovations
    - Applications & Technology
    - Quantum computing / quantum technologies
    - Advanced imaging technologies
    - Laser science
    - Photonics / electro-optic technologies
  features:
    - '제출 형식: 35단어 초록 + 2페이지 요약(summary), 요약은 채택 시 Technical Digest에 수록(CLEO 제출 안내 페이지 스니펫 기준)'
    - '''comprehensive, peer-reviewed'' 기술 세션 - 2026년 프로그램위원회가 ''thousands of submitted abstracts''를 심사했다고 IEEE Photonics Society가 발표'
    - Postdeadline paper 제도 있음 - 'strictly oral'(스니펫 기준)
    - 세 개의 핵심 영역(Fundamental Science / Science & Innovations / Applications & Technology)으로 초청 연사와 프로그램이 구성됨
    - Technical Conference(5/2~7)와 별도로 2일간 전시회(5/4~5) 병행
    - '2027 제출 마감: 공식 사이트에서는 ''Now Accepting Submissions''만 확인, 집계 사이트(cantonfair.net)에서 2026-11-23으로 표기 - 공식 확인 필요'
  acceptance_rate: null
  sources:
    - https://www.cleoconference.org/
    - https://www.cleoconference.org/home/about/
    - https://www.cleoconference.org/home/submissions/submit-electronically
    - https://ieeephotonics.org/announcements/cleo-2026-promotes-breakthroughs-in-research-and-applied-innovations/
    - https://cantonfair.net/event/34302-cleo-conference-and-exhibition
optica-biophotonics:
  about: >-
    Optica Biophotonics Congress는 Optica(구 OSA)가 매년 4월 미국에서 개최하는 바이오포토닉스 전 분야 학회로, 과거 Optica의 Biomedical Optics(BIOMED) 및 Optics in Life
    Sciences 미팅의 주제들을 하나의 통합 프로그램으로 묶은 것이다. 'a leading international forum covering the full spectrum of biophotonics'로 소개되며 기술 세션, 산업 패널,
    포스터, postdeadline 논문, 네트워킹으로 구성된다. 2027년은 4월 18~21일 덴버(Embassy Suites by Hilton Denver Downtown), 2026년은 4월 26~29일 포트로더데일에서 열렸다.
  topics:
