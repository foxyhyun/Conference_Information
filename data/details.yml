ieie:
  about: >-
    대한전자공학회(IEIE, 2026년 창립 80주년)가 주최·주관하는 국내 전자공학 종합학술대회로, 매년 6월 하계종합학술대회(제주 롯데호텔, 4일)와 11월 추계학술대회(2일)를 개최한다. 통신·반도체·컴퓨터·인공지능 신호처리·시스템 및
    제어·산업전자 6개 소사이어티 산하 연구회별로 논문을 모집하며, 2026 하계대회는 논문 1,400여 편·참가자 3,000여 명 규모로 보도되었다.
  topics:
    - 통신 (통신, 미래지능형네트워크, 마이크로파 및 전파전파, ITS, 군사 전자, 무선PAN/BAN)
    - 반도체 (반도체소자 및 재료, 광파 및 양자전자공학, SoC 설계, RF 집적회로, 인 메모리 컴퓨팅, 이미지센서 등)
    - 컴퓨터 (멀티미디어, 휴먼ICT, 인공지능/신경망/퍼지, M2M/IoT, AI 응용, 블록체인 등)
    - 인공지능 신호처리 (음향 및 음성신호처리, 영상이해, 영상처리, 바이오영상신호처리, 딥러닝, 로봇지능, 가상융합)
    - 시스템 및 제어 (제어계측, 의용전자 및 생체공학, 지능로봇, 의료영상시스템, 자동차전자, 인공지능 전환(AX) 등)
    - 산업전자 (산업전자제어, 임베디드시스템, 유비쿼터스 센서네트워크, 디지털통신시스템)
    - New Emerging Area (바이오메디컬연구회, 의료, 에너지, Software, 기타)
  features:
    - '논문 분량: Double Column 1쪽 이상 5쪽 이내, 학회 학술대회 양식(docx/hwp); 홈페이지 업로드 접수'
    - 일반세션·특별세션(연구회 제안)·최우수논문상 트랙으로 구분 접수
    - '최우수논문상: 주저자가 국내 대학(원) 재학 학생회원; 별도 4쪽 논문지 양식 블라인드 서면심사 + 일반세션 구두발표 심사 합산; 총상금 500만원(최우수 1편 300만원, 우수 2편 각 100만원, 삼성전자 후원)'
    - 학부생 논문경진대회, My Chip 경진대회, 인공지능 학부생 논문 경진대회 병행
    - 구두 발표 10~15분(질의응답 포함, USB 지참); 포스터 패널 100×180cm, 저자 1인 상주 필수
    - 기조강연, Invited Talk, 튜토리얼, 특별세션, Young Leaders' Symposium(YLS), 전시부스 운영
    - 하계대회는 지부 학술활동 및 AI 융합기술 세션 포함
  typical_schedule: >-
    하계: 매년 6월 넷째 주 4일간 제주 롯데호텔(2026: 6/23~26), 논문 마감 5월 초~중순(2026: 일반/특별세션 5/8→5/22 17:00, 최우수논문상 5/8→5/15), 심사통보 5/22, 사전등록 6/7. 추계: 매년 11월
    말 2일간(2026: 11/27~28 곤지암리조트), 논문 마감 10월 중순~말(2026: 10/19→10/26), 심사통보 10/30, 사전등록 11/16
  acceptance_rate: null
  sources:
