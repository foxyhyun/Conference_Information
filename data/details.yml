    - https://lux.spie.org/conferences-and-exhibitions/european-conferences-on-biomedical-optics/programme/conferences
spie-optics-photonics:
  about: >-
    SPIE Optics + Photonics는 SPIE가 매년 8월 샌디에이고 컨벤션센터에서 개최하는 북미 최대의 다학제 광학·포토닉스 학회('the largest international, multidisciplinary optical
    sciences and technology meeting in North America')로, 기술 프로그램·산업 전시회·네트워킹으로 구성된다. 제3자 집계에서는 참가자 약 4,000명 규모로 나타난다. 광공학, 나노포토닉스, 양자기술, 유기
    포토닉스, 천문 계측 등을 폭넓게 다루며 생의학광학은 주요 트랙이 아니다.
  topics:
    - Nanoscience + Engineering (Applications)
    - Optical Engineering + Applications
    - Organic Photonics + Electronics
    - Nano-photonics
    - Quantum technologies / quantum science
    - Imaging
    - Astronomical instrumentation
  features:
    - 세 개의 프로그램(Nanoscience + Engineering / Optical Engineering + Applications / Organic Photonics + Electronics)으로 구성(검색 결과 기준)
    - SPIE 방식의 초록 제출 후 SPIE Proceedings 원고 제출 구조(Photonics West와 동일 체계로 추정되나 O+P 2027 공식 안내는 접근 불가)
    - 산업 전시회 병행 - 2026년 전시는 8월 25~27일(제3자 목록 기준)
    - 2027년 샌디에이고 개최 예정이나 날짜 'TBD', 초록 마감 미공개(2025년은 5월 7일 마감이었음)
    - 2026년 개최일은 자료마다 상이(8/17~21 vs 8/23~27) - 공식 확인 필요
  acceptance_rate: null
