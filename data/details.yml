  features:
    - '제출 형식: 35단어 초록 + 2페이지 요약(summary), 요약은 Technical Digest로 Optica Publishing Group 플랫폼에 게재(Ei Compendex, Scopus, Google Scholar 색인)'
    - '''All paper submissions are carefully peer-reviewed'' - 발표 유형은 Oral Only / Poster Only / Oral or Poster Acceptable 중 선택, 최종 결정은 위원회'
    - '2027 마감: 2026-12-08 12:00 미동부시간(UTC-5), 마감 후 수정 불가'
    - 신경광학 커뮤니티는 'Optics and the Brain' 카테고리(과거 BRAIN 토피컬 미팅)로 참여 - 10개 세부 주제가 공식 카테고리에 명시
    - 2026년까지는 Translational / Microscopy / OCT / OT&S / Brain 5개 토피컬 미팅 체제였고 2027년부터 6개 토픽 카테고리 체제로 재편
    - 발표 녹화는 종료 후 최대 60일간 Optica 웹사이트에 공개, postdeadline papers 세션 포함
  acceptance_rate: null
  sources:
    - https://www.optica.org/events/congress/biophotonics_congress/about/
    - https://www.optica.org/events/congress/biophotonics_congress/submit_papers/
    - https://www.optica.org/events/congress/biophotonics_congress/program/topic_categories/
ecbo:
  about: >-
    European Conferences on Biomedical Optics(ECBO)는 Optica와 SPIE가 공동 후원하는 유럽 최대 생의학광학 학회로, 2년마다(홀수 해 6월) 뮌헨 ICM에서 열리는 World of Photonics
    Congress의 일부로 개최되며 LASER World of PHOTONICS 전시회와 병행된다. 광학·포토닉스를 의료 및 생의학 문제에 적용하는 연구자·엔지니어·임상의가 모이며, 2027년은 6월 20~24일 뮌헨에서 열린다. World of
    Photonics Congress 2025 전체는 참가자 3,500명, 구두·포스터 발표 2,670편 규모였다.
  topics:
    - 'ECBO 1: Translational Biophotonics: Diagnostics and Therapeutics'
    - 'ECBO 2: Diffuse Optical Spectroscopy and Imaging'
    - 'ECBO 3: Optical Systems for Mechanical and Biophysical Investigation (OMBI)'
    - 'ECBO 4: Advances in Microscopic Imaging'
    - 'ECBO 5: Optoacoustic Methods and Applications in Biophotonics'
    - 'ECBO 6: Optical Coherence Imaging Techniques and Imaging in Scattering Media'
  features:
    - '2년 주기(biennial) - World of Photonics Congress(2027: 6/20~25)와 LASER World of PHOTONICS 전시회(2027: 6/22~25)와 동시 개최'
    - '2027 초록 마감: 2027-01-27 23:55 미동부시간(UTC-5) (Optica 제출 페이지 기준)'
    - >-
      Optica와 SPIE 공동 후원 - 발표 논문은 SPIE Digital Library와 Optica Publishing Group 양쪽에 게재(SPIE 안내 스니펫 기준), Optica 측에서는 'Technical Digest
      papers'로 제공
    - 6개 서브컨퍼런스(ECBO 1~6) 체제(2025년 기준 토픽 목록) - 확산광 분광/이미징(ECBO 2), 광음향(ECBO 5) 등 신경광학 관련 트랙 포함
    - 같은 Congress 안에 CLEO/Europe-EQEC, Optical Metrology, Digital Optical Technologies, LiM 등이 함께 열려 교차 참석 가능
  acceptance_rate: null
  sources:
    - https://www.optica.org/events/topical_meetings/european_conferences_biomedical_optics/about/
    - https://optica.org/events/topical_meetings/european_conferences_biomedical_optics/program/scope_and_topics/
    - https://www.optica.org/events/topical_meetings/european_conferences_biomedical_optics/submit_papers/
    - https://world-of-photonics.com/en/congress
    - https://lux.spie.org/conferences-and-exhibitions/european-conferences-on-biomedical-optics/programme/conferences
sfn:
  about: >-
    Society for Neuroscience(SfN, 1969년 설립, 회원 약 3만 5천~3만 7천 명)가 매년 10~11월 미국 주요 도시에서 개최하는 세계 최대 신경과학 학회 'Neuroscience 20xx'이다. 2024년 시카고 대회
    참가자는 22,359명이었다. 2026년 대회는 11월 14~18일 워싱턴 D.C. Walter E. Washington Convention Center에서 열리며, 11월 5일~12월 20일 가상 구성요소가 병행된다.
  topics:
    - 'Theme A: Development'
    - 'Theme B: Neural Excitability, Synapses, and Glia'
    - 'Theme C: Neural Aging and Degeneration'
    - 'Theme D: Neuroimmunity, Neurovasculature, and Neural Injury'
    - 'Theme E: Sensory Systems'
    - 'Theme F: Motor Systems'
    - 'Theme G: Integrative Physiology and Behavior'
    - 'Theme H: Motivation and Emotion'
    - 'Theme I: Cognition'
    - 'Theme J: Techniques'
    - 'Theme K: History, Education, and Society'
  features:
    - '초록(abstract)만 제출, 정규 초록 접수 기간은 짧음(2026: 5/27~6/10 오후 5시 EDT), 늦은 초록(late-breaking)은 9/8~15 또는 2,500편 상한 도달 시까지'
    - SfN 정회원이 제출자(submitting author)로 서명해야 하며, 1인은 과학 초록 1편 + Theme K 초록 1편에만 발표자(presenting author)로 참여 가능
    - '초록당 환불 불가 수수료: 정규 $175, late-breaking $260'
    - '발표 형식: Nanosymposium(구두), Poster, Theme K Poster - 정규 초록은 채택 총수 상한 없음, 규칙 위반 시 Program Committee가 거절'
    - 광학 신경영상·neurophotonics 연구는 주로 Theme J(Techniques) 또는 해당 생물학 주제 테마로 제출
    - 대규모 산업 전시회 병행(Exhibitor Prospectus 운영)
  acceptance_rate: null
  sources:
    - https://www.sfn.org/meetings/neuroscience-2026
    - https://www.sfn.org/meetings/neuroscience-2026/call-for-abstracts
    - https://www.sfn.org/meetings/neuroscience-2026/call-for-abstracts/rules-for-abstract-submissions
    - https://www.sfn.org/meetings/neuroscience-2026/themes-and-topics
    - https://en.wikipedia.org/wiki/Society_for_Neuroscience
ohbm:
  about: >-
    Organization for Human Brain Mapping(OHBM, 1995년 파리에서 설립)은 인간 뇌의 해부학적·기능적 조직을 연구하는 뉴로이미징 학회로, 매년 6월 대륙을 바꾸며 연례 학술대회를 연다(최근 참가자 약
    2,500~3,000명). 2026년은 6월 14~18일 프랑스 보르도, 2027년은 6월 26~30일 캐나다 토론토 Metro Toronto Convention Centre에서 개최된다. 신경과·정신과 임상의부터 물리·공학·소프트웨어·통계
    분야까지 회원이 분포한다.
  topics:
    - Poster Abstracts
    - Symposia
    - Educational Courses
    - Roundtable Discussions
    - Registered Reports (new for 2027)
    - SIG, Chapter, and Committee Activities
  features:
    - 초록 650단어 상한(Introduction/Methods/Results/Conclusion 4개 섹션 필수, 그림 캡션 포함), 그림 최대 2개(각 2MB)
    - 일반 투고는 'Poster Abstracts' 카테고리 - 구두 발표는 Symposia 등 별도 제안 형태, 참여는 Educational Course 1개 + 과학 세션 1개로 제한
    - 초록 제출 수수료 $45(환불 불가), UNESCO 기준 적격 국가 제출자는 면제 가능; 발표자는 현장 참가 의무
    - '2027 일정: 11/2/2026 제출 개시 - 12/14/2026 마감 - 2027년 2월 채택 통보 - 2027년 1월 등록 개시'
    - 2027년부터 Registered Reports 신설(Stage 1 통보 2027-01-15, 최종 결정 2027-05-07)
    - OHBM 자체 출판 플랫폼 Aperture Neuro 운영, 한국 챕터(Korea Chapter) 존재
  acceptance_rate: null
  sources:
    - https://humanbrainmapping.org/ohbm-2027/
    - https://humanbrainmapping.org/ohbm-annual-meeting-faq/
    - https://www.humanbrainmapping.org/
    - https://en.wikipedia.org/wiki/Organization_for_Human_Brain_Mapping
fom:
  about: >-
    Focus on Microscopy(FOM)는 1988년 시작된 광학현미경 분야의 연례 국제학회로, 네덜란드의 FOM foundation이 현지 기관과 공동으로 매년 부활절 직전 주에 개최지를 바꾸며 연다(2025 타이베이, 2026 스톡홀름,
    2027 오사카). 컨포컬·다광자 현미경의 3차원 영상 기술에서 출발해 초고해상도, 광시트, 적응광학, AI 등 현미경 혁신 전반을 다루며, 개발자와 사용자가 만나는 장으로 기술 전시회가 함께 열린다.
  topics:
    - Theory and practice of confocal and multiphoton-excitation microscopy
    - Super-resolution microscopy
    - AI in microscopy
    - 3D and 4D live cell and tissue imaging
    - Adaptive optics for microscopy
    - Light sheet microscopy
    - Phase/interference based microscopies
    - OCT, holography, endoscopy
    - 'Advanced fluorescence imaging/spectroscopy: FRET, FRAP, FLIM, FCS, SOFI'
    - New fluorescent probes, proteins, quantum dots, single molecule imaging
    - Clearing and expansion techniques
    - 'Coherent non-linear microscopies: SHG, THG, SFG, CARS'
    - Multi-dimensional fluorescence and Raman spectroscopy imaging
    - Fast acquisition, automated and high-content microscopy
    - 3D image processing and visualization for multidimensional data
  features:
    - 1페이지 PDF 초록 제출(2004년 이후 모든 1페이지 초록이 온라인 FOM 아카이브에 영구 보존·검색 가능), 별도 proceedings 없음
    - 20분 구두 발표 또는 포스터 선택 요청 가능하나 'Oral presentations can not be guaranteed' - 초록선정위원회와 조직위가 최종 결정, 2027년은 2월 초 통보
    - 연례 개최, 매년 개최지 변경(부활절 전 주), FOM foundation + 현지 학회/대학 공동 조직
    - '플레너리 40분·병렬 세션 20분(토론 포함), 포스터 세션 2회(2027: 3/22, 3/23), 과거 flash poster 발표 운영'
    - 현미경 기업 기술 전시회 동반('accompanied by a technical exhibition'), 2027 메인 스폰서 Nikon
  acceptance_rate: null
  sources:
    - https://www.focusonmicroscopy.org/
    - https://www.focusonmicroscopy.org/2027-submit/?event_id=11725
    - https://www.focusonmicroscopy.org/2027-about/?event_id=11725
    - https://www.becker-hickl.com/events/focus-on-microscopy-2026/
optica-imaging:
  about: >-
    Optica Imaging Congress(구 Imaging and Applied Optics Congress)는 2027년부터 'Optica ImageSense Congress'로 명칭을 바꿔 Optica가 매년 7월 개최하는 이미징·센싱
    통합 학회로, COSI(Computational Optical Sensing and Imaging), DH(Digital Holography), 3D, AO, IS 등 14개 토피컬 미팅을 한 자리에 모은다. 'showcases
    breakthroughs in image acquisition, processing and display'를 표방하며 계산 이미징, 뉴로모픽 이미징, AR/VR, 광센서를 다룬다. 2026년은 7월 12~17일 마스트리흐트, 2027년은 7월
    11~15일 캐나다 오타와(The Westin Ottawa)에서 열린다.
  topics:
    - 'COSI: Computational Optical Sensing and Imaging'
    - 'DH: Digital Holography and 3-D Imaging (standalone in alternating years)'
    - '3D: 3D Image Acquisition and Display'
    - 'AO: Adaptive Optics'
    - 'IS: Imaging Systems and Applications'
    - 'pcAOP: Propagation through and Characterization of Atmospheric and Oceanic Phenomena'
    - 'QSM: Quantum Sensing and Metrology'
    - 'HISE: Hyperspectral Imaging and Sounding of the Environment'
    - 'AIS: Applied Industrial Spectroscopy'
    - 'FTS: Fourier Transform Spectroscopy'
    - 'LACSEA: Laser Applications to Chemical, Security and Environmental Analysis'
    - Optical Sensors / ES / RadIT
    - 'Category: Photonic and Biological/Biomedical Sensing and Imaging'
    - 'Subtopic: 2D/3D Computational Microscopy, Tomography and Endoscopy'
  features:
    - '제출 형식: 35단어 초록 + 2페이지 요약, 요약은 Technical Digest로 Optica Publishing Group에 게재(Ei Compendex, Scopus, Google Scholar 색인)'
    - '''All paper submissions are carefully peer-reviewed'' - Oral Only / Poster Only / Oral or Poster 선택, 위원회 최종 결정'
    - '2027 마감: 2027-03-09 12:00 미동부시간(UTC-5), 마감 후 수정 불가'
    - >-
      9개 토픽 카테고리 중 'Photonic and Biological/Biomedical Sensing and Imaging'과 'Computational Imaging Techniques'(계산 현미경·토모그래피 포함)가 신경광학 연구에
      해당
    - 토피컬 미팅별 학생 논문 경진(3~4명 결선, 제출 시 opt-in)
    - COSI 연계 저널 특집호 운영(Applied Optics / Biomedical Optics Express / Optics Express, 2026 특집호 마감 2026-11-30)
  acceptance_rate: null
  sources:
    - https://www.optica.org/events/congress/optica_imagesense_congress/
    - https://www.optica.org/events/congress/optica_imagesense_congress/about/
    - https://www.optica.org/events/congress/optica_imagesense_congress/submit_papers/
    - https://www.optica.org/events/congress/optica_imagesense_congress/program/topic_categories/
    - https://opg.optica.org/content/feature/announcement/item/boe-cosi2026
kccv:
  about: >-
    KCCV(Korean Conference on Computer Vision)는 사단법인 한국컴퓨터비전학회(KCVS)가 주최하는 국내 컴퓨터비전 분야 대표 학술대회로, 2014년 첫 개최 후 2025년에 12회를 맞았다. 매년 여름(8월 초)
    1회 개최되며, CVPR·ICCV·NeurIPS·ICLR 등 최상위 국제학회에서 성과를 발표한 국내 연구자를 초청해 구두·포스터 발표를 진행하는 형식이 중심이다. 2026년(부산 벡스코)에는 약 170편 발표, 1,300명 이상 참가가 예상되어
    역대 최대 규모로 안내되었다.
  topics:
    - 컴퓨터비전 전반 (CVPR·ICCV·ECCV·NeurIPS·ICLR 등 최상위 학회 발표 성과 중심)
    - Privacy & Safety (2026 구두 세션명)
    - Diffusion Models (2026 구두 세션명)
    - 3D 비전 (2026 기조·초청연사 Matthias Nießner, Angela Dai 전공 분야 — 공식 분야 목록은 미확인)
  features:
    - 별도 공개 논문모집(CFP) 문서를 공식 사이트에서 확인하지 못함. 공식 안내는 '최상위 국제학회에 성과를 발표한 국내 연구자를 초청하여 구두 및 포스터 발표'로 기술됨 (이미 출판된 논문의 재발표 형식)
    - 메인 컨퍼런스 3일 + 별도 온라인(virtual only) 워크숍/튜토리얼 1일 구성
    - Doctoral Colloquium(박사과정 세션), 멘토링 세션, 스폰서 전시·채용 부스 운영
    - 2026년 학생 포스터 발표 기회가 크게 확대되었다고 공식 안내
    - '기조강연은 해외 연사 영어 발표 (2026: René Vidal, Matthias Nießner, Angela Yao)'
    - '등록비(2026, 사전/현장): 일반 36만/40만원, 대학원생 26만/30만원, 학부생 20만/20만원'
    - 주최 학회 KCVS는 IPIU 워크샵도 주관하며 연 2회 '연구자 포럼'도 운영
  typical_schedule: >-
    매년 8월 초 3일간 개최 (2025: 8/4~6 부산 벡스코, 2026: 8/3~5 부산 벡스코). 2026년 사전등록 마감 7/30. 논문·포스터 신청 마감 패턴은 공식 페이지에서 확인 불가. 2027년 일정 미공개(2026-11-17
    기준)
  acceptance_rate: null
  sources:
    - https://kcvs.kr/?act=info.workshop&pseq=9
    - https://kcvs.kr/?act=info.workshop&pseq=8
    - http://kcvs.kr/
    - https://kcvs.kr/?act=board&bbs_code=news-notice
ipiu:
  about: >-
    IPIU(영상처리 및 이해에 관한 워크샵)는 1989년에 시작되어 2027년 제39회를 맞는 국내 영상처리·컴퓨터비전 분야의 장수 워크샵이다. 한국컴퓨터비전학회(KCVS)가 주관하고
    한국방송미디어공학회·대한전자공학회·한국정보과학회·한국멀티미디어학회·한국통신학회가 공동 주최하며, 매년 2월 제주에서 1회 개최된다. 학계·산업계 연구자와 학생이 함께 모이며 한화·삼성·LG AI연구원·퀄컴 등 다수 기업이 후원한다.
  topics:
    - 영상처리
    - 영상이해
    - 패턴인식
    - 영상부호화
    - 영상처리용 S/W
    - 컴퓨터비전
    - 기계학습
    - 의료영상
    - 멀티미디어 통신
    - 멀티미디어응용
    - 문자인식 및 관련분야
  features:
    - 논문 분량 2~6쪽, 국문 또는 영문 작성 가능 (아래아한글/MS Word 양식 및 Overleaf LaTeX 템플릿 제공)
    - 구두 및 포스터 발표 중심 프로그램; 심사 결과 통보 후 최종 수정 논문 제출
    - 신진연구자 세션(2027년 4개 세션), 특별강연·초청강연 운영
    - 'Doctoral Consortium: 신규 박사 또는 박사학위 취득 예정자 대상 별도 모집'
    - Platinum~Startup 등급의 다수 산업체 후원 및 채용 홍보 (한화비전, 삼성, LG AI Research, Qualcomm 등)
    - IPIU 2026 Proceedings 및 프로그램북을 공지사항에 게시 (DBpia 등재 여부는 미확인)
    - 저자 등록 마감이 일반 사전등록보다 1주 빠름
