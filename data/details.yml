ksc:
  about: >-
    KSC(한국소프트웨어종합학술대회)는 한국정보과학회(KIISE)가 주최하는 연말 종합학술대회로, 매년 12월 중하순 3~4일간 개최된다(6월 KCC와 함께 연 2회). 2025년은 '여수엑스포컨벤션센터', 2026년은 '범용인공지능 시대를 여는
    클라우드와 소프트웨어 혁신'을 주제로 경주화백컨벤션센터에서 열린다. 23개 모집분야에 일반논문과 학부생/주니어논문을 접수하며, 학회 주관 논문발표·튜토리얼·특별세션과 분과·산학연 워크숍이 함께 진행된다.
  topics:
    - 고성능컴퓨팅
    - 국방소프트웨어
    - 데이터베이스
    - 모바일응용및시스템
    - 사물인터넷
    - 소프트웨어공학
    - 스마트시티
    - 알고리즘
    - 언어공학
    - 오픈소스소프트웨어
    - 인공지능 응용 (포스터 발표만, 최우수·우수논문상 제외)
    - 인공지능 이론
    - (이상 포함 총 23개 분야 — KSC 2025 일반논문 안내 기준)
  features:
    - 심사용 논문 2~3쪽, 저자정보·사사 제외한 블라인드 PDF 제출(한글/MS Word 양식); 채택 후 출판용 양식으로 최종본 재제출
    - 학회 심사기준에 따라 심사되며 미채택 가능; Oral/Poster 배정은 프로그램위원회가 결정(Oral 신청도 Poster 채택 가능)
    - Oral 세션 투고 논문만 우수논문상 심사 대상; 우수발표논문은 논문지 게재 추천
    - '학부생/주니어논문: 모든 저자 고등학생 이상, 제1저자 학부생→학부생논문·고등학생→주니어논문, Poster만 신청 가능; 서면심사+현장발표 합산으로 최우수상·우수상·장려상 시상'
    - 구두 15분(질의응답 포함), 포스터 보드 1×2m, 포스터 발표 5~7분; 미발표(no show) 시 게재 취소
    - 논문 1편당 발표자 1인 참가등록 필수(여러 편이면 편수만큼 등록); 미등록 시 논문집·온라인 게재 제외 가능
    - 기조강연·초청강연·Top Conference 세션·신진연구자 세션·홍보부스 운영, 다수 기업 후원(카카오, SK브로드밴드, 파두 등)
  typical_schedule: >-
    매년 12월 중하순 개최 (2025: 12/16~19 여수, 2026: 12/21~23 경주). 논문 마감 10월 말(2025: 10/27→10/30 연장; 2026: CFP 9/4 게시, 10/19→10/26 연장), 심사결과 11월
    중순(2025: 11/14), 최종본·발표자 등록 11월 말(2025: 11/24)
