    논문 600여 편, 워크숍 18개(경북매일 보도). 12개 연구회 중 '방사선 방호', '방사선 이용 및 기기', '원자력계측제어·인간공학 및 자동원격' 연구회가 방사선 계측 관련 세션을 운영. 2027 춘계 일정은 미공지(2026 추계 공문에
    '우수논문은 2027 춘계에서 시상' 언급만 있음).
  topics:
    - 방사선 방호
    - 방사선 이용 및 기기
    - 원자력계측제어, 인간공학 및 자동원격
    - 원자력안전
    - 핵연료 및 원자력재료
    - 원자력 열수력
    - 원자력 정책, 인력 및 협력
  features:
    - 논문 제출 시 발표언어(한국어/영어) 선택; 채택 논문은 등록비 필수 납부
    - 2026 추계 논문 마감 2026-08-20(목) 24:00(학회 공문 제2026-226호)
    - 학술발표회 논문집(ISSN 3140-1864) 온라인 게재; 우수논문 선정 후 다음 학술발표회에서 시상
    - 연구회 주관 워크숍·강습회 다수(2026 추계 18개); 2025 추계 '원자력 인공지능 강습회', 2026 춘계 '중대사고 연구와 AI 연구의 융합' 워크숍
    - 2026년은 ICRS15 개최로 춘·추계 '방사선 방호 연구회' 발표 세션 미운영
