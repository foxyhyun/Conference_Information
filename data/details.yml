kda:
  about: >-
    대한치매학회가 매년 춘계(4월)·추계(11월) 학술대회를 개최하며, 국제학술대회 IC-KDA(2025년 ASAD와 공동)도 별도로 열림. 2026 추계는 11.14(토) 과학기술컨벤션센터(서울)에서 '혈액 생물표지자부터 CU, 환자 중심
    정책까지'를 주제로 개최. 2027 일정은 아직 미공지.
  topics:
    - Basic Science and Pathogenesis
    - Genetics
    - Human neuropathology
    - Molecular and Cell Biology
    - Biomarkers (Neuroimaging, Fluid, Digital)
    - Multi-modal comparisons
    - Prognostic utility
    - Clinical Manifestations / BPSD
    - Behavioral Neurology
    - Neuropsychological assessment
    - Dementia Care
    - Pharmacological & Non-pharmacological treatment (anti-amyloid, anti-tau)
    - Risk factors, Public health and Epidemiology
    - Prevention
    - Health service
  features:
    - 구연·포스터(증례 포함) 공모, 치매 관련 주제
    - 구연 신청도 심사 결과에 따라 포스터로 전환될 수 있음
    - 학회 학술대회 홈페이지를 통한 온라인 접수만 가능
    - '2026 추계: 초록 마감 10.11, 사전등록 마감 11.1 (대회 약 1개월 전)'
  acceptance_rate: null
  sources:
    - https://www.dementia.or.kr/workshop/convention/202609/abstract/
    - https://www.dementia.or.kr/workshop/convention/202609/
    - https://www.dementia.or.kr/bbs/?code=schedule
ksmcb:
  about: >-
    한국분자·세포생물학회는 가을 정기학술대회(국제학술대회 ICKSMCB, 2026: 10.5-8 대전컨벤션센터, 영어)와 겨울 동계학술대회를 개최. 다음 행사는 2027 동계학술대회(1.4-6, 용평리조트)이며, 정기학술대회 ICKSMCB
    2027은 아직 미공지.
  topics:
    - Aging
    - Biochemistry
    - Biotechnology (incl. Bioimaging)
    - Cancer Biology
    - Cell Cycle and Cell Death
    - Cell Signaling
    - Intracellular Compartments and Architecture
    - Computational and Systems Biology
    - Developmental Biology
    - Drug Discovery and Translational Medicine
    - Genetics and Genome Biology
    - Immunology
    - Metabolism
    - Microbiology
    - Neuroscience
    - Plant Science
    - Proteostasis
    - RNA Biology
    - Stem Cell and Regeneration
  features:
    - 초록 영문 1,200자 이내(구두 연사 1,500자), 등록자만 제출 가능
    - 포스터 제출자 중 선정자는 Data Blitz 세션(2분) 발표, 3만원 상품권
    - Young Investigator 선정 시 YI Session 발표·상금 10만원; 우수포스터상 상금 10만원
    - 11.26까지 제출분만 인쇄 초록집 수록, 이후는 웹 PDF만
    - 'ICKSMCB: 영문 초록 1,200자·키워드 5개 이상, Travel Grant·YI·Excellent Poster Award 운영'
  acceptance_rate: null
  sources:
    - https://www.ksmcb.or.kr/abstract/2027_winter/info.html
    - https://www.ksmcb.or.kr/abstract/2027_winter/green/info.html
    - https://www.ksmcb.or.kr/icksmcb2026/about/sub03.html
    - https://www.ksmcb.or.kr/icksmcb2026/program/sub06.html
kspain:
  about: >-
    대한통증학회(1985년 창립)가 개최하는 연례 학술대회. KPS 2026은 2026.11.20-22 코엑스 마곡에서 열리며(20일은 해외 참가자 대상 International Workshop), 공식 언어 영어, 약 20개국 800명(국내
    600·해외 200), 포스터 100편, 70개사 100부스 규모. 2027 대회는 아직 미공지.
  topics:
    - Pain Research (Animal, Neuroscience, Big Data, Epidemiology)
    - Cancer Pain & Postoperative Pain
    - Neuropathic Pain, CRPS, and Dysfunctional Pain
    - Spinal Pain
    - Headache & Facial Pain
    - Interventions
    - Diagnosis
    - Ultrasound
    - Complications & Pharmacology
    - Miscellaneous Issues
  features:
    - '영문 초록: Background/Methods/Results/Conclusion, 2,880 bytes(증례 2,400 bytes), 참고문헌·그림/표 각 최대 2개'
    - 제출 전 학술대회 등록 필수
    - 채택 초록 중 일부는 심사 후 S-Poster로 발표
    - 해외 참가자 초록 채택 시 등록비 면제
    - '프로그램: Workshop, Symposium, Clinical/Morning Sessions, Poster, Gala Dinner'
  acceptance_rate: null
  sources:
    - https://www.painfree.or.kr/abstract/2026_fall/eng/Congress_Overview.php
    - https://www.painfree.or.kr/abstract/2026_fall/eng/green/info.html
    - https://www.painfree.or.kr/abstract/2026_fall/eng/intro.php
ksbb:
  about: >-
    한국생물공학회(1984년 설립, 활성 회원 1만 명 이상, 10개 부문위원회·10개 지부)가 매년 춘계(4월)·추계(9~10월) 학술발표대회 및 국제심포지엄을 개최. 2026 춘계는 여수엑스포(4.8-10), 추계는
    제주ICC(9.30-10.2). 2027 춘계는 아직 미공지.
  topics:
    - Antibody Engineering and Cell Culture Engineering
    - Bio-based Chemicals and Cosmetic Bioengineering
    - Biomedical and Biopharmaceutical Engineering
    - Energy and Environmental Biotechnology
    - Food Biotechnology
    - Microbial and Bioprocess Engineering
    - Nano-Bioengineering
    - Protein and Enzyme Engineering
    - Synthetic Biology and Metabolic Engineering
    - Tissue Engineering and Biomaterial Engineering
    - Gene and Cell Therapy
    - AI-X session
  features:
    - 영문 초록 1,200자 이내, 키워드 3개 이상, 온라인 제출
    - 제출한 초록은 Abstract Book에 게재(교정 없음)
    - '발표: 부문별 Division Session, 신진 박사 구연, 학생 구연(석·박사), 3분 스피치 & 포스터(E-poster)'
    - 심포지엄은 초청 연사 전용
    - 발표 저자는 지정일까지 온라인 등록 필수
  acceptance_rate: null
  sources:
    - https://www.ksbb.or.kr/abstract/2026_spring/
    - https://www.ksbb.or.kr/abstract/2026_spring/green/info.html
    - https://www.ksbb.or.kr/abstract/2026_spring/overview/about.html
    - https://www.ksbb.or.kr/conference/past_conferences.html
usasp:
  about: >-
    미국 통증학회(USASP)의 연례 학술대회로, 기초·중개·임상 통증 연구자와 통증 관리·옹호 분야가 함께 모입니다. 매년 3월경 개최되며, 학회는 The Journal of Pain과 연계되어 있습니다. 2027년 대회는 덴버에서 3월
    15-18일(사전 워크숍 15일) 열립니다.
  topics:
    - Basic/preclinical science
    - Clinical/translational science
    - Engagement of people with lived experience
    - Pain management
    - Advocacy
  features:
    - 포스터 초록 250단어 이내, 한 문단, 그림·표 불가, 약어 불가
    - 1인당 발표저자(presenting author) 초록 1편만 허용, 미발표 연구 강력 선호
    - 포스터는 현장(in person) 발표
    - 초록은 The Journal of Pain supplement로 출판
    - 트레이니 대상 포스터상 및 트래블 어워드(등록비·숙박 3박·교통비 지원 등), 결과는 2027년 1월 통보
    - 심포지엄·사전 워크숍 제안 별도 공모
  acceptance_rate: null
  sources:
    - https://www.usasp.org/posterabstracts
    - https://www.usasp.org/event-details/2027-usasp-annual-scientific-meeting
    - https://www.usasp.org/callforworkshops2027
efic:
  about: >-
    유럽통증연맹(EFIC)이 주최하는 유럽 최대 통증 학술대회로, 2027년 제15회 'Pain in Europe XV'는 글래스고에서 4월 21-23일 열립니다. 공식 안내상 통증 분야 2,500명 이상이 참가하며 기초·중개·임상 연구를
    아우릅니다.
  topics:
    - Peripheral Mechanisms of Pain and Nociception
    - Central Mechanisms and Central Sensitization
    - Pain Modulation Systems
    - Neuroimmune and Inflammatory Mechanisms
    - Genetics, Epigenetics and Molecular Biology of Pain
    - Brain Mechanisms and Neuroimaging in Pain
    - Pain Phenotyping and Biomarkers
    - Experimental and Translational Pain Models
    - Mechanisms of Neuropathic Pain
    - Transition from Acute to Chronic Pain
    - Neuropathic Pain Disorders
    - Headache and Orofacial Pain
    - Novel and Emerging Analgesic Therapies
    - Neuromodulation and Neurostimulation
  features:
    - 초록 본문 250단어(제목 25단어, 대문자), 그림 최대 3개·표 최대 3개
    - 학술위원회의 블라인드 동료 심사로 발표 형식 결정
    - 포스터, Guided Poster Walk, 구연(최상위 초록) 중 선호 표시 가능
    - 채택 초록은 공식 학회 초록집에 수록
    - 1차 접수 초록만 포스터상 대상(ECR·박사과정), late-breaking은 2026년 12월 접수 시작·포스터만
    - 저소득·통화제한 국가 대상 재정 지원
  acceptance_rate: null
  sources:
    - https://europeanpainfederation.eu/efic2027/
    - https://europeanpainfederation.eu/efic2027/efic2027-abstract-submission/
    - https://europeanpainfederation.eu/efic2027/efic2027-congress-topics/
    - https://europeanpainfederation.eu/news/efic2027-abstract-submission-now-open/
neupsig:
  about: >-
    IASP 신경병성 통증 특별관심그룹(NeuPSIG, 1999년 설립, IASP 최대 SIG 중 하나)이 격년으로 여는 국제 신경병성 통증 학술대회입니다. 최근 런던(2019)·리스본(2023)·베를린(2025)에서 열렸고, 2027년은
    헬싱키에서 9월 2-4일 개최됩니다.
  topics:
    - Emerging mechanisms and molecular targets in neuropathic pain
    - Advances in phenotyping, biomarkers, and precision pain medicine
  features:
    - 연사 추천, 워크숍 제안, 초록 접수를 공모(마감일 미발표)
    - 프로그램에 구연 초록 세션과 포스터 발표 포함
    - 신경병성 통증 기전·평가·예방·치료에 특화된 학회
  acceptance_rate: null
  sources:
    - https://neupsigcongress.org/
    - https://www.iasp-pain.org/membership/special-interest-groups-sigs/neuropathic-pain-neupsig/
asra-pain:
  about: >-
    미국 부위마취·통증의학회(ASRA Pain Medicine)의 가을 연례 통증의학 학술대회로, 매년 11월 개최되며 2027년 제26회는 애틀랜타에서 열립니다. 수상 초록은 약 1,000명 앞에서 발표된다고 학회가 밝혔습니다. 연구
    초록(Scientific Abstracts)을 받으며 임상 중심입니다.
  topics:
    - Acute Pain
    - Chronic Pain
    - Regional Anesthesia
    - Emerging Technology
    - Education
    - Case Series (5+ patients)
    - Medically Challenging Cases
    - Safety/QA/QI Projects
  features:
    - 연구 초록 접수함(IRB 승인/면제 필수) - 단, 임상 위주 학회
    - 본문 500단어, 표 3개·이미지 2개·참고문헌 5개(단어 수 제외)
    - 위원 2인 이상 블라인드 심사(1-9점), 학회는 '동료 심사가 아님'이라 명시
    - 채택 초록은 모두 ePoster, 일부는 moderated oral poster 세션
    - RAPM에 제목·저자 목록 게재, 수상 초록은 전문 게재
    - Best of Meeting·전공의/펠로 트래블상(회원만), late-breaking 별도(수상 제외)
  acceptance_rate: null
  sources:
    - https://asra.com/events-education/event-item/2027/11/18/events/26th-annual-pain-medicine-meeting
    - https://asra.com/events-education/past-events/past-pain-medicine-meetings/fall-2025/abstracts
    - https://asra.com/about-asra/deadlines/deadline-item/2026/08/11/events/abstract-deadline-annual-pain-medicine-meeting
kasp:
  about: >-
    1983년 9월 2일 IASP 한국지부로 설립된 대한통증연구학회(IASP 한국 챕터)의 학술대회입니다. 마취통증의학과·신경과·신경외과·재활의학과·치과·기초의학자가 모이는 다학제 학회로, 매년 봄(3월)·가을(9-10월) 학술대회를 엽니다.
    학회지 International Journal of Pain은 KCI 등재지입니다.
  topics:
    - Head and Neck Pain (2026 추계 주제)
    - Neuropathic pain/삼차신경통
    - Cervicogenic headache
    - Basic pain research
    - Ultrasound-guided interventions
  features:
    - 초록은 영문만, 원저는 Background & objective/Methods/Results/Conclusions 구성
    - 온라인 접수만 가능, 학술위원회가 선별 후 개별 통보
    - 포스터 발표만(오프라인, 90×180cm)
    - 우수 포스터상 2편 시상
    - 초음파 차단술 워크숍 병행(2026 추계)
  acceptance_rate: null
  sources:
    - https://www.koreapain.org/
    - https://www.iasp-pain.org/membership/chapters/south-korea/
    - https://www.koreapain.org/abstract/2026_fall/info.html
    - https://www.koreapain.org/abstract/2026_fall/green/info.html
    - https://www.koreapain.org/abstract/2026_spring/intro.html
cvmi:
  about: >-
    CVPR에 매년 붙는 현미경 영상 분석 워크숍. 2026년이 11회째(CVPR 2026, Denver, 6월 4일, 하이브리드)이며 'Computer Vision and Multimodal Microscopy Image Analysis'로
    이름이 바뀜. 2027 워크숍 페이지는 아직 없음(CVPR 워크숍 제안 결정 2026-12-23).
  topics:
    - Microscopy image generation, annotation, augmentation, enhancement
    - Open-source datasets, software, benchmarking
    - Object detection, segmentation, classification
    - Stitching and registration
    - Tracking and event detection
    - Shape, texture and 3D analysis
    - Disease classification and prediction
    - Domain adaptation, OOD, foundation models
    - Explainability and domain knowledge integration
    - Mitigating hallucinations / reliable models
    - Multimodal microscopy + omics integration
    - AI-based cancer scoring
    - Efficient methods for drug design
  features:
    - CVPR 양식 8쪽(참고문헌 제외), 초과·양식 위반 시 심사 없이 reject
    - CVPR 정책에 따른 double-blind 심사, CMT 제출, 보충자료·rebuttal 없음
    - '아카이브: 채택 논문은 CVPR 워크숍 proceedings(CVF Open Access, IEEE Xplore) 게재, IEEE 저작권 이전'
    - 마감 연장 없음(hard deadline), 저자 1인 이상 현장 발표 필수
    - 2026에는 Work-in-Progress Spotlight 별도 마감(3/31 AoE) 존재
  acceptance_rate: null
  sources:
    - https://cvmi-workshop.github.io/callForPaper.html
    - https://cvmi-workshop.github.io/dates.html
    - https://cvmi-workshop.github.io/submission.html
    - https://openaccess.thecvf.com/CVPR2026_workshops/CVMI
    - https://cvpr.thecvf.com/Conferences/2027/Dates
    - https://cvpr.thecvf.com/Conferences/2027
bic:
  about: >-
    ICCV/ECCV에 붙는 바이오이미지 컴퓨팅 워크숍으로 2015년(CVPR)부터 거의 매년 열림. 최근: ICCV 2025(Honolulu), ECCV 2026(9월 9일, Malmö 일대). 주최 연락처는 University of
    Birmingham의 Alexander Krull. 다음 호스트로 예상되는 ICCV 2027용 공지는 아직 없음.
  topics:
    - Light and electron microscopy restoration and reconstruction
    - Deep learning for bioimaging
    - 3D registration
    - Segmentation of subcellular objects, cells, animals
    - Learning with little or no training data
    - Multimodal analysis (correlative LM/EM)
    - Cell and organism tracking
    - Motion estimation
    - Automated behavior recognition
    - Diffusion computation
    - Statistical shape analysis
    - Image-based phenotyping
    - Benchmarking and large labelled datasets
    - Interactive analysis
  features:
    - ECCV/ICCV 본회의 양식 논문, OpenReview 제출
    - Double-blind; 보충자료는 마감까지 본문과 함께 제출
    - '아카이브: CFP상 채택 논문은 conference proceedings 게재, ICCV 2025 BIC 논문은 CVF Open Access 워크숍 proceedings 수록'
    - '2026 일정: 제출 7/20(연장), camera-ready 8/15, 워크숍 9/9 (시간대 미표기)'
    - 주제에 LM/EM 복원·재구성이 명시되어 디노이징·3D 재구성 연구와 잘 맞음
  acceptance_rate: null
  sources:
    - https://bioimagecomputing.com
    - https://bioimagecomputing.com/call-for-papers/
    - https://openaccess.thecvf.com/ICCV2025_workshops/BIC
    - https://eccv2024.ecva.net/virtual/2026/workshop/3079
    - https://iccv.thecvf.com/
ntire:
  about: CVPR에 매년 열리는 영상 복원·향상 워크숍 겸 챌린지. 2026년이 11회째(6월 4일, Denver, Zoom 동시 중계)였고 47개 챌린지 운영. 2027 페이지는 아직 없음.
  topics:
    - Image/video denoising
    - Super-resolution
    - Deblurring
    - Inpainting
    - Dehazing, deraining, desnowing
    - Demosaicing
    - Compression artifact removal
    - Shadow, glare, reflection removal
    - Low-light enhancement
    - Hyperspectral and light field imaging
    - Image quality assessment
    - Restoration on mobile / constrained devices
    - Depth estimation, segmentation, saliency
    - Image generation and translation
  features:
    - CVPR 양식 8쪽(참고문헌 제외), 2단 PDF
    - Double-blind, 이중 투고 금지, CVPR 본회의 채택 논문 불가
    - '아카이브: CVPR 2026 Workshops proceedings(CVF Open Access, IEEE Xplore)'
    - '챌린지 방법 논문·타 학회 심사본은 별도 늦은 마감(2026: 3/22)'
    - Light field SR, 이미지 디노이징 등 챌린지 트랙과 수상 세션 운영
