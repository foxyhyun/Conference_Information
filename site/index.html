<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Deadlines</title>
  <meta name="description" content="Neurophotonics Lab — 학회·저널 마감 트래커 / conference & journal deadline tracker">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱</text></svg>">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div>
        <h1>Lab Deadlines</h1>
        <p class="sub" data-i18n="subtitle"></p>
      </div>
      <div class="top-right">
        <div class="seg lang" id="lang-seg">
          <button data-v="ko">한국어</button>
          <button data-v="en">English</button>
        </div>
        <div class="clock">
          <div id="now-kst" class="clock-time">--:--</div>
          <div class="clock-meta" id="updated"></div>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="conf" role="tab"><span data-i18n="tab_conf"></span> <span class="count" id="cnt-conf"></span></button>
      <button class="tab" data-tab="journal" role="tab"><span data-i18n="tab_journal"></span> <span class="count" id="cnt-journal"></span></button>
      <button class="tab" data-tab="cand" role="tab"><span data-i18n="tab_cand"></span> <span class="count" id="cnt-cand"></span></button>
    </nav>

    <section class="controls">
      <div class="chips" id="field-chips"></div>
      <div class="row">
        <div class="seg" id="region-seg">
          <button data-v="all" class="on" data-i18n="region_all"></button>
          <button data-v="intl" data-i18n="region_intl"></button>
          <button data-v="domestic" data-i18n="region_domestic"></button>
        </div>
        <label class="sel"><span data-i18n="sort"></span>
          <select id="sort"></select>
        </label>
        <label class="chk"><input type="checkbox" id="only-upcoming"> <span data-i18n="only_upcoming"></span></label>
        <label class="chk"><input type="checkbox" id="target-first" checked> <span data-i18n="target_first"></span></label>
        <input type="search" id="q">
      </div>
    </section>

    <div id="notice" class="notice" hidden></div>
    <section id="list" class="list" aria-live="polite"></section>

    <footer class="foot">
      <p data-i18n-html="foot_score"></p>
      <p data-i18n-html="foot_warn"></p>
      <p data-i18n-html="foot_src"></p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
